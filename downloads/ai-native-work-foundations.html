<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 原生工作基础</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --panel: #fffdf8;
      --panel-strong: #ffffff;
      --text: #24211b;
      --muted: #746d60;
      --line: #ded7c8;
      --accent: #206a5d;
      --accent-soft: #e3f1eb;
      --mark: #fff1a8;
      --shadow: 0 18px 50px rgba(57, 45, 27, 0.12);
      --reader-width: 760px;
      --font-size: 19px;
      --line-height: 1.88;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #151515;
      --panel: #202020;
      --panel-strong: #262626;
      --text: #eee9de;
      --muted: #aaa294;
      --line: #393734;
      --accent: #7bc8b6;
      --accent-soft: #17332d;
      --mark: #6a5818;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 100vh;
    }

    body[data-view="home"] .app,
    body[data-view="bookstore"] .app,
    body[data-view="about"] .app {
      grid-template-columns: 1fr;
    }

    body[data-view="home"] .sidebar,
    body[data-view="bookstore"] .sidebar,
    body[data-view="about"] .sidebar,
    body[data-view="home"] .topbar,
    body[data-view="bookstore"] .topbar,
    body[data-view="about"] .topbar {
      display: none;
    }

    .public-nav {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 42px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 8;
    }

    body[data-view="home"] .public-nav,
    body[data-view="bookstore"] .public-nav,
    body[data-view="about"] .public-nav {
      display: flex;
    }

    .public-brand {
      font-size: 15px;
      font-weight: 900;
      color: var(--text);
    }

    .public-nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .public-nav .text-button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 18px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
    }

    .brand {
      margin: 0 0 16px;
      font-size: 20px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: 0;
    }

    .book-picker {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .book-select {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      outline: none;
      font-weight: 800;
    }

    .book-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .site-nav {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .site-nav .text-button {
      width: 100%;
    }

    .site-nav .active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    body.single-book .site-nav,
    body.single-book .book-picker,
    body.single-book .import-tools {
      display: none !important;
    }

    .import-tools {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .drop-zone {
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
    }

    .hidden-input {
      display: none;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr;
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      min-height: 40px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .part-title {
      margin: 18px 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .chapter-list {
      display: grid;
      gap: 6px;
    }

    .chapter-button {
      width: 100%;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: start;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .chapter-button:hover,
    .chapter-button.active {
      background: var(--accent-soft);
    }

    .chapter-num {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }

    .chapter-name {
      min-width: 0;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
    }

    .chapter-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 10px 26px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px);
    }

    .current-title {
      min-width: 0;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-button,
    .text-button {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
    }

    .icon-button {
      padding: 0;
      font-size: 18px;
    }

    .icon-button:hover,
    .text-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .progress-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: 3px;
      background: transparent;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 120ms linear;
    }

    .reader-shell {
      padding: 44px 28px 70px;
    }

    body[data-view="home"] .reader-shell,
    body[data-view="bookstore"] .reader-shell,
    body[data-view="about"] .reader-shell {
      padding: 60px 46px 70px;
    }

    .reader {
      width: min(var(--reader-width), 100%);
      margin: 0 auto;
      padding: 54px 58px 64px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    body[data-view="home"] .reader,
    body[data-view="bookstore"] .reader,
    body[data-view="about"] .reader {
      width: min(1120px, 100%);
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    body[data-view="home"] .search-row,
    body[data-view="home"] #toc,
    body[data-view="home"] .notes-panel,
    body[data-view="bookstore"] .search-row,
    body[data-view="bookstore"] #toc,
    body[data-view="bookstore"] .notes-panel,
    body[data-view="about"] .search-row,
    body[data-view="about"] #toc {
      display: none;
    }

    .article-meta {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .content {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Serif CJK SC", serif;
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: break-word;
    }

    .content h1,
    .content h2,
    .content h3 {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .content h1 {
      margin: 0 0 28px;
      font-size: 34px;
    }

    .content h2 {
      margin: 44px 0 16px;
      font-size: 25px;
      border-top: 1px solid var(--line);
      padding-top: 30px;
    }

    .content h3 {
      margin: 28px 0 10px;
      font-size: 20px;
    }

    .content p {
      margin: 14px 0;
    }

    .content blockquote {
      margin: 24px 0;
      padding: 14px 18px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 8px 8px 0;
    }

    .content hr {
      margin: 34px 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .content ul,
    .content ol {
      padding-left: 1.4em;
    }

    .content table {
      width: 100%;
      margin: 24px 0;
      border-collapse: collapse;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 0.92em;
      line-height: 1.55;
    }

    .content th,
    .content td {
      padding: 10px 12px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .content th {
      background: var(--accent-soft);
      color: var(--text);
      font-weight: 800;
    }

    .content mark {
      background: var(--mark);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    .content pre {
      margin: 24px 0;
      padding: 16px 18px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      font-family: "Consolas", "Microsoft YaHei", monospace;
      font-size: 0.86em;
      line-height: 1.55;
      white-space: pre;
    }

    .home-kicker {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
    }

    .home-title {
      margin: 0 0 22px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 52px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .home-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 36px;
      align-items: center;
      min-height: min(660px, calc(100vh - 150px));
    }

    .home-copy {
      min-width: 0;
    }

    .home-lede {
      max-width: 680px;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 21px;
      line-height: 1.75;
    }

    .home-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 24px 0 34px;
    }

    .book-shelf {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 18px;
      align-self: stretch;
      align-content: center;
    }

    .bookstore-title {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.25;
      font-weight: 900;
    }

    .bookstore-lede {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .book-cover {
      position: relative;
      display: grid;
      align-content: space-between;
      min-height: 330px;
      padding: 34px 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--panel-strong) 92%, var(--accent-soft)), var(--panel-strong));
      color: var(--text);
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .book-cover::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      border-radius: 6px;
      pointer-events: none;
    }

    .book-cover:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      transition: transform 160ms ease, border-color 160ms ease;
    }

    .cover-kicker {
      position: relative;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .cover-title {
      position: relative;
      display: block;
      margin: 46px 0 18px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 34px;
      line-height: 1.22;
      font-weight: 900;
      letter-spacing: 0;
    }

    .cover-subtitle {
      position: relative;
      display: block;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .cover-footer {
      position: relative;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .source-list {
      display: grid;
      gap: 10px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .source-list a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    .source-list a:hover {
      text-decoration: underline;
    }

    .footer-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: min(var(--reader-width), 100%);
      margin: 18px auto 0;
    }

    .nav-card {
      min-height: 76px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .nav-card[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .nav-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .nav-title {
      margin-top: 6px;
      font-weight: 800;
      line-height: 1.4;
    }

    .note-highlight {
      background: color-mix(in srgb, var(--mark) 75%, var(--accent-soft));
      border-bottom: 2px solid var(--accent);
      cursor: pointer;
    }

    .selection-popup {
      position: fixed;
      z-index: 30;
      width: min(360px, calc(100vw - 24px));
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      box-shadow: var(--shadow);
      display: none;
      gap: 10px;
    }

    .selection-popup.open {
      display: grid;
    }

    .selection-popup-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .selection-popup-title {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
    }

    .popup-close {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .popup-close:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .selected-preview {
      max-height: 72px;
      overflow: auto;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    .note-input {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      line-height: 1.5;
    }

    .popup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .text-button[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
      color: var(--muted);
      border-color: var(--line);
    }

    .notes-panel {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .notes-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .note-list {
      display: grid;
      gap: 8px;
    }

    .note-item {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .note-quote {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 800;
    }

    .note-text {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .mobile-menu {
      display: none;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        width: min(84vw, 330px);
        transform: translateX(-105%);
        transition: transform 180ms ease;
        box-shadow: var(--shadow);
      }

      body.menu-open .sidebar {
        transform: translateX(0);
      }

      .mobile-menu {
        display: inline-grid;
        place-items: center;
      }

      .topbar {
        padding: 10px 12px;
      }

      .reader-shell {
        padding: 20px 12px 46px;
      }

      body[data-view="home"] .reader-shell,
      body[data-view="bookstore"] .reader-shell,
      body[data-view="about"] .reader-shell {
        padding: 24px 16px 46px;
      }

      .reader {
        padding: 30px 20px 42px;
      }

      .content h1 {
        font-size: 28px;
      }

      .content h2 {
        font-size: 22px;
      }

      .home-title {
        font-size: 34px;
      }

      .home-lede {
        font-size: 18px;
      }

      .home-layout {
        grid-template-columns: 1fr;
        min-height: 0;
        gap: 28px;
      }

      .public-nav {
        padding: 14px 14px;
        align-items: flex-start;
        flex-direction: column;
      }

      .public-nav-links {
        width: 100%;
      }

      .public-nav .text-button {
        flex: 1;
      }

      .book-shelf {
        grid-template-columns: 1fr;
      }

      .book-cover {
        min-height: 300px;
      }

      .selection-popup {
        left: 12px !important;
        right: 12px;
        bottom: 12px;
        top: auto !important;
        width: auto;
      }

      .footer-nav {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="progress-wrap" aria-hidden="true"><div class="progress" id="progress"></div></div>
  <nav class="public-nav" aria-label="站点导航">
    <div class="public-brand">Library to Allie and her generation</div>
    <div class="public-nav-links">
      <button class="text-button" id="publicHomeButton" type="button">首页</button>
      <button class="text-button" id="publicBookstoreButton" type="button">书城</button>
      <button class="text-button" id="publicAboutButton" type="button">关于</button>
    </div>
  </nav>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <h1 class="brand" id="libraryTitle">AI 原生工作基础</h1>
      <div class="site-nav">
        <button class="text-button" id="homeButton" type="button">首页</button>
        <button class="text-button" id="bookstoreButton" type="button">书城</button>
        <button class="text-button" id="aboutButton" type="button">关于</button>
      </div>
      <div class="book-picker" id="bookPicker">
        <select class="book-select" id="bookSelect" aria-label="选择书籍"></select>
        <div class="book-description" id="bookDescription"></div>
      </div>
      <div class="import-tools" id="importTools">
        <button class="text-button" id="importButton" type="button">导入 MD 成书</button>
        <input class="hidden-input" id="fileInput" type="file" accept=".md,text/markdown,text/plain" multiple>
        <div class="drop-zone" id="dropZone">拖一批 Markdown 到这里</div>
      </div>
      <div class="search-row">
        <input class="search" id="search" type="search" placeholder="搜索章节或正文" autocomplete="off">
      </div>

  <script id="library-data" type="application/json">{"title":"AI 原生工作基础","authorTools":false,"singleBook":true,"books":[{"id":"ai-native-work-foundations","title":"AI 原生工作基础","author":"刘晃（Alex Liu）","description":"接在《AI 素养基础》之后，讨论个人、团队和组织如何把 AI 变成真正的工作方式。","singleOutput":"downloads/ai-native-work-foundations.html","chapters":[{"id":"ai-native-work-foundations-part-1-1","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Introduction.md","partKey":"part-1","partTitle":"开篇","chapterInPart":1,"globalChapter":0,"numberLabel":"引","metaLabel":"引言","title":"写在前面","markdown":"# 写在前面\n\n读这本书之前，建议先读《AI 素养基础》——第一册建立的认知框架，是这本书所有内容的基础。\n\n如果你已经读过第一册，或者你有一定的 AI 使用经验，可以直接从这里开始。\n\n---\n","wordCount":87},{"id":"ai-native-work-foundations-part-2-1","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Ch1.md","partKey":"part-2","partTitle":"正文","chapterInPart":1,"globalChapter":1,"numberLabel":"","metaLabel":"","title":"第一章：从传统工作到 AI-native 工作","markdown":"# 第一章：从传统工作到 AI-native 工作\n\n> 读完这章，你会知道\"用了 AI\"和\"AI-native 工作方式\"之间，差距在哪里。\n\n---\n\n## 先问你一个问题\n\n你的团队现在在用 AI 吗？\n\n很多人的答案是：\"有啊，我们有些同事在用 ChatGPT。\"\n\n那你们是一个 AI-native 的团队吗？\n\n大概率不是。\n\n\"有人在用 AI\"和\"团队以 AI-native 的方式工作\"，是两件完全不同的事。就像\"公司里有人会用 Excel\"和\"公司建立了数据驱动的决策体系\"，中间差了一个数量级的距离。\n\n这一章，我们来搞清楚这个距离到底在哪里。\n\n---\n\n## 你的组织现在在哪里？——AI 成熟度模型\n\n在说工作方式的演变之前，我们先建立一个坐标系。\n\n这个坐标系有两个维度：**个人维度**和**组织维度**。\n\n为什么要分开？因为这两个维度经常不同步——你个人可能已经很熟练地在用 AI，但你的组织还没有任何系统性的支持；或者反过来，公司买了很多 AI 工具，但员工其实不知道怎么用。\n\n这个不同步本身，就是一个值得关注的信号。\n\n---\n\n### AI 成熟度模型：个人维度\n\n| 级别 | 描述 | 典型表现 |\n|------|------|---------|\n| **Level 0** | 不用 AI | 从未主动使用过任何 AI 工具 |\n| **Level 1** | 偶尔用 | 偶尔问问 ChatGPT、文心一言，但没有固定习惯 |\n| **Level 2** | 固定任务使用 | 有几件固定的事情会用 AI 做，比如每次写邮件前先让 AI 起草 |\n| **Level 3** | 嵌入工作流 | AI 已经成为日常工作流程的一部分，不用反而觉得缺了什么 |\n| **Level 4** | 人机协作 | 能有策略地分配任务给 AI，懂得验证输出，AI 和自己形成稳定的协作节奏 |\n| **Level 5** | 自主编排 | 能设计和管理 AI 工作流，让多个 AI 工具协同完成复杂任务 |\n\n---\n\n### AI 成熟度模型：组织维度\n\n| 级别 | 描述 | 典型表现 |\n|------|------|---------|\n| **Level 0** | 无 AI | 没有任何 AI 工具采购或政策 |\n| **Level 1** | 散点使用 | 员工自发使用个人 AI 账号，公司没有统一立场 |\n| **Level 2** | 部门级试点 | 某些部门开始系统性使用 AI，但没有跨部门协调 |\n| **Level 3** | 工作流整合 | AI 工具被整合进标准工作流程，有使用规范和数据安全政策 |\n| **Level 4** | 人机协作标准化 | 人机协作成为组织的标准工作模式，有培训、有治理、有审计 |\n| **Level 5** | Agent 编排运营 | 自动化 AI 工作流处理大量任务，人负责监督、例外处理和战略决策 |\n\n---\n\n### 读这个模型的方式\n\n**第一步：给自己定位。** 你个人现在在哪个级别？\n\n**第二步：给你的组织定位。** 你的团队或公司现在在哪个级别？\n\n**第三步：看两个维度的差距。** 如果你个人是 Level 3，但组织是 Level 1，这意味着什么？\n\n通常，个人超前于组织，说明有先行者在自发探索，但缺乏系统支持，效果打折扣，而且有数据安全风险（因为没有统一政策）。\n\n组织超前于个人，说明工具买了，但员工能力没跟上，投资在空转。\n\n**本书接下来的内容，就是帮你和你的组织，系统性地从现在的位置，走向下一个级别。**\n\n---\n\n## 三种工作方式的演变\n\n有了坐标系，我们来看工作方式本身是如何演变的。\n\n### 传统工作方式\n\n人完成所有的认知任务。从信息收集、分析、起草、到决策，全链条由人来做。\n\n工具辅助人，但工具只是执行人的指令——Excel 帮你算数字，但你告诉它算什么；Word 帮你排版，但你写每一个字。\n\n效率瓶颈在人的时间和精力。\n\n### AI 辅助工作方式\n\n人仍然主导整个工作流，但在特定环节引入 AI 来提速。\n\n比如：起草邮件的时候用 AI 生成初稿，自己修改后发出；写报告前用 AI 整理资料，自己负责分析和判断。\n\nAI 是一个随时可以调用的助手，但它不在工作流里有固定的位置——用不用、什么时候用，全凭个人习惯。\n\n这是大多数人现在的状态：Level 1 到 Level 2 之间。\n\n### AI-native 工作方式\n\n工作流本身是围绕人机协作设计的。\n\nAI 不是\"额外加进来的工具\"，而是工作流的基础设施。每个环节，都预设了人和 AI 各自负责什么，输出标准是什么，如何交接，如何验证。\n\n比如：一份研究报告的生产流程是——AI 负责信息收集和初步整理，人负责框架判断和核心观点，AI 负责初稿生成，人负责深度审核和修改，AI 负责格式整理和多版本输出。\n\n这个流程里，人和 AI 都有明确的角色，效率是传统方式的数倍，质量由人来把关。\n\n这是 Level 3 到 Level 4 的状态。\n\n---\n\n## Human-in-the-loop：一个必须理解的概念\n\nAI-native 工作方式有一个核心原则，叫做 **Human-in-the-loop（人在回路中）**。\n\n意思是：无论 AI 在工作流里承担多少任务，关键节点上永远有人在做判断和决策。\n\n这不只是一个安全建议，而是一个工作设计原则。\n\n为什么？\n\n因为 AI 的输出是概率性的，不是保证性的。它可能在99%的情况下都做对了，但那1%的错误，可能发生在最关键的地方。人在回路中，是为了捕捉那1%，并且承担最终责任。\n\n**在实践中，Human-in-the-loop 意味着：**\n- 每个 AI 的重要输出，都有人审核后才能对外使用\n- 高风险决策（涉及客户、财务、法律），AI 只能辅助，不能主导\n- 有明确的升级路径：当 AI 遇到它处理不了的情况，知道该转给谁\n\n这个原则，在接下来的每一章里都会出现。\n\n---\n\n## AI 作为操作层\n\n最后说一个思维框架，帮你理解 AI-native 组织是怎么运转的。\n\n在传统组织里，人是执行层——人接收任务，人完成工作。\n\n在 AI-native 组织里，AI 开始成为执行层的一部分——大量的信息处理、内容生成、数据分析，由 AI 承担；人则更多地扮演**规划者、审核者、决策者和例外处理者**的角色。\n\n这不是说人变得不重要了。恰恰相反——人承担的，是更高价值、更需要判断力的那部分工作。\n\n但这需要组织有意识地重新设计工作流，而不只是\"把 AI 工具发给员工，让他们自己摸索\"。\n\n这个设计，就是本书接下来要讲的内容。\n\n---\n\n## 📌 本章要点卡\n\n1. \"有人在用 AI\"和\"AI-native 工作方式\"之间，差距是系统性的——不是工具问题，是工作流设计问题\n2. AI 成熟度模型有**个人**和**组织**两个维度——两个维度的差距，往往比级别本身更值得关注\n3. AI-native 工作的核心原则：**Human-in-the-loop**——关键节点永远有人在判断和负责\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 用成熟度模型，**给自己和你的组织各打一个分**——两个维度的差距是多少？\n- [ ] 想一件你现在做的工作，画出它的流程——**哪些环节可以由 AI 承担，哪些环节必须由人来做？**\n- [ ] 和你的团队分享 Human-in-the-loop 这个概念，问问大家：**我们现在哪些地方缺少这个\"人在回路\"？**\n\n---\n\n*下一章：AI 时代的岗位变化——不是消失，而是转型*\n\n\n---\n","wordCount":2828},{"id":"ai-native-work-foundations-part-2-2","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Ch2.md","partKey":"part-2","partTitle":"正文","chapterInPart":2,"globalChapter":2,"numberLabel":"","metaLabel":"","title":"第二章：AI 时代的岗位变化","markdown":"# 第二章：AI 时代的岗位变化\n\n> 读完这章，你会明白：不是工作消失了，而是工作的能力模型在改变。\n\n---\n\n## 一个让人紧张的问题\n\n\"AI 会不会取代我的工作？\"\n\n这个问题，几乎每个知识工作者都在心里问过。\n\n我们在《AI 素养基础》的最后一章说过：AI 替代的是任务，不是工作。\n\n这一章，我们把这个结论放到组织的语境里说得更具体一点——当 AI 进入一个组织，岗位的**能力模型**会发生什么变化，以及在这个变化里，什么样的人会越来越有价值。\n\n---\n\n## 一个正在发生的角色转变\n\n用一条线来描述这个变化：\n\n**执行者 → 编排者（Executor → Orchestrator）**\n\n过去，很多知识工作岗位的核心价值，在于\"做\"——收集信息、整理数据、起草文件、生成报告。\n\n这些\"做\"的动作，AI 现在能承担相当大的一部分。\n\n那人的价值去哪里了？\n\n**去了更上游的地方：**决定做什么、怎么做、做完之后对不对、出了问题怎么处理。\n\n这就是\"编排者\"的角色——不是亲手做每一件事，而是设计任务、分配任务（包括分配给 AI）、审核结果、处理例外。\n\n---\n\n## AI 时代正在出现的五种关键角色\n\n这五种角色，不是五种新的职位，而是在几乎所有岗位里，越来越重要的五种**能力维度**。\n\n### 1. 审核者（Reviewer）\n\nAI 生成了内容，谁来判断它对不对？谁来保证质量？\n\n这个角色在 AI-native 组织里极其重要。它需要的不只是\"看一遍\"的能力，而是：\n\n- 知道 AI 在哪类任务上容易出错\n- 能快速识别输出里的逻辑漏洞、事实错误、风险信号\n- 能在有限时间内做出\"这个可以用\"还是\"这个需要返工\"的判断\n\n审核者不是在重复 AI 的工作，而是在为 AI 的工作做质量背书。\n\n### 2. AI 督导（AI Supervisor）\n\n当一个工作流里有多个 AI 工具在协同工作时，谁来监督整个流程？\n\nAI 督导负责：\n- 设定 AI 工作流的目标和标准\n- 监控 AI 的输出是否符合预期\n- 在 AI 偏离方向时介入纠正\n- 记录 AI 工作流的表现，持续优化\n\n这个角色，在 Level 4 到 Level 5 的组织里会越来越普遍。\n\n### 3. 例外处理者（Exception Handler）\n\nAI 擅长处理标准情况。当情况不标准时——客户有特殊需求、数据出现异常、流程遇到意外——AI 不知道怎么办，或者它的处理方式不对。\n\n这时候，例外处理者介入。\n\n这个角色需要：\n- 快速判断\"这是 AI 能处理的，还是需要人介入的\"\n- 在人介入时，能高效地解决非标准情况\n- 把处理结果反馈回系统，让 AI 下次能更好地应对类似情况\n\n### 4. 决策所有者（Decision Owner）\n\nAI 可以给你十个选项，可以分析每个选项的优劣，可以预测不同选择的结果。\n\n但它不能帮你做决定。\n\n决策所有者的价值，在于：\n- 在 AI 提供的信息基础上，做出有价值判断的最终决定\n- 为这个决定承担责任\n- 在不确定性下，用自己的经验和判断填补 AI 无法处理的空白\n\n### 5. 流程设计者（Process Designer）\n\n这是一个相对新的角色，但正在变得越来越重要。\n\n流程设计者负责回答：**这件事，人和 AI 应该怎么分工？**\n\n- 哪些步骤交给 AI，哪些步骤必须由人来做\n- AI 的输入是什么，输出标准是什么\n- 如何验证 AI 的输出\n- 当出现问题时，升级路径是什么\n\n能做好流程设计的人，正在成为 AI-native 组织里的核心人才。\n\n---\n\n## 用一个真实场景来理解这五个角色\n\n**场景：** 一家咨询公司，用 AI 辅助生产客户报告。\n\n传统方式：顾问自己做调研、自己写报告、自己检查、自己发给客户。一份报告可能需要一周。\n\nAI-native 方式：\n\n- **流程设计者**（通常是项目负责人）设计这份报告的生产流程：哪部分让 AI 先做信息整合，哪部分由顾问来写核心洞察，最后谁来做整体审核。\n- **AI 督导**监控 AI 在信息整合阶段的输出，确保方向正确。\n- **审核者**（可能就是顾问本人）拿到 AI 生成的初稿，做深度审核和修改。\n- **例外处理者**处理客户的特殊需求，或者 AI 生成的内容里出现的非标准情况。\n- **决策所有者**（项目负责人）最终拍板：这份报告可以发出去了。\n\n结果：同样质量的报告，可能两天内完成。\n\n---\n\n## 这对你意味着什么？\n\n如果你是**个人贡献者**：\n\n开始有意识地培养\"审核者\"和\"例外处理者\"的能力——这两个角色，在 AI-native 工作流里最直接对应个人贡献者的新价值。\n\n如果你是**管理者**：\n\n开始思考你的团队需要哪些\"流程设计者\"和\"决策所有者\"。这些角色不是凭空出现的，需要你有意识地培养和分配。\n\n如果你在做**组织设计**：\n\n传统的 JD（职位描述）里，能力要求是\"能做X任务\"。AI 时代的 JD，能力要求需要加上：\"能有效使用 AI 完成 X 任务，并对 AI 的输出做出专业判断\"。\n\n---\n\n## 📌 本章要点卡\n\n1. AI 时代岗位的核心变化：从**执行者**到**编排者**——不是做每件事，而是设计、分配、审核、决策\n2. 五个关键能力维度：**审核者、AI督导、例外处理者、决策所有者、流程设计者**\n3. 这不是五个新职位，而是几乎所有岗位都需要开始具备的**新能力维度**\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 对照五个角色，想想你现在的工作里**最缺哪个维度**？\n- [ ] 如果你管团队，**重新看一遍你团队成员的 JD**——哪些能力描述需要加入 AI 协作的维度？\n- [ ] 找一个你觉得\"AI 可能要替代\"的任务，想想在新的角色框架下，**人的价值在哪里**？\n\n---\n\n*下一章：结构化 AI 工作流——如何把 AI 真正嵌入你的工作流程*\n\n\n---\n","wordCount":2211},{"id":"ai-native-work-foundations-part-2-3","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Ch3.md","partKey":"part-2","partTitle":"正文","chapterInPart":3,"globalChapter":3,"numberLabel":"","metaLabel":"","title":"第三章：结构化 AI 工作流","markdown":"# 第三章：结构化 AI 工作流\n\n> 读完这章，你会知道如何把 AI 真正嵌入工作流程——不是随用随丢，而是系统性地提升产出。\n\n---\n\n## 为什么\"随便用用\"不够？\n\n很多团队的 AI 使用现状是这样的：\n\n谁想用就用，用什么工具自己决定，怎么用自己摸索，用完的结果自己判断。\n\n这种方式的问题不是\"没有用 AI\"，而是：\n\n- 质量不稳定——同样的任务，不同的人用 AI 做出来的结果差异很大\n- 没有积累——每个人都在重新摸索，没有形成可以复用的经验\n- 有安全风险——没有统一规范，数据安全无法保证\n- 效率天花板低——个人的探索总是有边界的，系统性的工作流设计能走得更远\n\n**结构化 AI 工作流**，就是解决这些问题的方法。\n\n---\n\n## 什么是结构化 AI 工作流？\n\n简单说：**把\"人和 AI 如何协作完成一件事\"，设计成一个可以重复执行的流程。**\n\n这个流程包括：\n- 每个步骤由谁来做（人、还是 AI、还是人机协作）\n- 每个步骤的输入是什么，输出标准是什么\n- AI 的输出如何被验证\n- 出现问题时，如何升级处理\n\n听起来有点像传统的流程管理——确实如此。结构化 AI 工作流，本质上是把 AI 当成一个有能力但需要监督的\"团队成员\"，设计它在团队里的工作方式。\n\n---\n\n## 一个通用的结构化工作流框架\n\n大多数知识工作任务，都可以用这个框架来设计 AI 工作流：\n\n### 第一步：任务拆解（Task Decomposition）\n\n把一个完整的任务，拆成具体的子任务。\n\n问自己：这件事可以分成哪几个步骤？每个步骤的目标是什么？\n\n**例子：** 生产一份竞争对手分析报告\n\n拆解后：\n1. 收集竞争对手的公开信息\n2. 整理信息，按维度分类\n3. 分析各维度的差异和趋势\n4. 形成核心洞察和建议\n5. 撰写报告初稿\n6. 审核和修改\n7. 最终输出\n\n---\n\n### 第二步：人机分工（Role Assignment）\n\n对每个子任务，决定由谁来做。\n\n**判断原则：**\n- 信息收集、整理、分类、格式化 → 通常适合 AI\n- 判断、洞察、价值取舍、对外负责 → 通常需要人\n- 初稿生成 → AI 生成，人审核修改\n- 例外情况处理 → 人\n\n**继续上面的例子：**\n\n| 子任务 | 执行者 | 说明 |\n|--------|--------|------|\n| 收集公开信息 | AI（配联网工具） | AI 搜索整合 |\n| 整理分类 | AI | 按预设维度结构化 |\n| 分析差异和趋势 | 人+AI | AI 生成初步分析，人深化判断 |\n| 核心洞察和建议 | 人 | 这是核心价值所在 |\n| 撰写报告初稿 | AI | 基于人提供的洞察生成初稿 |\n| 审核和修改 | 人 | 质量把关 |\n| 最终输出 | AI | 格式整理、多版本生成 |\n\n---\n\n### 第三步：定义输出标准（Output Standards）\n\n对每个 AI 负责的步骤，明确\"什么样的输出是合格的\"。\n\n这一步很多团队会跳过，但它非常重要。\n\n没有明确的输出标准，审核者不知道该看什么，AI 的输出质量也难以稳定。\n\n**输出标准通常包括：**\n- 格式要求（字数、结构、是否需要表格）\n- 内容要求（必须覆盖哪些维度，不能出现什么）\n- 质量指标（准确性、完整性、一致性）\n- 审核重点（这类输出里最容易出错的地方）\n\n---\n\n### 第四步：建立审核节点（Review Checkpoints）\n\n在工作流里，明确哪些节点需要人工审核，以及审核的标准是什么。\n\n**关键原则：** 不是每个步骤都需要深度审核，但高风险输出（对外使用的、涉及重要数字的、有法律影响的）必须有审核节点。\n\n**审核节点的设计：**\n- 审核谁来做（职级要求、专业背景要求）\n- 审核看什么（审核清单）\n- 审核完成的标志（批准 / 返工 / 升级）\n- 审核的时间预算（给审核留够时间，不要让审核变成走过场）\n\n---\n\n### 第五步：设计升级路径（Escalation Paths）\n\n当 AI 的输出不合格，或者出现 AI 无法处理的情况时，谁来介入？怎么介入？\n\n这是很多团队忽视的一步，但在实际运行中非常重要。\n\n**升级路径需要明确：**\n- 什么情况触发升级（AI 输出质量不达标、出现不确定的边界情况、涉及高风险决策）\n- 升级给谁（对应的专业人员、管理者）\n- 升级的响应时间要求\n- 升级后的处理结果如何反馈回工作流\n\n---\n\n### 第六步：确保可审计性（Auditability）\n\n在组织环境里，AI 工作流的输出需要是可追溯的：\n\n- 这个输出是 AI 生成的，还是人写的？\n- 哪个版本经过了哪些人的审核？\n- 用的是什么 AI 工具、什么版本的模型？\n- 输入的原始数据是什么？\n\n可审计性不只是合规要求，也是质量管理和责任追溯的基础。\n\n---\n\n## 一个具体的工作流模板\n\n把上面六个步骤综合起来，你可以用这个模板来设计任何任务的 AI 工作流：\n\n```\n任务名称：\n任务目标：\n\n【步骤拆解】\n步骤1：___  执行者：___  输出标准：___\n步骤2：___  执行者：___  输出标准：___\n...\n\n【审核节点】\n节点1：在步骤___完成后  审核人：___  审核清单：___\n节点2：在步骤___完成后  审核人：___  审核清单：___\n\n【升级路径】\n触发条件：___  升级给：___  响应时间：___\n\n【可审计记录】\n需要保留：___\n```\n\n这个模板不需要第一次就设计完美，可以在实际运行中不断迭代。\n\n---\n\n## 从个人工作流开始\n\n如果你是个人，还没有团队层面的 AI 工作流——从你自己最常做的一件事开始。\n\n**三步走：**\n\n第一步：选一件你每周重复做的工作任务（写周报、整理会议纪要、做竞品研究……）\n\n第二步：用上面的框架，把这件事拆解成子任务，决定哪些让 AI 做、哪些自己做、如何验证\n\n第三步：执行一次，记录哪里顺利、哪里不顺利，调整后再执行\n\n三次迭代之后，你会有一个相对稳定的个人 AI 工作流。这个工作流，之后可以分享给团队。\n\n---\n\n## 📌 本章要点卡\n\n1. 结构化 AI 工作流的核心：**把人机协作的方式设计成可重复执行的流程**，而不是每次都重新摸索\n2. 六个关键步骤：**任务拆解 → 人机分工 → 输出标准 → 审核节点 → 升级路径 → 可审计性**\n3. 从你自己最常做的一件事开始——**个人工作流先跑通，再推广到团队**\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 选一件你每周重复做的工作任务，用本章的框架**画出它的 AI 工作流**\n- [ ] 检查你现有的 AI 使用方式：**有没有明确的输出标准和审核节点？** 没有的话，加上\n- [ ] 如果你管团队，找一个团队里最常见的任务类型，**一起设计一版标准 AI 工作流**，试运行两周\n\n---\n\n*下一章：人工监督与责任边界——谁来兜底？*\n\n\n---\n","wordCount":2363},{"id":"ai-native-work-foundations-part-2-4","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Ch4.md","partKey":"part-2","partTitle":"正文","chapterInPart":4,"globalChapter":4,"numberLabel":"","metaLabel":"","title":"第四章：人工监督与责任边界","markdown":"# 第四章：人工监督与责任边界\n\n> 读完这章，你会知道在 AI-native 工作流里，人的最后一道防线在哪里，以及如何设计它。\n\n---\n\n## 一个必须先说清楚的问题\n\nAI 做了这么多事，出了问题，谁来负责？\n\n这个问题不是哲学问题，是非常实际的管理问题。\n\n答案在上一章我们已经提到过：**AI 不能承担责任。使用 AI 的人和组织，承担最终责任。**\n\n这条原则，直接决定了组织在设计 AI 工作流时，必须回答的一个核心问题：\n\n**在哪些地方，必须有人来做最终判断？**\n\n这一章，我们把这个问题说清楚。\n\n---\n\n## 为什么人工监督不能省略？\n\n有些团队在用 AI 一段时间后，会有这样的想法：\n\n\"这个任务 AI 做得挺好的，我们每次都审一遍，感觉有点多余，能不能跳过？\"\n\n这个想法有它的合理性——如果 AI 一直做对，审核确实看起来像是在浪费时间。\n\n但这里有一个被低估的风险：**AI 做错的时候，往往不是在你预期的地方。**\n\n它可能连续100次都做对了，然后在第101次，在一个你完全没预料到的地方，做出一个严重的错误。\n\n而如果你已经习惯性地跳过审核，这个错误就直接进入了下一个环节——可能是发给客户的邮件，可能是提交给监管机构的报告，可能是一个影响上百万用户的系统决策。\n\n**人工监督的价值，不在于它每次都发现问题，而在于它在关键时刻能兜住问题。**\n\n---\n\n## 三个必须有人在场的场景\n\n不是所有 AI 输出都需要同等级别的人工监督。但以下三类场景，无论如何都必须有人在最终关口做判断：\n\n### 场景一：对外输出\n\n任何会到达组织边界之外的内容——发给客户的邮件、提交给监管机构的文件、面向公众的发布内容——都必须经过人工审核后才能发出。\n\n原因很简单：一旦发出去，你没有办法撤回。外部受众不会因为\"这是 AI 写的\"而原谅错误，责任仍然由发出方承担。\n\n### 场景二：高风险决策\n\n涉及重大金额、法律义务、人员任免、客户关键利益的决策，AI 只能提供分析和建议，最终决定必须由有相应权限的人来做。\n\n这不只是\"谨慎\"，而是**权限边界**的问题。AI 没有被授权做这些决定，所以它做的任何\"决定\"在法律和组织意义上都是无效的。\n\n### 场景三：例外和边界情况\n\n当一个情况不符合 AI 被训练来处理的标准模式时——客户有特殊需求、数据出现异常、政策刚刚更新、情况涉及伦理判断——人必须介入。\n\nAI 在边界情况下的可靠性大幅下降。不承认这一点，是很多 AI 工作流出问题的原因。\n\n---\n\n## 审批权限：谁有资格说\"可以\"？\n\n在传统工作流里，审批权限是清晰的：这件事需要总监批，那件事需要 CEO 签字。\n\n在 AI-native 工作流里，这套审批体系需要同样清晰，甚至需要更清晰——因为 AI 会生成大量的输出，如果审批权限模糊，要么所有东西都卡在一个人那里，要么所有东西都在没有足够授权的情况下被放行。\n\n**设计审批权限时，需要回答以下问题：**\n\n- 不同风险等级的 AI 输出，分别需要什么级别的人来审批？\n- 审批人需要具备什么样的专业能力，才能对 AI 的输出做出有效判断？\n- 如果审批人不在，有没有备选的审批路径？\n- 紧急情况下，临时授权的规则是什么？\n\n---\n\n## 审核清单：让审核变得可执行\n\n人工审核容易流于形式的原因之一，是审核者不知道该看什么。\n\n\"总体感觉没问题\"不是审核，那只是阅读。\n\n有效的审核，需要一张**审核清单**——针对特定类型的 AI 输出，明确列出审核者应该检查的具体项目。\n\n**以财务报告的 AI 辅助生成为例，审核清单可能包括：**\n\n- [ ] 所有数字与原始数据源核对一致\n- [ ] 百分比计算逻辑正确（基数、口径、时间范围）\n- [ ] 同期对比数据准确\n- [ ] 没有引用不存在或无法核实的数据来源\n- [ ] 结论与数据之间的逻辑关系成立\n- [ ] 表述符合公司的合规要求（无夸大、无误导性陈述）\n- [ ] 已经过[职位]级别的审批\n\n审核清单的好处：\n- 审核变得可量化，不依赖个人经验\n- 新人也能有效执行审核\n- 审核结果可以记录，形成可追溯的审计链\n\n---\n\n## 升级触发机制：什么时候必须往上报？\n\n人工监督不只是\"看一遍\"，还包括**识别什么时候这件事超出了当前层级的处理能力**。\n\n每个 AI 工作流，都需要明确的升级触发机制：\n\n**典型的升级触发条件：**\n\n- AI 输出的结论与已知信息严重矛盾，原因不明\n- 输出涉及的金额、风险超过当前审批人的授权范围\n- 情况涉及法律、合规、伦理判断，超出审核者的专业能力\n- AI 的输出质量持续低于标准（可能意味着输入数据有问题，或者工作流设计需要调整）\n- 出现从未遇到过的新情况，没有对应的处理规则\n\n升级不是失败，升级是工作流正常运转的一部分。一个没有升级路径的工作流，是一个有隐患的工作流。\n\n---\n\n## 责任矩阵：说清楚谁对什么负责\n\n在团队层面，建议为每个主要的 AI 工作流，建立一张简单的责任矩阵：\n\n| 角色 | 负责内容 | 不负责内容 |\n|------|---------|-----------|\n| AI | 执行标准化任务，生成初步输出 | 质量保证、最终判断、外部沟通 |\n| 一线审核者 | 日常输出的质量审核 | 高风险决策、法律合规判断 |\n| 专业审核者 | 专业领域的深度审核（法律、财务、技术） | 业务决策 |\n| 管理审批者 | 高风险输出的最终审批 | 日常操作 |\n| 流程所有者 | 工作流的整体设计和优化 | 具体任务执行 |\n\n这张矩阵不需要复杂，但它需要被明确、被沟通、被所有相关人员理解。\n\n---\n\n## 一个容易忽视的问题：审核者的能力\n\n人工监督有效，前提是审核者有能力做出有效判断。\n\n这意味着：审核者不只是需要\"看一遍\"，他们需要足够的专业知识，能够识别 AI 输出里的错误、风险和不合适的地方。\n\n**一个常见的陷阱：** 把审核任务交给资历最浅的团队成员，因为他们\"有时间\"。\n\n如果审核者本身不具备判断 AI 输出质量的能力，审核就只是形式——走了一个流程，但没有真正起到把关的作用。\n\n有效的审核，需要**有能力的人**，在**有足够时间**的条件下，按照**明确的标准**来执行。三个条件缺一不可。\n\n---\n\n## 📌 本章要点卡\n\n1. AI 不承担责任，**使用者和组织承担最终责任**——这条原则决定了人工监督不能省略\n2. 三个必须有人在场的场景：**对外输出、高风险决策、例外和边界情况**\n3. 有效的人工监督需要三个条件：**有能力的审核者 + 足够的时间 + 明确的审核标准**\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 列出你团队里用 AI 生成的主要输出类型，**标出哪些属于\"对外输出\"和\"高风险决策\"**，确认这些都有人工审核\n- [ ] 为你最常用的一类 AI 输出，**起草一张审核清单**——具体列出审核者应该检查哪些项目\n- [ ] 检查你的工作流：**有没有明确的升级路径？** 审核者遇到拿不准的情况时，知道该找谁吗？\n\n---\n\n*下一章：AI 治理——组织层面的规则和边界*\n\n\n---\n","wordCount":2690},{"id":"ai-native-work-foundations-part-2-5","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Ch5.md","partKey":"part-2","partTitle":"正文","chapterInPart":5,"globalChapter":5,"numberLabel":"","metaLabel":"","title":"第五章：AI 治理","markdown":"# 第五章：AI 治理\n\n> 读完这章，你会知道组织如何为 AI 的使用建立规则和边界——不是为了限制，而是为了让 AI 用得更安全、更持续。\n\n---\n\n## 为什么需要治理？\n\n一个场景：\n\n你的公司里，有的人在用 ChatGPT，有的人在用文心一言，有的人在用公司购买的企业版 AI 工具，有的人用了几个月就放弃了。\n\n没有人知道哪些数据被输入了哪个平台。没有人知道 AI 生成的内容有没有经过核实就对外发出去了。没有人知道万一出了问题，谁来负责。\n\n这就是没有 AI 治理的状态。\n\n**AI 治理，就是为\"组织里的人如何使用 AI\"，建立一套清晰的规则、流程和责任体系。**\n\n它不是为了阻止大家用 AI，而是为了让 AI 的使用可持续、可控制、可追责。\n\n---\n\n## AI 治理的六个核心要素\n\n### 要素一：批准的工具清单\n\n不是所有 AI 工具都适合在组织里使用。\n\n组织需要明确：**哪些 AI 工具是批准使用的，各自适用于什么场景。**\n\n**工具分级的逻辑：**\n\n| 工具类别 | 适用场景 | 数据限制 |\n|---------|---------|---------|\n| 个人消费级 AI | 个人学习、非敏感内容的头脑风暴 | 严禁输入任何公司数据 |\n| 企业级 AI（云端） | 一般工作任务，已签署数据处理协议 | 可输入内部数据，禁止最高机密 |\n| 私有化部署 AI | 高敏感数据处理 | 按数据分级政策执行 |\n| 专用垂直 AI（如法律、财务） | 专业领域任务 | 按具体合同和合规要求 |\n\n清单需要定期更新——AI 工具市场变化很快，六个月前的清单可能已经过时。\n\n---\n\n### 要素二：数据分级与使用规范\n\n不同敏感级别的数据，适合进入不同的 AI 渠道。\n\n**一个简单的数据分级框架：**\n\n| 数据级别 | 定义 | AI 使用规则 |\n|---------|------|-----------|\n| 公开数据 | 已公开发布的信息 | 可以输入任何 AI 工具 |\n| 内部数据 | 公司内部使用，未公开 | 只能使用企业级 AI，不能用个人账号 |\n| 机密数据 | 竞争敏感、未公开财务、战略信息 | 只能使用私有化部署或经过特别审批的渠道 |\n| 受监管数据 | 个人信息、医疗数据、金融数据 | 必须符合相关法规（《个人信息保护法》等），通常需要法律合规审核 |\n\n这个框架要让每个员工都能理解和记住——如果太复杂，就没有人会在实际操作中遵守。\n\n---\n\n### 要素三：AI 使用政策\n\nAI 使用政策是治理体系的核心文件，通常包含：\n\n**必须有的内容：**\n- 批准使用的 AI 工具列表\n- 数据分级和对应的使用规则\n- 哪些内容/数据绝对禁止输入 AI（参考《AI 素养基础》第四章）\n- AI 输出的审核和审批要求\n- 违规的后果\n\n**建议有的内容：**\n- AI 使用的最佳实践指引（怎么用得更好）\n- 员工培训要求\n- 政策更新的周期和机制\n\n**关于政策的长度：** 一份没有人会读完的政策，不如一份简单清晰的。建议核心规则控制在一页以内，详细指引作为附件。\n\n---\n\n### 要素四：访问控制与权限管理\n\n不是所有员工都需要使用所有 AI 工具，不是所有 AI 工具都应该对所有数据开放访问。\n\n**访问控制需要回答：**\n- 哪些角色/部门有权使用哪些 AI 工具？\n- 哪些 AI 工具可以访问哪些数据库、系统、文件？\n- 访问权限如何申请、审批、撤销？\n- 离职员工的 AI 工具访问权限，如何及时关闭？\n\n2026年，很多企业已经把 AI 工具的权限管理，整合进了统一的身份和访问管理（IAM）体系。如果你们组织还没有，这是一个需要尽快建立的基础设施。\n\n---\n\n### 要素五：审计与监控\n\n治理的有效性，需要通过审计来验证。\n\n**审计需要回答的问题：**\n- 员工实际上在使用哪些 AI 工具？（是否有在批准工具之外的使用？）\n- AI 工具处理了哪些类别的数据？\n- AI 生成的输出，经过了哪些审核节点？\n- 有没有违反使用政策的情况？\n\n**监控的边界：** 审计是为了发现系统性风险，不是为了监视员工的每一个操作。治理政策需要向员工清楚说明哪些操作会被记录，以及记录的目的。\n\n---\n\n### 要素六：合规与监管考量\n\n2026年，AI 相关的监管框架在全球范围内都在快速发展。\n\n**在中国：**\n- 国家互联网信息办公室（网信办）发布的《生成式人工智能服务管理暂行办法》，对生成式 AI 的服务提供和使用有明确规定\n- 《个人信息保护法》对涉及个人信息的 AI 使用有直接约束\n- 金融、医疗、教育等行业，还有各自的行业监管要求\n\n**对组织的实际影响：**\n- 如果你的组织向公众提供 AI 服务，需要满足网信办的备案和合规要求\n- 如果 AI 处理用户个人信息，需要完成个人信息保护影响评估（PIAA）\n- 如果你在受监管行业，需要与行业监管机构确认 AI 使用的合规边界\n\n**建议：** 把 AI 合规纳入现有的法务和合规管理体系，不要把它当成独立的、临时性的任务。\n\n---\n\n## 治理不是一次性的工作\n\nAI 技术在快速演进，监管框架在持续更新，组织的 AI 使用方式也在不断变化。\n\n治理体系需要定期审查和更新：\n\n- **工具清单：** 建议每季度审查一次\n- **使用政策：** 建议每半年审查一次，或在重大事件发生后及时更新\n- **合规状态：** 建议每年做一次全面的合规审查，或在相关法规更新后及时跟进\n\n---\n\n## 治理和创新之间的平衡\n\n最后说一个经常被问到的问题：治理会不会扼杀创新？\n\n如果治理设计得过于繁琐，可能会。\n\n但好的治理，应该是**为创新提供一个安全的空间**，而不是阻止创新。\n\n**一个有用的原则：** 治理的规则应该是\"在这个范围内，你可以自由探索\"，而不是\"你只能做这几件事\"。\n\n划清边界，让大家知道哪里可以放手用、哪里需要谨慎，反而能让团队在有边界的空间里，更有信心地去探索。\n\n---\n\n## 📌 本章要点卡\n\n1. AI 治理的目标：让 AI 的使用**可持续、可控制、可追责**——不是限制，而是保障\n2. 六个核心要素：**批准工具清单、数据分级、使用政策、访问控制、审计监控、合规考量**\n3. 好的治理是**为创新划定安全空间**，不是阻止创新\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 检查你的组织：**现在有没有 AI 使用政策？** 如果没有，从\"哪些数据不能输入 AI\"这一条开始\n- [ ] 列出你的团队目前在使用的所有 AI 工具——**有没有不在批准清单里的？**\n- [ ] 如果你在受监管行业，确认你了解**网信办和行业监管对 AI 使用的具体要求**\n\n---\n\n*下一章：组织中的 AI 输出验证——如何在团队层面建立核实体系*\n\n\n---\n","wordCount":2520},{"id":"ai-native-work-foundations-part-2-6","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Ch6.md","partKey":"part-2","partTitle":"正文","chapterInPart":6,"globalChapter":6,"numberLabel":"","metaLabel":"","title":"第六章：组织中的 AI 输出验证","markdown":"# 第六章：组织中的 AI 输出验证\n\n> 读完这章，你会知道如何在团队层面建立 AI 输出的核实体系——从个人习惯，升级为组织能力。\n\n---\n\n## 从个人核实到组织核实\n\n在《AI 素养基础》第六章，我们讲了个人如何验证 AI 的输出。\n\n这一章，我们把同样的问题放到组织层面：**当一个团队都在用 AI 生产内容时，如何确保整体的输出质量？**\n\n个人核实，依赖个人的判断力和习惯，不稳定。\n\n组织核实，需要把验证变成一个系统性的能力——有标准、有流程、有工具、有记录。\n\n两者的差距，就是从 Level 2 走向 Level 3、Level 4 的关键一步。\n\n---\n\n## 为什么组织层面的验证更难？\n\n在个人层面，你只需要对自己的输出负责。\n\n在组织层面，挑战更复杂：\n\n**规模问题：** 团队每天可能产生大量的 AI 辅助输出，不可能每一条都由最资深的人逐字审核。\n\n**能力分布不均：** 不同成员对 AI 局限的理解不同，核实能力参差不齐。\n\n**协作链条长：** 一份输出可能经过多人处理，每个人都觉得\"前面的人应该查过了\"，结果没有人真正查。\n\n**时间压力：** 用 AI 就是为了提速，如果核实流程太重，反而抵消了效率收益。\n\n组织层面的验证体系，需要在这些约束下，找到可以持续运转的平衡点。\n\n---\n\n## 建立组织验证体系的四个层次\n\n### 层次一：标准化核实清单\n\n把\"应该核实什么\"，从个人经验，变成团队共享的标准。\n\n对每一类主要的 AI 输出类型（对外报告、客户邮件、数据分析、法律文件……），建立一张对应的核实清单。\n\n清单的设计原则：\n- **聚焦高风险点：** 不是要查每一个字，而是要查最容易出错的地方\n- **可操作：** 每一条清单项，都是一个可以执行的具体动作，不是模糊的原则\n- **分级：** 不同风险级别的输出，对应不同深度的清单\n\n**一个数据分析报告的核实清单示例：**\n- [ ] 所有数字与原始数据源一一核对\n- [ ] 计算逻辑独立验算（不只是看 AI 的过程，自己跑一遍）\n- [ ] 百分比的基数和口径确认正确\n- [ ] 引用的外部数据，确认来源可追溯且为最新版本\n- [ ] 结论与数据逻辑一致（没有\"数据说A，结论说B\"的情况）\n- [ ] 表述无夸大或误导性语言\n\n---\n\n### 层次二：证据链管理\n\n**核实不只是一个动作，还需要留下记录。**\n\n在组织里，\"我看过了\"不够。\"我按清单核实了，以下是核实记录\"才是可追溯的。\n\n证据链需要回答：\n- 这份输出是什么时候、由谁生成的？\n- 经过了哪些核实步骤？\n- 每个步骤的核实结果是什么？\n- 最终由谁审批？\n\n**实际操作方式：**\n\n不需要复杂的系统。一个简单的版本管理规范+核实记录模板，就能建立基本的证据链。\n\n例如：文件命名规范包含版本号和审核状态（v1_AI生成_未审核、v2_人工审核中、v3_审批通过）；核实记录作为独立文档保存，与最终输出关联。\n\n---\n\n### 层次三：来源可追溯性\n\n在组织层面，AI 引用的来源需要是可追溯的——不只是\"AI 说这个数据来自某报告\"，而是真的有人找到了那份报告，确认了数据的真实性。\n\n**建立来源追溯的实践：**\n\n- 对 AI 生成的内容里引用的所有外部信息，建立\"来源库\"\n- 来源库里的每一条，都有原始文件或链接，以及核实人和核实时间\n- 对外发布的内容，只能引用来源库里已经核实过的信息\n\n这个做法在研究类、报告类工作中尤其重要，也是在受监管行业满足合规要求的基础。\n\n---\n\n### 层次四：异常审查机制\n\n除了常规核实，组织还需要一套**异常审查机制**——专门用来处理那些\"感觉不对，但说不清楚哪里不对\"的情况。\n\n**触发异常审查的信号：**\n- 输出结果与团队经验严重不符（\"AI 说这个市场增长30%，但我们一直感觉这个市场在收缩\"）\n- 输出里出现了从未见过的数据或来源\n- 多个不同的 AI 工具，对同样的输入给出了截然不同的结果\n- 核实者感觉\"这个结论推导得太顺了\"（过于流畅往往值得警惕）\n\n异常审查不走常规核实流程，而是升级到更有经验的专业人员，做更深入的调查。\n\n---\n\n## 核实文化：把验证变成习惯\n\n体系和工具是必要的，但最终决定组织核实能力的，是文化。\n\n一个有核实文化的团队，特征是：\n\n**核实被视为专业表现，而不是对 AI 的不信任。** 认真核实 AI 输出的人，不会被认为\"效率低\"或者\"不会用 AI\"，而是被视为负责任的专业人员。\n\n**发现 AI 的错误是好事，不是麻烦。** 核实发现了问题，说明核实有效，应该被鼓励，而不是被当成麻烦。\n\n**没有人因为\"AI 帮我做的\"而免责。** 无论 AI 参与了多少，最终输出的责任都由提交者承担。这条文化原则，比任何流程都重要。\n\n---\n\n## 审计思维：向金融行业学习\n\n你有财务背景，这里有一个对你来说可能特别有共鸣的视角。\n\n金融行业发展出了一套成熟的审计思维，核心是：**不相信任何单一来源，所有重要信息都需要独立核实。**\n\n这套思维，直接适用于 AI 输出的验证。\n\n**从审计思维里可以借鉴的实践：**\n\n- **独立复核（Independent Check）：** 重要的 AI 输出，由另一个不参与生成过程的人独立核实\n- **三方印证（Triangulation）：** 重要结论，至少用两个独立来源交叉确认\n- **例外报告（Exception Reporting）：** 建立机制，让核实者在发现异常时有标准化的上报路径\n- **定期抽查（Sampling）：** 不可能核实所有输出，但可以对低风险输出做定期随机抽查，监控整体质量水平\n\n---\n\n## 一个适合不同规模团队的实施路径\n\n**小团队（5人以下）：**\n- 建立一套核心核实清单（2-3类主要输出类型）\n- 每次 AI 输出对外前，责任人自查清单\n- 月度回顾：有没有发现 AI 的错误？什么类型？调整清单\n\n**中型团队（5-20人）：**\n- 完整的核实清单体系（覆盖主要输出类型）\n- 指定核实责任人（不只是生成者自查）\n- 建立简单的证据链记录\n- 季度审查：抽查已发出的 AI 辅助输出，评估质量\n\n**大型组织（20人以上）：**\n- 系统化的核实流程，整合进工作管理工具\n- 分级核实体系（风险等级决定核实深度和审批层级）\n- 完整的证据链和来源库\n- 定期审计和合规报告\n\n---\n\n## 📌 本章要点卡\n\n1. 组织层面的验证，需要把核实从**个人习惯变成系统能力**：有标准、有流程、有记录\n2. 四个层次：**标准化核实清单、证据链管理、来源可追溯性、异常审查机制**\n3. 核实文化比工具更重要：**核实是专业表现，发现错误是好事，\"AI做的\"不免责**\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 为你团队最常见的一类 AI 输出，**起草一张10条以内的核实清单**\n- [ ] 检查你们现有的工作流：**有没有人因为\"前面的人应该查过了\"而跳过了核实？** 如果有，在哪个节点修复这个漏洞\n- [ ] 和团队讨论一个问题：**\"如果 AI 帮我们做的某份输出出了错，我们现在能追溯到是哪里出了问题吗？\"**\n\n---\n\n*下一章：AI 协作实践——在团队日常工作中落地*\n\n\n---\n","wordCount":2737},{"id":"ai-native-work-foundations-part-2-7","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Ch7.md","partKey":"part-2","partTitle":"正文","chapterInPart":7,"globalChapter":7,"numberLabel":"","metaLabel":"","title":"第七章：AI 协作实践","markdown":"# 第七章：AI 协作实践\n\n> 读完这章，你会有一套可以直接在团队日常工作中落地的 AI 协作方法。\n\n---\n\n## 从理论到日常\n\n前六章，我们建立了框架：成熟度模型、岗位变化、工作流设计、人工监督、治理体系、输出验证。\n\n这一章，我们落地。\n\n框架再好，如果不能在日常工作里真正运转，就只是一份文件。\n\n这一章讲的，是团队在日常工作中，最常见的几类 AI 协作场景，以及每个场景里行之有效的实践方式。\n\n---\n\n## 场景一：团队共享提示词库\n\n**问题：** 团队里每个人都在重复摸索同样的问题——\"怎么让 AI 帮我写这类邮件\"、\"怎么让 AI 整理这类数据\"。每个人的版本不一样，质量参差不齐，没有积累。\n\n**实践：建立团队共享提示词库。**\n\n把经过验证的、效果稳定的提示词模板，整理成一个团队共享的资源库。\n\n**提示词库的基本结构：**\n\n| 任务类型 | 适用场景 | 提示词模板 | 注意事项 | 贡献者 | 最后更新 |\n|---------|---------|-----------|---------|--------|---------|\n| 会议纪要整理 | 将会议录音转文字后整理 | [模板内容] | 需要先确认录音转文字质量 | 张X | 2026.03 |\n| 客户邮件起草 | 对外沟通邮件初稿 | [模板内容] | 发出前必须人工审核语气和内容 | 李X | 2026.04 |\n\n**建立和维护提示词库的原则：**\n\n- 只收录经过实际使用验证的模板，不收录\"理论上应该有用\"的\n- 每个模板注明适用场景和注意事项，不让使用者自己猜\n- 定期清理——AI 能力在更新，三个月前的最优提示词，今天可能有更好的版本\n- 鼓励团队贡献——发现一个好用的提示词，加进来，标上贡献者\n\n---\n\n## 场景二：AI 辅助会议\n\n**问题：** 会议占用大量时间，会后整理纪要更是耗时，而且记录者不同，质量差异很大。\n\n**实践：建立标准化的 AI 辅助会议流程。**\n\n**会前：**\n用 AI 基于议程生成会议准备材料——背景信息整理、上次会议跟进事项、相关数据摘要。让参会者在更短时间内做好准备。\n\n**会中：**\n用录音工具记录（需提前告知参会者并获得同意）。专注讨论，不让人分心去记录每一句话。\n\n**会后：**\n录音转文字 → AI 生成结构化纪要（议题、讨论要点、决议、行动项、负责人、截止时间）→ 人工审核确认 → 分发。\n\n**一个标准会议纪要的 AI 提示词框架：**\n\n```\n以下是会议录音的文字记录。请整理成结构化会议纪要，包含：\n1. 会议基本信息（时间、参会人、主题）\n2. 各议题的讨论要点（简洁，不需要逐字记录）\n3. 达成的决议（明确、可执行）\n4. 行动项清单（每项包含：任务描述、负责人、截止时间）\n5. 下次会议需要跟进的事项\n\n注意：如果某个议题没有达成明确决议，请标注\"待定\"，不要自行推断结论。\n```\n\n**关键原则：** 会议纪要必须经过参会者确认，不能直接由 AI 生成后发出。AI 的纪要是初稿，不是终版。\n\n---\n\n## 场景三：AI 辅助报告生产\n\n**问题：** 写报告是知识工作里最耗时的任务之一，但很多时间花在了信息收集和格式整理上，而不是真正的分析和洞察。\n\n**实践：人负责洞察，AI 负责信息层和格式层。**\n\n**一个典型的报告生产流程：**\n\n**第一阶段：框架确定（人）**\n报告要回答什么问题？结构是什么？核心论点是什么？这个阶段由人来主导，AI 可以辅助头脑风暴，但框架判断必须是人做的。\n\n**第二阶段：信息收集（AI 为主）**\n基于确定的框架，AI 负责收集和整理相关信息——行业数据、竞争对手信息、历史数据整合。人负责验证来源和筛选相关性。\n\n**第三阶段：分析（人+AI）**\n人提供核心分析视角和判断，AI 辅助数据处理、对比分析、场景测算。分析结论由人来做，AI 做的是支撑工作。\n\n**第四阶段：初稿生成（AI）**\n基于框架、信息和分析结论，AI 生成报告初稿。输入越清晰，初稿质量越高。\n\n**第五阶段：审核修改（人）**\n深度审核——逻辑、数字、表述、立场——然后修改。这一阶段不要省。\n\n**第六阶段：格式输出（AI）**\nAI 负责格式整理、多版本输出（PPT摘要版、Word完整版、邮件一页版）。\n\n---\n\n## 场景四：AI 辅助分析\n\n**问题：** 面对大量数据或信息，分析工作耗时耗力，而且不同人的分析框架不一致。\n\n**实践：用 AI 做\"分析加速器\"，不是\"分析替代者\"。**\n\n**几种常见的 AI 辅助分析场景：**\n\n**定性分析（客户反馈、访谈记录、市场调研）：**\n- 把原始材料输入 AI，要求按维度分类和主题归纳\n- AI 输出分类结果，人验证分类的合理性\n- 人基于分类结果，做深度的洞察提炼\n\n**定量分析（数据整理、趋势分析）：**\n- 配有代码解释器的 AI，可以直接处理结构化数据\n- 人负责定义分析问题和解读结论，AI 负责数据处理和可视化\n- 关键数字必须独立验算\n\n**比较分析（竞品对比、方案比较）：**\n- 给 AI 明确的比较维度和评分标准\n- AI 生成结构化对比，人评估维度是否完整、权重是否合理\n- 最终判断由人来做\n\n**一个通用的分析请求框架：**\n```\n分析对象：[具体是什么]\n分析目的：[这个分析要回答什么问题]\n分析维度：[需要从哪些角度来看]\n输出格式：[需要什么形式的结果]\n特别注意：[有哪些已知的限制或背景信息]\n```\n\n---\n\n## 场景五：跨部门 AI 协作\n\n**问题：** 不同部门各自有自己的 AI 使用方式，产出的内容格式、质量、风格不一致，整合起来很麻烦。\n\n**实践：建立跨部门的 AI 输出标准。**\n\n当一项工作需要多个部门的 AI 辅助输出整合时，需要在开始前对齐：\n\n- **输出格式：** 用什么结构、什么模板\n- **核实标准：** 每个部门负责核实自己提供部分的准确性\n- **版本管理：** 用统一的命名规范和版本控制\n- **最终整合责任：** 明确谁负责把各部分整合成最终版本，以及整合后的整体核实由谁来做\n\n---\n\n## 建立团队 AI 协作节奏\n\n除了具体场景的实践，团队还需要建立一个持续改进的节奏：\n\n**每周：** 在团队站会或周报里，用一到两分钟分享本周 AI 使用中的一个发现——什么方法有效、什么方法没效、发现了什么问题。\n\n**每月：** 回顾本月的 AI 使用情况——哪些工作流运转顺畅，哪些需要调整，有没有新的使用场景值得推广。\n\n**每季度：** 更新提示词库和工作流模板，清理过时的内容，加入新的最佳实践。\n\n这个节奏不需要花很多时间，但它让团队的 AI 协作能力持续积累，而不是停在某个水平上不动。\n\n---\n\n## 📌 本章要点卡\n\n1. AI 协作实践的核心：把有效的方法**从个人经验变成团队资产**——提示词库、标准流程、共享模板\n2. 五个核心场景：**共享提示词库、AI辅助会议、AI辅助报告、AI辅助分析、跨部门协作**\n3. 建立持续改进的节奏：**每周分享、每月回顾、每季度更新**——AI协作能力需要主动积累\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 整理你个人用得最顺手的**三个 AI 提示词模板**，分享给团队，作为共享提示词库的第一批内容\n- [ ] 下次团队会议，试用 AI 辅助会议流程——**会后用 AI 生成初版纪要**，看看能节省多少时间\n- [ ] 在下次团队周会上，加一个**两分钟的\"AI使用分享\"环节**，坚持四周，看看团队的认知有没有变化\n\n---\n\n*下一章：AI 成熟度模型——如何规划你的组织从现在走向下一个阶段*\n\n\n---\n","wordCount":2646},{"id":"ai-native-work-foundations-part-2-8","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Ch8.md","partKey":"part-2","partTitle":"正文","chapterInPart":8,"globalChapter":8,"numberLabel":"","metaLabel":"","title":"第八章：AI 成熟度模型——规划你的下一步","markdown":"# 第八章：AI 成熟度模型——规划你的下一步\n\n> 读完这章，你会知道如何用成熟度模型，为你的组织制定一个务实的 AI 升级路径。\n\n---\n\n## 从定位到行动\n\n在第一章，我们介绍了 AI 成熟度模型——个人维度和组织维度各六个级别。\n\n那一章的目的是帮你**定位**：我现在在哪里。\n\n这一章的目的是帮你**规划**：从这里，怎么走到下一个级别。\n\n定位是起点，规划是路径，行动才是真正的变化。\n\n---\n\n## 为什么不能跳级？\n\n一个常见的误区：看到 Level 5 的描述（Agent 编排运营），觉得很好，想直接冲。\n\n跳级几乎不可行，原因很实际：\n\n**每个级别，都有它必须建立的基础能力。**\n\nLevel 3 的工作流整合，需要 Level 2 的固定任务使用经验作为基础——没有大量使用经验，你不知道哪些任务适合 AI，哪些不适合，也不知道 AI 在你的具体业务场景里的真实能力边界。\n\nLevel 4 的人机协作标准化，需要 Level 3 的工作流整合经验——没有跑通过几个工作流，你无法设计出真正有效的人机协作规范。\n\n跳级的结果往往是：买了很多工具，培训了很多人，但组织实际运作方式没有真正改变，最后项目不了了之。\n\n**一个级别一个级别地走，反而是最快的路。**\n\n---\n\n## 每个级别的升级路径\n\n### 从 Level 0 → Level 1\n**个人：** 选一个 AI 工具（推荐从 Claude 或 ChatGPT 企业版开始），用它完成一件真实的工作任务。不要先去学\"怎么用 AI\"，直接用，在用中学。\n\n**组织：** 允许员工自发探索。不需要统一部署，不需要正式政策，但需要有人开始用、开始分享。找到内部的早期使用者，给他们空间。\n\n**关键里程碑：** 至少有10%的员工，在过去一个月里用 AI 完成过至少一件真实工作任务。\n\n---\n\n### 从 Level 1 → Level 2\n**个人：** 找到你工作里重复频率最高的2-3件事，把 AI 固定纳入这几件事的处理方式。不要每次都重新想\"要不要用 AI\"，而是把它变成默认动作。\n\n**组织：** 识别出最适合 AI 辅助的2-3类任务（通常是信息整理、内容起草、数据处理），推动在这几类任务上形成标准化的使用方式。开始建立基础的使用规范（至少明确：哪些数据不能输入哪类 AI 工具）。\n\n**关键里程碑：** 有固定的任务类型，AI 辅助已经成为团队的常规操作，不是例外。\n\n---\n\n### 从 Level 2 → Level 3\n**个人：** 把 AI 嵌入你的工作流——不是在某个步骤用一下，而是整个工作流的设计，都考虑了人和 AI 的分工。参考第三章的结构化工作流框架。\n\n**组织：** 这是一个重要的跃升。需要：\n- 正式的 AI 使用政策（参考第五章）\n- 至少3-5个跑通的标准 AI 工作流\n- 团队层面的核实机制（参考第六章）\n- 建立共享提示词库（参考第七章）\n\n**关键里程碑：** 有至少一个完整的、跨团队认可的 AI 工作流在稳定运行，并且有记录可以追溯。\n\n---\n\n### 从 Level 3 → Level 4\n**个人：** 从\"使用 AI\"升级到\"管理 AI 的输出\"——你不只是在用 AI 做事，你在有策略地分配任务给 AI，验证它的输出，并且能快速判断什么时候 AI 给出的结果需要人工干预。\n\n**组织：** 这个阶段需要系统性的投入：\n- 正式的 AI 能力培训体系（不是一次性的，是持续的）\n- 人机协作成为标准工作模式，写入 JD 和绩效评估\n- 完整的治理体系（工具管理、权限控制、审计机制）\n- 开始衡量 AI 带来的实际效率和质量变化\n\n**关键里程碑：** AI 协作能力成为组织的核心竞争力之一，新员工入职时有系统性的 AI 协作培训。\n\n---\n\n### 从 Level 4 → Level 5\n**个人：** 能够设计和管理 AI 工作流，让多个 AI 工具协同工作，处理复杂的多步骤任务，同时保持有效的人工监督。\n\n**组织：** 这是目前绝大多数组织还没有到达的阶段，需要：\n- 成熟的 AI 工程能力（能部署和管理 AI Agent）\n- 完善的人工监督体系（Agent 在处理大量任务，人负责例外和战略）\n- 持续的模型评估和工作流优化机制\n- 清晰的 AI 治理和合规框架，能适应快速变化的监管环境\n\n**关键里程碑：** 有可以自主运行的 AI 工作流，能在最少人工干预下完成完整的业务流程，同时有完整的监控和兜底机制。\n\n---\n\n## 一个务实的升级计划模板\n\n不管你现在在哪个级别，可以用这个模板来规划下一步：\n\n```\n【现状评估】\n个人当前级别：___\n组织当前级别：___\n两个维度的差距：___\n最大的瓶颈是什么：___\n\n【目标级别】\n个人目标（6个月内）：___\n组织目标（12个月内）：___\n\n【关键行动】\n第1个月：___\n第2-3个月：___\n第4-6个月：___\n\n【里程碑】\n如何判断我们到了下一个级别：___\n\n【资源需求】\n需要什么工具：___\n需要什么培训：___\n需要什么预算：___\n需要谁的支持：___\n```\n\n---\n\n## 最常见的升级障碍\n\n基于真实的组织变革经验，这几个障碍在升级过程中最常出现：\n\n**障碍一：等待\"完美的时机\"**\n没有完美的时机。AI 能力在持续进化，监管在持续变化，等所有事情都稳定再开始，意味着永远不开始。\n\n**解法：** 在当前的不确定性里，选择最小可行的行动，先跑起来，边跑边调整。\n\n**障碍二：全面铺开，没有重点**\n想同时在所有部门、所有场景推进 AI 应用，结果哪里都浅尝辄止，没有真正跑通的案例。\n\n**解法：** 选一个部门、一个场景，深度打磨，跑出一个成功案例，再复制推广。\n\n**障碍三：工具投入多，能力建设少**\n买了很多 AI 工具，但没有投入足够的时间帮团队真正学会用、用好。工具在空转。\n\n**解法：** 工具预算和能力建设预算，至少1:1。工具是手段，能力才是资产。\n\n**障碍四：缺少高层支持**\nAI 转型是组织变革，如果只有基层在推，没有高层的支持和资源，推不动。\n\n**解法：** 用数据说话——记录早期试点的效率提升、质量改善、成本节约，用具体的结果去争取高层的支持和资源。\n\n---\n\n## 📌 本章要点卡\n\n1. 成熟度升级**不能跳级**——每个级别都有必须建立的基础能力，跳级会导致项目空转\n2. 升级的核心逻辑：**先在一个场景深度跑通，再复制推广**——不要全面铺开没有重点\n3. 最常见的障碍：**等待完美时机、全面铺开、重工具轻能力、缺乏高层支持**——每一个都有对应的解法\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 用本章的升级计划模板，**写出你的组织未来6个月的 AI 升级计划**——哪怕只是草稿\n- [ ] 识别你们组织升级路上**最大的一个障碍**，想想对应的解法是什么\n- [ ] 找到组织里**最愿意探索 AI 的一个团队或个人**，把他们作为你的第一个深度试点\n\n---\n\n*下一章：AI Agent 与未来组织——当 AI 开始自主行动*\n\n\n---\n","wordCount":2469},{"id":"ai-native-work-foundations-part-2-9","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Ch9.md","partKey":"part-2","partTitle":"正文","chapterInPart":9,"globalChapter":9,"numberLabel":"","metaLabel":"","title":"第九章：AI Agent 与未来组织","markdown":"# 第九章：AI Agent 与未来组织\n\n> 读完这章，你会理解 AI Agent 是什么、它正在改变什么，以及组织如何为这个变化做准备。\n\n---\n\n## 一个正在发生的转变\n\n到目前为止，我们讨论的 AI，主要是一种\"你问它、它答你\"的工具。\n\n你给它一个任务，它完成，交回给你。每一步都需要人来触发。\n\nAI Agent 不一样。\n\n**AI Agent 是能够自主规划和执行多步骤任务的 AI 系统。** 你给它一个目标，它自己拆解任务、调用工具、执行步骤、处理中间结果、最终交付成果——中间不需要你每一步都在场。\n\n这个差别，听起来像是程度上的提升，实际上是性质上的转变。\n\n---\n\n## 用一个例子来理解\n\n**传统 AI 工具的工作方式：**\n\n你：帮我研究一下竞争对手A公司最近的产品动态。\nAI：[给你一段关于A公司产品的文字总结]\n你：好，帮我再研究一下B公司。\nAI：[给你B公司的总结]\n你：好，帮我把两家的情况对比一下。\nAI：[给你对比分析]\n你：好，帮我写成一份简报。\nAI：[给你简报初稿]\n\n每一步，都需要你在场，触发下一个动作。\n\n**AI Agent 的工作方式：**\n\n你：帮我生成一份关于A公司和B公司最近产品动态的对比简报，今天下班前发给我。\nAgent：[自主搜索两家公司的最新信息，整理对比，生成简报，通知你审阅]\n\n你设定了目标和截止时间，Agent 自主完成中间所有步骤。\n\n---\n\n## AI Agent 的核心能力\n\n要做到上面这件事，Agent 需要具备几种传统 AI 工具没有的能力：\n\n**规划能力：** 把一个大目标，自主拆解成可执行的子任务序列。\n\n**工具调用：** 根据需要，调用不同的工具——搜索引擎、代码执行器、文件系统、数据库、甚至其他 AI 模型。\n\n**状态管理：** 记住任务的进展状态，在多个步骤之间保持上下文。\n\n**自我纠错：** 当某个步骤的结果不符合预期时，能够识别问题，调整策略，重新执行。\n\n**结果判断：** 评估自己的输出是否达到了目标，决定是否需要继续优化。\n\n---\n\n## MCP：让 Agent 连接真实世界\n\n你可能听过一个词：**MCP（Model Context Protocol，模型上下文协议）**。\n\n这是2024年底开始被广泛采用的一个开放标准，它解决了一个关键问题：**AI Agent 如何安全、标准化地连接各种外部工具和数据源？**\n\n在 MCP 出现之前，每个 AI Agent 要连接一个新工具，都需要专门开发接口，成本高、兼容性差。\n\nMCP 提供了一个统一的协议，让 AI Agent 可以像插插头一样，连接任何支持这个协议的工具——企业数据库、项目管理工具、邮件系统、财务系统……\n\n对组织的实际意义是：**AI Agent 开始能够真正接触和操作组织里的核心系统，而不只是生成文字。**\n\n这让 Agent 的能力大幅提升，同时也让治理的重要性大幅提升——一个能操作核心系统的 Agent，如果出了问题，影响范围比一个只能生成文字的 AI 大得多。\n\n---\n\n## 面向服务的工作流\n\nAI Agent 带来的另一个重要变化，是工作流的组织方式。\n\n传统工作流是线性的：任务从 A 到 B 到 C，每个环节由特定的人或系统负责。\n\nAgent 时代的工作流，开始变得**面向服务（Service-oriented）**：\n\n每个 Agent 像一个\"服务\"——有明确的输入规范、处理能力和输出标准。多个 Agent 可以被编排成复杂的工作流，彼此调用，协同完成任务。\n\n比如：一个客户服务工作流，可能由以下 Agent 协同：\n- 意图识别 Agent（判断客户要什么）\n- 信息查询 Agent（从系统里查相关数据）\n- 回复生成 Agent（生成个性化的回复）\n- 质量审核 Agent（检查回复是否符合规范）\n- 人工升级判断 Agent（判断这个情况是否需要转人工）\n\n整个流程自动运转，人只需要处理最终被判断为\"需要人工介入\"的情况。\n\n---\n\n## 人的角色：从执行者到治理者\n\n在 Agent 大量承担执行任务的组织里，人的角色会进一步向\"治理者\"方向移动：\n\n**目标设定：** 告诉 Agent 要达成什么，而不是告诉它每一步怎么做。\n\n**规则制定：** 设定 Agent 的行为边界——什么可以做，什么不能做，什么情况必须停下来等人判断。\n\n**例外处理：** Agent 遇到超出规则的情况，人来介入决策。\n\n**持续优化：** 评估 Agent 的表现，调整目标和规则，让整个系统越来越好。\n\n**伦理和合规监督：** 确保 Agent 的行为符合法律、监管和组织价值观的要求。\n\n这不是一个轻松的角色，反而要求更强的系统思维、更清晰的规则制定能力、更高的判断力。\n\n---\n\n## 组织现在需要做的准备\n\n大多数组织现在还在 Level 2 到 Level 3 之间。Agent 时代看起来还很遥远。\n\n但有几件事，现在就值得开始准备：\n\n**第一：理解你的核心业务流程**\nAgent 能自动化的，是流程清晰、规则明确的任务。如果你的核心流程现在还是\"靠人的经验判断，说不清楚规则\"，它就很难被 Agent 接管。\n\n现在就开始梳理和标准化核心流程，是为 Agent 时代做准备，也是对当下的组织管理有直接价值。\n\n**第二：建立数据基础**\nAgent 需要访问组织的数据才能工作。如果你的数据现在是分散的、非结构化的、质量低下的，Agent 也无从下手。\n\n数据治理是一个长期工程，越早开始越好。\n\n**第三：培养规则思维**\n能够清晰地定义\"在什么情况下做什么\"，是设计 Agent 工作流的核心能力。\n\n开始培养团队用规则语言来描述工作流程——不只是\"我们通常这么做\"，而是\"当X条件满足时，执行Y动作，如果遇到Z情况，升级给W\"。\n\n**第四：强化人工监督体系**\nAgent 能力越强，监督越重要。现在建立的人工监督体系（参考第四章），是 Agent 时代治理的基础。\n\n---\n\n## 一个需要保持清醒的提醒\n\nAgent 时代的叙事，有时候会让人觉得：只要部署了足够多的 Agent，人就可以不用工作了。\n\n这个叙事是危险的。\n\n首先，Agent 现在还有明显的局限——在复杂的、非标准的、需要真实世界判断的情况下，它的可靠性大幅下降。\n\n其次，更根本的问题是：**谁来定义 Agent 追求的目标？谁来判断 Agent 的行为是否符合我们真正想要的？谁来为 Agent 造成的后果负责？**\n\n这些问题，不是技术问题，而是人的问题。在 Agent 时代，这些问题只会变得更重要，不会消失。\n\n---\n\n## 📌 本章要点卡\n\n1. AI Agent 的本质转变：从\"你触发它\"到**\"它自主执行多步骤任务\"**——性质上的改变，不只是程度上的\n2. MCP 让 Agent 能连接真实的组织系统——能力大幅提升，**治理的重要性同步大幅提升**\n3. 现在就值得开始的准备：**梳理核心流程、建立数据基础、培养规则思维、强化人工监督**\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 在你的核心工作流里，**找出一个流程清晰、规则明确的任务**——这类任务，最有可能在不久的将来被 Agent 接管，现在就可以开始思考如何设计\n- [ ] 和技术团队或 IT 部门讨论：**你们的核心系统，有没有 API 或者 MCP 支持？** 这是 Agent 能否接入的前提\n- [ ] 想一想：如果有一个 Agent 能自动处理你团队20%的日常任务，**你们需要建立什么样的监督机制**，才能放心地让它运行？\n\n---\n\n*下一章：建立 AI-native 组织文化——最后，也是最重要的一章*\n\n\n---\n","wordCount":2914},{"id":"ai-native-work-foundations-part-2-10","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Ch10.md","partKey":"part-2","partTitle":"正文","chapterInPart":10,"globalChapter":10,"numberLabel":"","metaLabel":"","title":"第十章：建立 AI-native 组织文化","markdown":"# 第十章：建立 AI-native 组织文化\n\n> 读完这章，你会知道为什么文化是 AI 转型最难、也最重要的部分，以及如何真正地建立它。\n\n---\n\n## 为什么文化是最后一章，也是最重要一章\n\n工具可以买，流程可以设计，政策可以颁布。\n\n但文化，买不到，也颁布不了。\n\n很多组织的 AI 转型，在工具和流程层面做得不错，但停在 Level 2 到 Level 3 之间很久，无法真正跃升——原因往往不是技术问题，而是文化问题。\n\n**文化是组织在没有人监督时的默认行为。**\n\n一个 AI-native 的组织文化，意味着：即使没有规定\"你必须用 AI\"，团队成员也会自然地把 AI 纳入工作考量；即使没有人检查，也会认真核实 AI 的输出；即使没有明确要求，也会主动分享自己的 AI 使用经验。\n\n这种文化，不是靠一次培训、一个政策、一个工具能建立的。它是由无数个日常行为、领导者的示范、组织的激励机制积累而成的。\n\n---\n\n## AI-native 文化的五个特征\n\n### 特征一：实验精神\n\nAI-native 的团队，把\"试一试 AI 能不能帮上忙\"当成自然的第一反应，而不是等别人先试、等有明确规定再用。\n\n他们不害怕失败——如果一个 AI 工作流没有达到预期，这是一次学习，不是一次失败。\n\n**怎么培养：**\n- 给团队明确的\"实验空间\"——允许用一定比例的时间去探索新的 AI 使用方式，不要求每次都有明确产出\n- 分享失败的经验，和分享成功的经验同等重要——让团队看到\"试了没成功\"是被接受的\n- 领导者自己要先试——如果领导者从不用 AI，团队很难有实验的安全感\n\n### 特征二：核实文化\n\n在 AI-native 的团队里，核实 AI 输出是专业表现，不是对 AI 的不信任，也不是效率低的表现。\n\n发现 AI 的错误，是值得肯定的事，不是麻烦。\n\n\"AI 帮我做的\"，不是免责声明，而只是说明了使用的工具。最终责任仍然在提交者。\n\n**怎么培养：**\n- 在团队里公开表彰认真核实、发现 AI 错误的行为\n- 在绩效评估里，把\"AI 输出的质量\"纳入考量，不只看\"有没有用 AI\"\n- 领导者在审阅工作成果时，主动问\"这部分是 AI 生成的，你核实过了吗\"——让核实成为对话的一部分\n\n### 特征三：学习循环\n\nAI-native 的团队，有持续学习和分享的习惯。\n\n他们知道 AI 在快速进化——今天的最佳实践，三个月后可能已经过时。所以他们保持好奇心，主动关注新的能力，主动更新自己的工作方式。\n\n更重要的是，他们把个人的学习变成团队的资产——发现一个好用的方法，分享出来；发现一个坑，提醒大家避开。\n\n**怎么培养：**\n- 建立并维护共享的学习资源（提示词库、案例库、工具评测）\n- 定期举办内部分享——不是培训，而是\"我最近发现了一件有趣的事\"\n- 把 AI 学习纳入日常，而不是一次性的\"集中培训\"\n\n### 特征四：透明度\n\nAI-native 的团队，对 AI 在工作中的角色是透明的。\n\n对外，他们不隐瞒 AI 的参与——在适当的场合，清楚说明哪些内容是 AI 辅助生成的，并且说明经过了什么样的人工审核。\n\n对内，他们透明地讨论 AI 的局限——不夸大 AI 的能力，不掩盖 AI 的失误，让整个团队对 AI 的真实表现有清醒的认识。\n\n**怎么培养：**\n- 制定清晰的\"AI 使用披露\"规范——什么情况下需要说明 AI 的参与，怎么说明\n- 在内部复盘时，把\"AI 在这个项目里的表现如何\"作为一个常规议题\n- 鼓励团队成员在遇到 AI 局限时，直接说出来，而不是绕过去或者掩盖\n\n### 特征五：治理与创新的平衡\n\nAI-native 的组织文化，不是\"什么都用 AI\"，也不是\"用 AI 必须经过层层审批\"。\n\n它找到了一个平衡：**有清晰的边界，在边界内自由探索。**\n\n团队知道哪些是红线（数据安全、对外输出的审核、高风险决策的审批），在红线之内，他们有充分的自主权去探索和创新。\n\n这种平衡，让治理不成为创新的阻碍，让创新不变成治理的负担。\n\n**怎么培养：**\n- 治理规则要简单、清晰、可执行——让每个人都能真正理解和记住\n- 定期审查治理规则是否阻碍了有价值的创新——如果有，及时调整\n- 把治理的目的（保护团队、保护公司）讲清楚，不只是颁布规则\n\n---\n\n## 领导者的角色\n\n文化，最终是由领导者的行为塑造的。\n\n如果你是领导者，以下几件事比任何政策都有影响力：\n\n**亲自用 AI，公开谈 AI。** 分享你自己用 AI 的经历，包括成功的和不成功的。团队看到领导者在探索，他们才会放心探索。\n\n**问对问题。** 在会议上问\"这个分析你用 AI 辅助了吗？\"不如问\"这个结论你怎么得出来的，你对它有多大把握？\"——后者培养的是思考习惯，前者培养的是工具使用习惯。\n\n**容忍失败，要求学习。** 如果 AI 工作流出了问题，你的第一反应是追责，还是问\"我们学到了什么，下次怎么做得更好\"？这个反应，决定了团队是否敢于继续探索。\n\n**把能力建设当战略投资。** AI 工具的价值，最终取决于使用它的人的能力。如果你在工具上投入很多，但在人的培养上吝啬，这是短视的。\n\n---\n\n## 文化建设的长期视角\n\n最后，一个关于时间的提醒。\n\n文化不是季度目标。你不能在Q1立项\"建立 AI-native 文化\"，Q4宣布完成。\n\n文化建设，需要以年为单位来思考。\n\n但这不意味着现在不用开始。文化是由每一个日常行为积累的——从今天开始，每一次选择用 AI 还是不用 AI，每一次核实还是不核实，每一次分享还是不分享，都在塑造你的团队文化。\n\n积累足够多的正确行为，文化自然形成。\n\n---\n\n## 写在全书最后\n\n这个系列，从《AI 素养基础》里的\"AI 是什么\"，走到了这本书里的\"如何建立 AI-native 组织\"。\n\n覆盖了认知基础、安全边界、协作方法、工作流设计、人工监督、治理体系、验证机制、成熟度升级、Agent 趋势、以及文化建设。\n\n但有一件事，是任何一本书都无法替代的：**你自己的实践。**\n\n理解 AI 素养，和真正拥有 AI 素养，中间的距离，只能靠实际使用、实际犯错、实际迭代来弥合。\n\n希望这本书，是你实践的起点，而不是终点。\n\n---\n\n## 📌 本章要点卡\n\n1. 文化是组织在没有人监督时的默认行为——**工具、流程、政策都可以买，文化买不到**\n2. AI-native 文化的五个特征：**实验精神、核实文化、学习循环、透明度、治理与创新的平衡**\n3. 领导者的行为，是文化最有力的塑造者——**亲自用、公开谈、容忍失败、投资能力建设**\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 对照五个文化特征，**诚实评估你的团队现在在哪个特征上最薄弱**——从最薄弱的那个开始\n- [ ] 如果你是领导者，**下周在一次团队会议上，分享你自己用 AI 的一次真实经历**——无论成功还是失败\n- [ ] 和团队一起讨论：**\"我们希望在AI使用上成为什么样的团队？\"** 把这个讨论的结果，写下来，贴在大家能看到的地方\n\n---\n\n## 全书完\n\n*感谢你读完这本书。*\n\n*AI 时代，最稀缺的不是工具，而是清醒地使用工具的人。*\n\n*你已经是其中之一了。*\n\n\n---\n","wordCount":2742},{"id":"ai-native-work-foundations-part-3-1","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Appendix_A.md","partKey":"part-3","partTitle":"附录","chapterInPart":1,"globalChapter":11,"numberLabel":"A","metaLabel":"附录 A","title":"附录 A：你每天可以用的 AI 工具指南","markdown":"# 附录 A：你每天可以用的 AI 工具指南\n\n> 这份指南的目标不是列出所有 AI 工具，而是帮你找到在2026年真正值得用的那些。\n\n---\n\n## 怎么读这份指南\n\nAI 工具市场变化极快。这份指南聚焦的是**2026年中期经过验证、适合日常工作使用的主流工具**，按类别组织，每类给出选择建议和使用场景。\n\n在读具体工具之前，有一件事值得先说清楚：\n\n**2026年的 AI 工具边界正在消融。**\n\nCoding Agent（Codex、Claude Code）开始做内容生成和文档编辑；AI Agent（Hermes、OpenClaw）开始承担代码任务；对话工具（Claude.ai）开始支持 Agent 工作流。今天的分类，明天可能已经过时。\n\n这对你的影响是：**选一个工具用深，比用十个工具用浅更有效率。** 找到最符合你核心需求的那一个，花三个月真正跑通它，收获会远大于不断尝试新工具。\n\n工具会变，但用好工具的能力不会变。\n\n---\n\n## 理解工具的三层架构\n\n在看具体工具之前，先理解一个框架，帮你判断任何一个 AI 工具在整个生态里的位置：\n\n```\n┌──────────────────────────────────────────────┐\n│                 应用层                         │\n│  对话工具        Coding Agent    AI Agent      │\n│  Claude.ai      Codex           Hermes        │\n│  ChatGPT        Claude Code     OpenClaw      │\n│  文心一言        Cursor(IDE集成)  Coze         │\n│                 VS Code插件                    │\n├──────────────────────────────────────────────┤\n│                 工具层                         │\n│  视觉理解  代码执行  网络搜索  文件读写          │\n│  RPA工具  MCP服务  数仓连接  图像生成           │\n│  视频处理  语音转文字  Office文档处理           │\n├──────────────────────────────────────────────┤\n│              模型层（底座）                    │\n│  Claude · GPT · Gemini · DeepSeek · Qwen     │\n└──────────────────────────────────────────────┘\n```\n\n**模型层**是语言理解和生成的基础；**工具层**扩展模型能力边界；**应用层**是你实际使用的产品。\n\n同一个模型层，可以支撑完全不同的应用层产品。所以\"哪个工具最好\"，真正的问题是：\"对我的具体任务，哪个应用层产品最合适？\"\n\n---\n\n## 第一类：对话工具（通用大语言模型）\n\n适合内容起草、分析、解释、翻译、头脑风暴等语言类任务。\n\n### Claude（Anthropic）\n**适合：** 长文档处理、复杂分析、需要细致推理的任务。\n\nClaude 在处理长上下文和复杂推理方面表现突出，对安全和准确性有较高的内置要求，在\"拍马屁效应\"上相对克制——它更倾向于告诉你真实的问题。\n\n**现实的提醒：** Claude Pro（$20/月）在重度使用下很快会触及用量上限，这是2026年很多用户的真实体验。如果你需要大量使用，Max 计划（$100-$200/月）或企业版才是可持续的选择。对于大多数日常工作，Codex 或 ChatGPT 的性价比可能更合适。\n\n**企业版：** Claude for Enterprise，数据不用于训练，有完整的管理控制台。\n\n### ChatGPT（OpenAI）\n**适合：** 通用任务、有插件和工具需求的场景、与微软生态集成。\n\n生态最成熟，第三方集成最多。GPT-4o 系列在多模态（文字+图片+语音）能力上表现强。\n\n**企业版：** ChatGPT Enterprise / Team，数据不用于训练。\n\n### Gemini（Google）\n**适合：** 与 Google Workspace 深度集成的工作场景（Gmail、Docs、Sheets）。\n\n如果你的团队重度使用 Google Workspace，Gemini 的集成体验最顺畅。\n\n### 文心一言 / 通义千问\n**适合：** 中文内容生成、国内合规要求较高、需要数据本地化的场景。\n\n在中文理解和国内合规方面有本土化优势。对于需要满足国内数据要求的企业，这两个是主要选项。\n\n---\n\n## 第二类：Coding Agent（代码与内容生成）\n\n这类工具2026年已经大幅超越\"写代码\"的边界——它们能做的包括：写脚本、开发前端应用、编辑 Excel/Word、制作PPT、构建自动化工作流。如果你只选一类工具深度使用，这类工具的性价比在2026年是最高的。\n\n### Codex（OpenAI）\n**适合：** 各类需要\"生成可执行内容\"的任务——写脚本、开发应用、文档编辑、数据处理。\n\nCodex 是2026年发展最快的 Coding Agent 之一。它的核心价值是：你给它真实的上下文和材料，它给你第一个可以直接使用的版本——无论是 RPA 脚本、前端应用、Excel 分析，还是 PPT。\n\n**实际使用场景举例：**\n- 写网页巡检的 RPA 脚本，自动抓取税务局数据\n- 开发财务部门的前端查询界面\n- 基于数据生成标准化的 Excel 报表\n- 制作带数据可视化的 PPT\n\n**使用建议：** 给 Codex 真实的业务背景和具体的输入材料，而不是模糊的需求描述。\"帮我写一个爬税务局网站的脚本，网站结构是这样的……\"比\"帮我写一个爬虫\"效果好得多。\n\n### Claude Code（Anthropic）\n**适合：** 需要深度理解现有代码库、进行复杂代码修改和重构的任务。\n\nClaude Code 有两个入口：\n- **CLI版**：在终端里运行，适合深度开发工作\n- **桌面GUI版**：2026年4月重新设计，支持多会话并行管理、内置终端、diff 查看器——和 Codex 的体验越来越接近\n\n两个入口运行同样的底层引擎，可以在同一台机器上同时运行。\n\n**和 Codex 的差异：** Claude Code 更擅长理解和修改已有的代码库；Codex 更擅长从零开始生成。两者在实际使用中越来越接近，选哪个更多取决于你的习惯和账号。\n\n### VS Code + Claude Code 插件\n**适合：** 已经在 VS Code 里工作的开发者，想要 AI 辅助但不想切换工具。\n\n**实际体验：** 集成方便，但使用体验不如直接用 Claude Code CLI 或桌面版流畅——IDE 插件适合边写边用，独立的 Coding Agent 更适合交给它一个完整任务。两种使用场景不完全相同，不是替代关系。\n\n---\n\n## 第三类：AI Agent（自主任务执行）\n\n这类工具能够自主执行多步骤任务，持续运行，跨平台协作。2026年发展极快，但边界和 Coding Agent 正在模糊。\n\n### Hermes Agent（Nous Research）\n**适合：** 需要持续运行、跨会话记忆、多平台协作的自动化任务。\n\nHermes 是2026年增长最快的开源 AI Agent 之一，核心特点是持久记忆和自我进化——它会把复杂任务的解决方法保存为\"技能\"，下次遇到类似任务直接调用，越用越聪明。\n\n支持 Telegram、微信（通过 HermesClaw 桥接）、Discord、Slack 等20+平台，可以自托管，数据完全本地。\n\n**适合探索的场景：** 需要24小时持续运行、跨多个平台协调、或者有大量重复任务需要积累经验的工作流。\n\n### OpenClaw\n**适合：** 与 Hermes 类似的自主 Agent 场景，两者是竞争关系。\n\nOpenClaw 和 Hermes 都在争夺 AI Agent 用户，各自提供了对方的迁移工具——类似 Gemini 提供 GPT 历史记录迁移功能。两个工具的定位接近，选择更多取决于你的具体需求和生态偏好。\n\n**坦白说：** 这两个工具在2026年仍然处于快速迭代期，\"有待挖掘\"是对它们现状最诚实的描述。如果你的核心任务 Codex 或 Claude Code 能处理，暂时不需要急着投入大量时间在 Agent 工具上。\n\n---\n\n## 第四类：专业垂直工具\n\n针对特定场景优化，通常比通用工具在该场景表现更好。\n\n### 会议与转录\n- **Otter.ai：** 会议实时转录和摘要，支持中英文\n- **Notion AI：** 如果你用 Notion 管理工作，内置 AI 可以直接处理笔记和会议记录\n\n### 图像生成\n- **Midjourney：** 高质量图像生成，适合设计类工作\n- **即梦（字节跳动）：** 国内体验较好，中文理解能力强\n\n### 搜索增强\n- **Perplexity：** AI + 实时搜索，适合需要引用来源的研究任务\n\n---\n\n## 企业工具的核心原则\n\n无论选哪个工具，在企业场景下有一条原则始终成立：\n\n**个人账号处理工作数据，是最常见也最危险的错误。**\n\n消费级 AI 工具（个人账号）的数据可能被用于训练模型。企业版账号有数据保护协议，承诺不用于训练。这两者之间的差距，在合规层面可能是违法与合规的差距，不只是\"更安全\"和\"不那么安全\"的差距。\n\n详细的企业选型建议，见附录 B。\n\n---\n\n## 工具选择的三条实用建议\n\n**建议一：先解决最大的痛点，再扩展**\n不要因为工具新就用。先想清楚你工作里最大的效率瓶颈是什么，找能解决这个问题的工具，深度使用。\n\n**建议二：深度用一个，好过浅度用十个**\n工具用得熟练，才能发挥真实价值。2026年的工具边界在模糊，一个用熟的工具往往能覆盖你以为需要另一个工具才能做的事情。\n\n**建议三：每半年重新评估一次**\nAI 工具市场每季度都有重大变化。定期重新评估你的工具组合，是对你时间和金钱最负责任的方式。\n\n\n---\n","wordCount":3333},{"id":"ai-native-work-foundations-part-3-2","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Appendix_B.md","partKey":"part-3","partTitle":"附录","chapterInPart":2,"globalChapter":12,"numberLabel":"B","metaLabel":"附录 B","title":"附录 B：企业 AI 工具选型与避坑指南","markdown":"# 附录 B：企业 AI 工具选型与避坑指南\n\n> 给需要为团队或组织选择 AI 工具的人。\n\n---\n\n## 在选工具之前，先想清楚三件事\n\n**第一件：你的数据有多敏感？**\n你处理的数据，主要是什么类型？公开信息、内部数据、客户个人数据、财务数据、还是受监管的敏感数据？数据的敏感级别，直接决定了你能用什么工具。\n\n**第二件：你的合规要求是什么？**\n你所在的行业有没有特定的数据监管要求？需要满足国内的《个人信息保护法》吗？有没有数据本地化的要求？有没有行业监管机构的特定规定（金融、医疗、政府）？\n\n**第三件：你的团队规模和技术能力是什么？**\n是5人小团队还是500人大公司？有没有 IT 和安全团队来支撑工具的部署和管理？这决定了你能管理多复杂的工具体系。\n\n想清楚这三件事，再看下面的内容。\n\n---\n\n## 企业 AI 工具的三种模式\n\n### 模式一：云端企业版\n\n主要提供商（OpenAI、Anthropic、Google、微软、百度、阿里云）都提供企业级订阅，核心差异是：\n\n**数据不用于训练模型。** 这是和个人免费版最关键的区别。\n\n**有数据处理协议（DPA）。** 明确规定数据如何被处理、存储多久、谁能访问。\n\n**有管理员控制台。** 可以管理员工账号、设置使用权限、查看使用情况。\n\n**满足主流合规认证。** 通常包括 SOC 2 Type II、ISO 27001、GDPR 合规等。\n\n**适合：** 数据敏感度中等、有一定合规要求、团队规模中等以上的组织。\n\n---\n\n### 模式二：私有化部署\n\n在企业自己的服务器（本地或私有云）上部署 AI 模型，数据完全不离开企业网络边界。\n\n**主要选项：**\n- **开源模型本地部署：** DeepSeek、Llama、Qwen（通义千问开源版）等，可以在自有服务器上运行\n- **企业私有化产品：** 部分 AI 厂商提供完整的私有化部署方案，包括模型+管理平台\n\n**适合：** 数据敏感度极高（金融核心数据、医疗数据、国家安全相关）、有强数据本地化要求、有专业 IT 团队的组织。\n\n**代价：** 模型能力通常不如最前沿的云端版本；部署和维护需要专业团队；硬件成本较高。\n\n---\n\n### 模式三：行业专用 AI 平台\n\n针对特定行业场景构建的 AI 平台，通常已经预先处理了该行业的合规要求。\n\n**例如：**\n- 法律行业的 AI 工具（已处理律师-委托人特权保护）\n- 医疗行业的 AI 工具（已满足医疗数据保护要求）\n- 金融行业的 AI 工具（已满足金融监管合规要求）\n\n**适合：** 在受监管行业、有高度专业化需求的组织。\n\n---\n\n## 选型评估清单\n\n在做最终决定之前，用这张清单评估每一个候选工具：\n\n### 数据安全\n- [ ] 有没有明确的数据处理协议（DPA）？是否愿意签署？\n- [ ] 我的数据是否会被用于训练模型？（企业版应明确承诺\"不用于训练\"）\n- [ ] 数据存储在哪个地区的服务器？是否满足数据本地化要求？\n- [ ] 数据保留多长时间？如何删除？\n- [ ] 有没有数据加密（传输中和静止时）？\n\n### 合规认证\n- [ ] 是否有 SOC 2 Type II 报告？\n- [ ] 是否满足 ISO 27001？\n- [ ] 是否满足《个人信息保护法》的要求？\n- [ ] 如果在受监管行业，是否满足行业特定要求？\n\n### 访问控制\n- [ ] 是否有企业管理员控制台？\n- [ ] 能否按角色设置不同的权限？\n- [ ] 是否支持单点登录（SSO）？\n- [ ] 离职员工账号能否及时撤销？\n\n### 审计能力\n- [ ] 是否有使用日志？\n- [ ] 日志保留多长时间？\n- [ ] 是否支持导出日志用于合规审计？\n\n### 服务稳定性\n- [ ] SLA（服务可用性协议）是多少？\n- [ ] 有没有中国大陆的服务节点？（影响访问速度和稳定性）\n- [ ] 出现服务中断时，支持响应时间是多少？\n\n---\n\n## 必须避开的坑\n\n### 坑一：用个人账号处理工作数据\n\n这是最常见、危害最大的坑。\n\n员工用自己的个人 ChatGPT 免费账号、Claude 个人账号，把公司内部数据、客户信息、财务数据粘贴进去——这些数据可能被用于模型训练，完全不在企业的数据保护范围内。\n\n**怎么避：** 制定明确政策，工作数据只能通过企业批准的 AI 渠道处理。企业统一采购企业版账号，员工通过企业账号登录。\n\n---\n\n### 坑二：以为\"企业版\"就万事大吉\n\n企业版确实比个人版安全得多，但它不是万能的。\n\n企业版通常不覆盖：你员工在企业账号之外的个人使用行为；第三方应用通过 API 调用时的数据处理；不在合同范围内的数据类型。\n\n**怎么避：** 仔细阅读数据处理协议的具体条款，不要只看\"企业版\"的标签。\n\n---\n\n### 坑三：只看功能，不看合规\n\n很多团队选工具，主要看\"这个工具能做什么\"，没有认真评估\"这个工具的数据处理方式，符合我们的合规要求吗\"。\n\n在受监管行业，这可能直接导致合规违规。\n\n**怎么避：** 把合规评估作为选型流程的第一关，不通过合规评估的工具，不进入功能对比阶段。\n\n---\n\n### 坑四：没有统一管理，各部门各用各的\n\n不同部门自己采购不同的 AI 工具，IT 和安全团队完全不知道公司在用什么 AI 处理什么数据。\n\n这导致：无法做统一的安全评估、无法做访问控制、无法做审计、出了问题无法追溯。\n\n**怎么避：** 建立 AI 工具的统一采购和审批流程。任何部门引入新的 AI 工具，需要经过 IT 和安全团队的评估。\n\n---\n\n### 坑五：没有员工培训就上线\n\n工具买了，但员工不知道哪些数据不能输入、不知道如何正确使用、不知道出了问题该怎么报告。\n\n**怎么避：** 工具上线前，做针对性的员工培训。培训内容不需要复杂，但必须覆盖：这个工具用来做什么、不能输入什么数据、发现问题怎么报告。\n\n---\n\n### 坑六：忽视中国本土合规要求\n\n很多企业在评估 AI 工具时，主要参考的是国际合规标准（GDPR、SOC 2），忽视了中国本土的监管要求。\n\n**关键的中国合规要求：**\n- **《个人信息保护法》：** 处理个人信息需要合法依据，跨境传输有特定要求\n- **《生成式人工智能服务管理暂行办法》：** 向中国用户提供生成式 AI 服务，需要在网信办备案\n- **数据本地化：** 某些行业和数据类型要求数据存储在中国境内\n- **网络安全等级保护（等保）：** 企业信息系统的安全要求，AI 系统纳入等保范围\n\n**怎么避：** 在法务和合规团队的支持下，对照中国本土法规，评估每个 AI 工具的合规性。\n\n---\n\n## 不同规模企业的建议路径\n\n### 小企业（50人以下）\n**推荐路径：** 选一个主力大模型的企业版（Claude Enterprise 或 ChatGPT Team），统一采购，统一账号管理。制定一页纸的简单使用规范（哪些数据不能用、用哪个账号）。暂时不需要复杂的治理体系，但这两件事要做对。\n\n**预算参考：** 企业版通常按人头收费，主流产品在每人每月20-30美元之间。\n\n### 中型企业（50-500人）\n**推荐路径：** 主力大模型企业版 + 工作流自动化工具（n8n 或 Zapier AI）+ 针对核心业务场景的垂直工具。建立正式的 AI 工具审批流程，有 IT 团队统一管理账号和权限。\n\n### 大型企业（500人以上）\n**推荐路径：** 需要系统性的 AI 治理架构——工具采购标准化、数据分级管理、访问控制体系、审计机制、员工培训体系。对于高敏感数据场景，评估私有化部署的必要性。建议设立 AI 治理委员会，跨 IT、法务、业务部门协调。\n\n---\n\n*选型是起点，不是终点。工具上线后的管理、培训、持续优化，才是真正决定 AI 投资回报的地方。*\n\n\n---\n","wordCount":2935},{"id":"ai-native-work-foundations-part-3-3","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Appendix_C.md","partKey":"part-3","partTitle":"附录","chapterInPart":3,"globalChapter":13,"numberLabel":"C","metaLabel":"附录 C","title":"附录 C：AI 素养自测清单","markdown":"# 附录 C：AI 素养自测清单\n\n> 读完这本书，你现在在哪个水平？用这张清单给自己打分。\n\n---\n\n## 使用说明\n\n每道题选一个最符合你实际情况的选项，不要选\"理想中的我会怎么做\"，而是选\"我现在实际上是怎么做的\"。\n\n诚实作答，才有参考价值。\n\n---\n\n## 第一部分：AI 基础认知\n\n**1. 当 AI 给我一个具体的数字或事实，我会：**\n- A. 直接使用，AI 说的应该没问题\n- B. 如果感觉不对再查，感觉对就直接用\n- C. 重要的信息，我会去独立核实原始来源\n- D. 我有系统性的核实流程，根据风险等级决定核实深度\n\n**2. 我理解 AI 会产生\"幻觉\"（生成错误信息），我知道：**\n- A. 不太清楚这是什么意思\n- B. 知道这个概念，但不确定在哪些场景最容易发生\n- C. 清楚幻觉最容易发生在具体事实、数字、引用来源上，会重点核实这些\n- D. 能区分配置局限（联网可以解决）和能力局限（根本性的），并针对性地处理\n\n**3. 关于 AI 的\"拍马屁效应\"（Sycophancy），我：**\n- A. 不知道这是什么\n- B. 听说过，但不确定如何应对\n- C. 知道，会主动要求 AI 说出问题和风险，不只是听好消息\n- D. 在团队里推广了这个意识，在工作流里有对应的设计\n\n**4. 在输入 AI 之前，我会判断数据敏感性：**\n- A. 没想过这个问题，需要什么就贴什么\n- B. 大概有个感觉，明显敏感的不贴，但没有清晰的标准\n- C. 有清晰的判断标准，知道哪类信息不能输入公共 AI\n- D. 按公司数据分级政策执行，不同级别数据用不同的 AI 渠道\n\n**5. 我使用的 AI 工具：**\n- A. 主要用个人账号，包括处理工作内容\n- B. 有时用个人账号，有时用公司账号，没有刻意区分\n- C. 工作内容只用公司批准的企业版 AI 账号\n- D. 工作内容用企业版，并且了解这个账号背后的数据处理协议\n\n---\n\n## 第二部分：AI 沟通与使用能力\n\n**6. 我向 AI 提问的方式：**\n- A. 直接说我要什么，有时候结果不太对但不知道为什么\n- B. 知道要说清楚一些，但不确定哪些信息是关键的\n- C. 会给背景、说受众、指定格式，输出质量稳定\n- D. 有完整的沟通框架，能根据任务类型调整沟通方式，并且教给团队\n\n**7. 当 AI 的第一个输出不满意时，我会：**\n- A. 重新开始一个新对话，再试一次\n- B. 修改一下问题，重新问\n- C. 在同一个对话里继续，指出不满意的地方，迭代优化\n- D. 能系统性地诊断\"是沟通问题还是任务超出 AI 能力\"，有针对性地处理\n\n**8. 我会要求 AI 展示推理过程：**\n- A. 从来没想过可以这样做\n- B. 偶尔会问，但不是习惯\n- C. 对重要的判断和分析，会要求 AI 说明它的假设和推理过程\n- D. 这是我的常规做法，也帮团队建立了这个习惯\n\n---\n\n## 第三部分：组织层面的 AI 协作\n\n**9. 我们团队的 AI 使用方式：**\n- A. 各用各的，没有统一的方式\n- B. 有一些大家都在用的工具，但没有统一的规范\n- C. 有共享的提示词库和部分标准化的工作流\n- D. 有完整的 AI 工作流体系，包括人机分工、审核节点、升级路径\n\n**10. 在我们团队，AI 生成的对外输出（客户邮件、报告、提案）：**\n- A. AI 生成后直接发出或使用\n- B. 一般会看一眼，但没有系统性的审核\n- C. 有明确的审核要求，重要输出必须人工审核后才能发出\n- D. 有分级审核体系，不同风险等级的输出有对应的审核标准和审核人要求\n\n**11. 我们组织有：**\n- A. 没有任何 AI 相关的政策或规范\n- B. 有一些非正式的规定，但没有书面化\n- C. 有书面的 AI 使用政策，明确了可以用哪些工具、哪些数据不能输入\n- D. 有完整的 AI 治理体系，包括工具管理、数据分级、访问控制、审计机制\n\n**12. 我了解我们组织目前的 AI 成熟度：**\n- A. 没想过这个问题\n- B. 大概知道我们在用 AI，但不清楚处于哪个阶段\n- C. 能用成熟度模型给组织定位，知道我们在哪个级别\n- D. 不只是能定位，还有明确的升级计划，知道下一步需要做什么\n\n---\n\n## 计分方式\n\nA = 1分，B = 2分，C = 3分，D = 4分\n\n**将12道题的分数相加：**\n\n---\n\n## 结果解读\n\n### 12-18分：AI 素养入门阶段\n\n你对 AI 有基本的使用经验，但在安全意识、沟通技巧和组织实践上还有较大的提升空间。\n\n**最优先做的三件事：**\n1. 立刻确认你使用的 AI 工具是个人账号还是企业账号，工作数据只用企业账号\n2. 建立一个简单的核实习惯：重要数字和事实，用原始来源验证\n3. 重读《AI 素养基础》第四章（AI 安全与隐私）和第五章（如何与 AI 协作）\n\n---\n\n### 19-30分：AI 素养发展阶段\n\n你已经建立了基本的 AI 使用意识和习惯，在某些方面有比较好的实践，但还不够系统。\n\n**重点提升方向：**\n- 如果你在个人维度已经做得不错，重点关注如何把好的实践推广到团队层面\n- 如果你在合规和安全上还有盲点，优先填补这些盲点\n- 开始思考组织层面的 AI 工作流设计（本书第三章）\n\n---\n\n### 31-40分：AI 素养成熟阶段\n\n你对 AI 的理解和使用方式已经相当系统，个人层面的实践已经比较完整，并且开始在团队层面推动改变。\n\n**下一步的方向：**\n- 深化组织层面的 AI 治理体系（本书第五章）\n- 开始规划组织的 AI 成熟度升级路径（本书第八章）\n- 考虑如何建立持续学习和分享的文化机制（本书第十章）\n\n---\n\n### 48分（满分）：AI-native 领导者\n\n如果你真的在每一道题上都做到了 D，你所在的组织应该已经是行业里 AI 应用的标杆之一了。\n\n这时候值得做的，是把你们的实践总结成可以分享的案例，帮助更多组织走上这条路。\n\n---\n\n## 半年后，再测一次\n\n这张清单的真正价值，不在于某一次的得分，而在于**半年前和半年后的对比**。\n\n把今天的分数记下来，写上日期。六个月后，重新做一次，看看有没有变化，变化最大的是哪些方面，还有哪些顽固的盲点没有改变。\n\n成长是有迹可循的。\n\n---\n\n\n---\n","wordCount":2314},{"id":"ai-native-work-foundations-part-3-4","bookId":"ai-native-work-foundations","fileName":"AI_Native_Work_Foundations_Appendix_D.md","partKey":"part-3","partTitle":"附录","chapterInPart":4,"globalChapter":14,"numberLabel":"D","metaLabel":"附录 D","title":"附录 D：延伸学习指南","markdown":"# 附录 D：延伸学习指南\n\n> 读完这本书之后，如果你想继续深入——按你最感兴趣的方向，这里是推荐的下一步。\n\n---\n\n## 这份指南的使用方式\n\n不是书单，不是课程推荐，而是按**你想解决的问题**来组织的学习路径。\n\n选一个最符合你现在状态的方向，按顺序来。\n\n---\n\n## 方向一：我想更深入地理解 AI 的技术原理\n\n**为什么值得学：** 不需要成为工程师，但理解 AI 的工作原理，能让你对它的能力和局限有更准确的直觉，在使用和评估 AI 工具时判断力更强。\n\n**推荐路径：**\n\n第一步，理解大语言模型的基本工作原理。3Blue1Brown 在 YouTube 上有一个关于神经网络和语言模型的系列视频，数学不多，可视化非常直观，是目前面向非技术人员最好的入门材料之一。\n\n第二步，读 Andrej Karpathy 的相关文章和讲座。他是前特斯拉 AI 总监，现在专注于 AI 教育，内容深入浅出，面向有一定基础但不是专业工程师的人群。\n\n第三步，了解 AI 安全和对齐（AI Alignment）的基本概念。Anthropic 和 OpenAI 都有公开的技术博客，定期发布关于模型能力和安全研究的文章，是了解前沿进展的第一手来源。\n\n---\n\n## 方向二：我想提升个人的 AI 使用效率\n\n**为什么值得学：** 同样的工具，用得深和用得浅，效率差距可以是十倍。这个方向聚焦在技巧层面。\n\n**推荐路径：**\n\n第一步，系统性地探索你最常用的 AI 工具的高级功能。大多数人只用了工具能力的20%。花一个小时，把 Claude 或 ChatGPT 的系统功能逐一试一遍——Projects、Memory、自定义指令、文件上传、代码执行……\n\n第二步，建立你自己的提示词实验习惯。对同一个任务，用三种不同的表达方式提问，对比结果，找出差异的原因。这种主动实验，比读任何提示词教程都有效。\n\n第三步，参与活跃的 AI 使用者社区。X（Twitter）、Reddit 的 r/ClaudeAI 和 r/ChatGPT，以及国内的少数派、即刻等平台，都有大量真实用户分享的使用技巧和最新发现。\n\n---\n\n## 方向三：我想在组织里推动 AI 转型\n\n**为什么值得学：** 技术不是 AI 转型最难的部分，变革管理才是。这个方向聚焦在如何在组织内部推动系统性的改变。\n\n**推荐路径：**\n\n第一步，了解变革管理（Change Management）的基本框架。科特（Kotter）的\"领导变革八步法\"虽然不是专门针对 AI，但它的逻辑完全适用于 AI 转型——建立紧迫感、组建联盟、制定愿景、沟通愿景、赋能行动、创造短期胜利。\n\n第二步，研究行业内的 AI 转型案例。麦肯锡、波士顿咨询、德勤等咨询公司都定期发布 AI 转型报告和案例研究，是了解不同行业实践的重要来源。国内可以关注 36氪、虎嗅等媒体的 AI 专题报道。\n\n第三步，建立自己的内部案例。理论学再多，不如在自己组织里跑通一个小的 AI 项目，积累真实经验，用具体数据说服更多人。\n\n---\n\n## 方向四：我想了解 AI 相关的法律和监管\n\n**为什么值得学：** AI 监管在全球范围内快速发展，特别是在中国，网信办的规定和各行业监管正在对企业的 AI 使用产生直接影响。\n\n**推荐路径：**\n\n第一步，直接阅读核心法规原文。网信办发布的《生成式人工智能服务管理暂行办法》，以及《个人信息保护法》的核心条款，是理解中国 AI 监管框架的基础。这些文件都可以在网信办官网和全国人大网站上找到。\n\n第二步，关注专业的 AI 法律解读。国内一些律所（如金杜、中伦）和学术机构定期发布 AI 法律分析，是理解监管实践影响的重要来源。\n\n第三步，了解欧盟 AI 法案（EU AI Act）。虽然是欧洲法规，但它是目前全球最系统的 AI 监管框架，其中的分级监管思路和高风险 AI 的定义，对理解 AI 治理的国际趋势很有帮助。\n\n---\n\n## 方向五：我想了解 AI Agent 和未来技术趋势\n\n**为什么值得学：** 本书第九章介绍了 AI Agent 的基本概念，这个方向帮你深入理解正在发生的技术变革。\n\n**推荐路径：**\n\n第一步，动手体验一个 Agent 工具。理解 Agent 最快的方式是自己用一次。n8n 或 Coze 都有免费版，可以不写代码构建一个简单的多步骤自动化工作流。亲身体验\"AI 自主执行多步骤\"是什么感觉。\n\n第二步，了解 MCP 协议的基本原理。Anthropic 的官方文档和技术博客，有关于 MCP 设计理念的解释。理解为什么需要这个协议，比理解它的技术细节更重要。\n\n第三步，关注 AI 研究机构的前沿发布。Anthropic、OpenAI、Google DeepMind 都有公开的研究博客，定期发布关于 Agent 能力、安全研究、对齐方法的文章。不需要读懂所有技术细节，但保持对趋势的感知很重要。\n\n---\n\n## 一个关于持续学习的提醒\n\nAI 领域的知识更新速度，比你读完一本书的速度快。\n\n这不意味着书没有价值——基础的认知框架、批判性思维、验证习惯，这些不会因为模型迭代而过时。\n\n但具体的工具、具体的能力边界、具体的法规要求，需要持续更新。\n\n**建议建立一个轻量级的学习节奏：**\n\n每周花30分钟，浏览一遍 AI 领域的重要动态。可以是 X 上关注的几个账号，可以是一个 AI 新闻聚合工具，可以是你信任的几个博主的文章。\n\n不需要读完所有东西，不需要理解所有技术细节。只需要保持对这个领域的感知——知道发生了什么，知道哪些变化值得深入了解。\n\n这种持续的、轻量级的关注，比每半年集中学习一次，更有效地帮你保持在这个快速演进的领域里的判断力。\n\n---\n\n*学习 AI，最重要的不是掌握某个工具，而是保持好奇心和更新的意愿。*\n\n\n---\n","wordCount":2218}],"chapterCount":15,"wordCount":37007}]}</script>
  <script>
    const library = JSON.parse(document.getElementById("library-data").textContent);
    const packagedBooks = library.books || [];
    let importedBooks = library.singleBook ? [] : loadJson("reader.importedBooks", []);
    let notes = loadJson("reader.notes", []);
    let selectedTextForNote = "";
    let pendingNoteId = "";
    const state = {
      activeBookId: library.singleBook ? packagedBooks[0]?.id : localStorage.getItem("reader.activeBookId") || allBooks()[0]?.id,
      activeId: library.singleBook ? localStorage.getItem("reader.singleBook.activeId") : localStorage.getItem("reader.activeId"),
      view: library.singleBook ? "reader" : localStorage.getItem("reader.view") || "home",
      query: "",
      fontSize: Number(localStorage.getItem("reader.fontSize") || 19),
      theme: localStorage.getItem("reader.theme") || "light",
    };

    const toc = document.getElementById("toc");
    const content = document.getElementById("content");
    const search = document.getElementById("search");
    const libraryTitle = document.getElementById("libraryTitle");
    const publicHomeButton = document.getElementById("publicHomeButton");
    const publicBookstoreButton = document.getElementById("publicBookstoreButton");
    const publicAboutButton = document.getElementById("publicAboutButton");
    const homeButton = document.getElementById("homeButton");
    const bookstoreButton = document.getElementById("bookstoreButton");
    const aboutButton = document.getElementById("aboutButton");
    const bookPicker = document.getElementById("bookPicker");
    const bookSelect = document.getElementById("bookSelect");
    const bookDescription = document.getElementById("bookDescription");
    const importTools = document.getElementById("importTools");
    const importButton = document.getElementById("importButton");
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const noteList = document.getElementById("noteList");
    const selectionPopup = document.getElementById("selectionPopup");
    const selectedPreview = document.getElementById("selectedPreview");
    const noteInput = document.getElementById("noteInput");
    const cancelNoteButton = document.getElementById("cancelNoteButton");
    const cancelNoteTextButton = document.getElementById("cancelNoteTextButton");
    const saveNoteButton = document.getElementById("saveNoteButton");
    const currentTitle = document.getElementById("currentTitle");
    const articleMeta = document.getElementById("articleMeta");
    const footerNav = document.getElementById("footerNav");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const progress = document.getElementById("progress");

    document.documentElement.dataset.theme = state.theme;
    document.documentElement.style.setProperty("--font-size", state.fontSize + "px");
    document.body.classList.toggle("single-book", Boolean(library.singleBook));
    libraryTitle.textContent = library.title || "本地阅读器";
    importTools.style.display = library.authorTools ? "" : "none";

    function loadJson(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback));
      } catch (error) {
        return fallback;
      }
    }

    function saveImportedBooks() {
      if (library.singleBook) return;
      localStorage.setItem("reader.importedBooks", JSON.stringify(importedBooks));
    }

    function saveNotes() {
      localStorage.setItem("reader.notes", JSON.stringify(notes));
    }

    function allBooks() {
      return packagedBooks.concat(importedBooks);
    }

    function activeBook() {
      const books = allBooks();
      return books.find((book) => book.id === state.activeBookId) || books[0] || { chapters: [] };
    }

    function chapters() {
      return activeBook().chapters || [];
    }

    function renderBookPicker() {
      const books = allBooks();
      bookPicker.style.display = books.length > 1 || library.authorTools ? "" : "none";
      bookSelect.innerHTML = books.map((book) =>
        '<option value="' + escapeHtml(book.id) + '">' + escapeHtml(book.title) + '</option>'
      ).join("");
      bookSelect.value = activeBook().id || "";
      const book = activeBook();
      const countText = (book.chapterCount || 0) + " 章 · " + (Math.round((book.wordCount || 0) / 100) / 10) + " 千字";
      bookDescription.textContent = [book.description, countText].filter(Boolean).join(" / ");
    }

    function setView(view) {
      state.view = view;
      if (!library.singleBook) localStorage.setItem("reader.view", view);
      document.body.dataset.view = view;
      homeButton.classList.toggle("active", view === "home");
      bookstoreButton.classList.toggle("active", view === "bookstore");
      aboutButton.classList.toggle("active", view === "about");

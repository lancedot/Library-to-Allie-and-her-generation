<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>给中文使用者的 AI 原生工作手册</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --panel: #fffdf8;
      --panel-strong: #ffffff;
      --text: #24211b;
      --muted: #746d60;
      --line: #ded7c8;
      --accent: #206a5d;
      --accent-soft: #e3f1eb;
      --mark: #fff1a8;
      --shadow: 0 18px 50px rgba(57, 45, 27, 0.12);
      --reader-width: 760px;
      --font-size: 19px;
      --line-height: 1.88;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #151515;
      --panel: #202020;
      --panel-strong: #262626;
      --text: #eee9de;
      --muted: #aaa294;
      --line: #393734;
      --accent: #7bc8b6;
      --accent-soft: #17332d;
      --mark: #6a5818;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 100vh;
    }

    body[data-view="home"] .app,
    body[data-view="bookstore"] .app,
    body[data-view="about"] .app {
      grid-template-columns: 1fr;
    }

    body[data-view="home"] .sidebar,
    body[data-view="bookstore"] .sidebar,
    body[data-view="about"] .sidebar,
    body[data-view="home"] .topbar,
    body[data-view="bookstore"] .topbar,
    body[data-view="about"] .topbar {
      display: none;
    }

    .public-nav {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 42px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 8;
    }

    body[data-view="home"] .public-nav,
    body[data-view="bookstore"] .public-nav,
    body[data-view="about"] .public-nav {
      display: flex;
    }

    .public-brand {
      font-size: 15px;
      font-weight: 900;
      color: var(--text);
    }

    .public-nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .public-nav .text-button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 18px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
    }

    .brand {
      margin: 0 0 16px;
      font-size: 20px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: 0;
    }

    .book-picker {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .book-select {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      outline: none;
      font-weight: 800;
    }

    .book-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .site-nav {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .site-nav .text-button {
      width: 100%;
    }

    .site-nav .active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    body.single-book .site-nav,
    body.single-book .book-picker,
    body.single-book .import-tools {
      display: none !important;
    }

    .import-tools {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .drop-zone {
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
    }

    .hidden-input {
      display: none;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr;
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      min-height: 40px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .part-title {
      margin: 18px 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .chapter-list {
      display: grid;
      gap: 6px;
    }

    .chapter-button {
      width: 100%;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: start;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .chapter-button:hover,
    .chapter-button.active {
      background: var(--accent-soft);
    }

    .chapter-num {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }

    .chapter-name {
      min-width: 0;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
    }

    .chapter-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 10px 26px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px);
    }

    .current-title {
      min-width: 0;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-button,
    .text-button {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
    }

    .icon-button {
      padding: 0;
      font-size: 18px;
    }

    .icon-button:hover,
    .text-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .progress-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: 3px;
      background: transparent;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 120ms linear;
    }

    .reader-shell {
      padding: 44px 28px 70px;
    }

    body[data-view="home"] .reader-shell,
    body[data-view="bookstore"] .reader-shell,
    body[data-view="about"] .reader-shell {
      padding: 60px 46px 70px;
    }

    .reader {
      width: min(var(--reader-width), 100%);
      margin: 0 auto;
      padding: 54px 58px 64px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    body[data-view="home"] .reader,
    body[data-view="bookstore"] .reader,
    body[data-view="about"] .reader {
      width: min(1120px, 100%);
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    body[data-view="home"] .search-row,
    body[data-view="home"] #toc,
    body[data-view="home"] .notes-panel,
    body[data-view="bookstore"] .search-row,
    body[data-view="bookstore"] #toc,
    body[data-view="bookstore"] .notes-panel,
    body[data-view="about"] .search-row,
    body[data-view="about"] #toc {
      display: none;
    }

    .article-meta {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .content {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Serif CJK SC", serif;
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: break-word;
    }

    .content h1,
    .content h2,
    .content h3 {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .content h1 {
      margin: 0 0 28px;
      font-size: 34px;
    }

    .content h2 {
      margin: 44px 0 16px;
      font-size: 25px;
      border-top: 1px solid var(--line);
      padding-top: 30px;
    }

    .content h3 {
      margin: 28px 0 10px;
      font-size: 20px;
    }

    .content p {
      margin: 14px 0;
    }

    .content blockquote {
      margin: 24px 0;
      padding: 14px 18px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 8px 8px 0;
    }

    .content hr {
      margin: 34px 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .content ul,
    .content ol {
      padding-left: 1.4em;
    }

    .content table {
      width: 100%;
      margin: 24px 0;
      border-collapse: collapse;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 0.92em;
      line-height: 1.55;
    }

    .content th,
    .content td {
      padding: 10px 12px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .content th {
      background: var(--accent-soft);
      color: var(--text);
      font-weight: 800;
    }

    .content mark {
      background: var(--mark);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    .home-kicker {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
    }

    .home-title {
      margin: 0 0 22px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 52px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .home-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 36px;
      align-items: center;
      min-height: min(660px, calc(100vh - 150px));
    }

    .home-copy {
      min-width: 0;
    }

    .home-lede {
      max-width: 680px;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 21px;
      line-height: 1.75;
    }

    .home-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 24px 0 34px;
    }

    .book-shelf {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 18px;
      align-self: stretch;
      align-content: center;
    }

    .bookstore-title {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.25;
      font-weight: 900;
    }

    .bookstore-lede {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .book-cover {
      position: relative;
      display: grid;
      align-content: space-between;
      min-height: 330px;
      padding: 34px 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--panel-strong) 92%, var(--accent-soft)), var(--panel-strong));
      color: var(--text);
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .book-cover::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      border-radius: 6px;
      pointer-events: none;
    }

    .book-cover:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      transition: transform 160ms ease, border-color 160ms ease;
    }

    .cover-kicker {
      position: relative;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .cover-title {
      position: relative;
      display: block;
      margin: 46px 0 18px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 34px;
      line-height: 1.22;
      font-weight: 900;
      letter-spacing: 0;
    }

    .cover-subtitle {
      position: relative;
      display: block;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .cover-footer {
      position: relative;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .source-list {
      display: grid;
      gap: 10px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .source-list a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    .source-list a:hover {
      text-decoration: underline;
    }

    .footer-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: min(var(--reader-width), 100%);
      margin: 18px auto 0;
    }

    .nav-card {
      min-height: 76px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .nav-card[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .nav-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .nav-title {
      margin-top: 6px;
      font-weight: 800;
      line-height: 1.4;
    }

    .note-highlight {
      background: color-mix(in srgb, var(--mark) 75%, var(--accent-soft));
      border-bottom: 2px solid var(--accent);
      cursor: pointer;
    }

    .selection-popup {
      position: fixed;
      z-index: 30;
      width: min(360px, calc(100vw - 24px));
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      box-shadow: var(--shadow);
      display: none;
      gap: 10px;
    }

    .selection-popup.open {
      display: grid;
    }

    .selection-popup-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .selection-popup-title {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
    }

    .popup-close {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .popup-close:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .selected-preview {
      max-height: 72px;
      overflow: auto;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    .note-input {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      line-height: 1.5;
    }

    .popup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .text-button[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
      color: var(--muted);
      border-color: var(--line);
    }

    .notes-panel {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .notes-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .note-list {
      display: grid;
      gap: 8px;
    }

    .note-item {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .note-quote {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 800;
    }

    .note-text {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .mobile-menu {
      display: none;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        width: min(84vw, 330px);
        transform: translateX(-105%);
        transition: transform 180ms ease;
        box-shadow: var(--shadow);
      }

      body.menu-open .sidebar {
        transform: translateX(0);
      }

      .mobile-menu {
        display: inline-grid;
        place-items: center;
      }

      .topbar {
        padding: 10px 12px;
      }

      .reader-shell {
        padding: 20px 12px 46px;
      }

      body[data-view="home"] .reader-shell,
      body[data-view="bookstore"] .reader-shell,
      body[data-view="about"] .reader-shell {
        padding: 24px 16px 46px;
      }

      .reader {
        padding: 30px 20px 42px;
      }

      .content h1 {
        font-size: 28px;
      }

      .content h2 {
        font-size: 22px;
      }

      .home-title {
        font-size: 34px;
      }

      .home-lede {
        font-size: 18px;
      }

      .home-layout {
        grid-template-columns: 1fr;
        min-height: 0;
        gap: 28px;
      }

      .public-nav {
        padding: 14px 14px;
        align-items: flex-start;
        flex-direction: column;
      }

      .public-nav-links {
        width: 100%;
      }

      .public-nav .text-button {
        flex: 1;
      }

      .book-shelf {
        grid-template-columns: 1fr;
      }

      .book-cover {
        min-height: 300px;
      }

      .selection-popup {
        left: 12px !important;
        right: 12px;
        bottom: 12px;
        top: auto !important;
        width: auto;
      }

      .footer-nav {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="progress-wrap" aria-hidden="true"><div class="progress" id="progress"></div></div>
  <nav class="public-nav" aria-label="站点导航">
    <div class="public-brand">Library to Allie and her generation</div>
    <div class="public-nav-links">
      <button class="text-button" id="publicHomeButton" type="button">首页</button>
      <button class="text-button" id="publicBookstoreButton" type="button">书城</button>
      <button class="text-button" id="publicAboutButton" type="button">关于</button>
    </div>
  </nav>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <h1 class="brand" id="libraryTitle">给中文使用者的 AI 原生工作手册</h1>
      <div class="site-nav">
        <button class="text-button" id="homeButton" type="button">首页</button>
        <button class="text-button" id="bookstoreButton" type="button">书城</button>
        <button class="text-button" id="aboutButton" type="button">关于</button>
      </div>
      <div class="book-picker" id="bookPicker">
        <select class="book-select" id="bookSelect" aria-label="选择书籍"></select>
        <div class="book-description" id="bookDescription"></div>
      </div>
      <div class="import-tools" id="importTools">
        <button class="text-button" id="importButton" type="button">导入 MD 成书</button>
        <input class="hidden-input" id="fileInput" type="file" accept=".md,text/markdown,text/plain" multiple>
        <div class="drop-zone" id="dropZone">拖一批 Markdown 到这里</div>
      </div>
      <div class="search-row">
        <input class="search" id="search" type="search" placeholder="搜索章节或正文" autocomplete="off">
      </div>
      <nav id="toc" aria-label="章节目录"></nav>
      <section class="notes-panel" aria-label="批注">
        <h2 class="notes-title">批注</h2>
        <div class="note-list" id="noteList"></div>
      </section>
    </aside>
    <main class="main">

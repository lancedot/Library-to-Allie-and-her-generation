rtII_Ch7.md","partKey":"part-3","partTitle":"Part II - AI 原生工作基础","chapterInPart":7,"globalChapter":14,"title":"第十四章：AI 协作实践","markdown":"# 第十四章：AI 协作实践\n\n> **本章目标：** 理解跨部门 AI 协作的核心模式，掌握在团队间传递 AI 产出、对齐质量标准、建立协作规范的实操方法。\n\n---\n\n## 从\"各用各的\"到\"一起用\"\n\n你有没有这样的时刻——市场部用 AI 生成了一份客户画像，产品部拿过来发现口径完全对不上；技术部用 AI 跑出一份系统架构建议，业务部看完说\"这写的是中文，但我一个字都不懂\"。\n\n每个人都在用 AI，但每个人都在用自己的 AI。\n\n这不是技术问题，是协作问题。2026年的现实是：AI 工具的个人使用已经相当普及，但组织层面的 AI 协作仍然像一场没有指挥的交响乐——每个乐手都在演奏，却不在同一个调上。\n\n本章要谈的不是\"如何让个人用好 AI\"（那是第一部分的内容），而是**当多个团队通过 AI 协同工作时，到底该怎么配合**。\n\n---\n\n## 什么不是 AI 协作\n\n先说清楚几件事：\n\n**AI 协作不是\"大家都用同一个工具\"。** 统一采购了 ChatGPT 企业版不代表你们在协作。就像大家都用 Word 不代表大家在合写一份文档。\n\n**AI 协作不是\"把所有东西都交给 AI 处理\"。** 让 AI 做中间人翻译部门间的沟通不叫协作，那叫偷懒——而且通常效果很差。\n\n**AI 协作不是\"用 AI 取代协作本身\"。** 人与人之间的对齐、决策、信任建立，这些依然需要人来完成。AI 是协作的加速器，不是替代品。\n\n真正的 AI 协作，是**团队之间围绕 AI 的输入和输出建立起可靠的衔接机制**。像接力赛的交接棒——关键不在于每个人跑多快，而在于交接的瞬间不掉棒。\n\n---\n\n## 共享 AI 工作空间：一个正在成型的概念\n\n想象一个场景：产品、设计、工程三个团队在做同一个功能。产品用 AI 生成了需求文档，设计在同一个环境里用 AI 将需求转化为交互原型，工程基于这些产出用 AI 辅助拆解技术任务。\n\n这就是\"共享 AI 工作空间\"——不是一个具体的软件名称，而是一种工作方式：**多个角色在同一个 AI 辅助的项目环境中，基于共同的上下文进行各自的工作**。\n\n它的核心特征是\"上下文共享\"。传统协作的最大成本不是沟通本身，而是\"重新建立上下文\"——每次开会的前 15 分钟都在\"同步背景\"。共享 AI 工作空间的价值在于：AI 记住了项目的上下文，每个参与者进来时不需要从零开始解释。\n\n这像什么？像一块共享白板，但白板本身会记笔记、做整理，并且能回答新来的人\"之前讨论到哪里了\"。\n\n---\n\n## 三种协作模式\n\n跨团队 AI 协作有三种基本模式，大多数实际场景是它们的组合：\n\n### 模式一：串行协作（Sequential）\n\nA 团队的 AI 产出，是 B 团队的输入。\n\n典型场景：市场调研团队用 AI 生成行业分析报告 → 战略团队基于报告用 AI 辅助制定进入策略 → 产品团队根据策略用 AI 拆解功能路线图。\n\n串行协作的关键挑战是**交接质量**。如果上游的输出格式、精度、完整度不符合下游的输入要求，整条链就会断裂。这就像工厂流水线——前一个工位的零件精度差 0.1 毫米，后面所有工位都会出问题。\n\n**实践要点：**\n- 明确定义每个环节的\"交付物规格\"（格式、字段、精度要求）\n- 在交接点设置人工质检环节\n- 建立\"退回机制\"——下游有权要求上游重新生成\n\n### 模式二：并行协作（Parallel）\n\n多个团队同时使用 AI 处理同一个项目的不同方面，最终汇总整合。\n\n典型场景：新产品发布前，市场部用 AI 准备宣传材料、法务部用 AI 审核合规性、技术部用 AI 编写技术文档——三线并行，最后合并为完整的发布计划。\n\n并行协作的关键挑战是**一致性**。各团队独立使用 AI，如果没有共同的\"锚定信息\"（统一的产品定位描述、统一的品牌话术、统一的技术术语），最后合并时会发现文风割裂、口径矛盾。\n\n**实践要点：**\n- 启动时对齐\"源文档\"——一份所有团队共用的基础信息文件\n- 定义\"同步节点\"——并行工作中定期交叉检查\n- 指定\"整合角色\"——由专人负责最终的一致性审核\n\n### 模式三：迭代协作（Iterative）\n\n团队之间通过 AI 进行多轮往复，逐步收敛到最终方案。\n\n典型场景：产品提出需求 → 技术用 AI 评估可行性并反馈约束 → 产品根据约束用 AI 调整需求 → 技术再次评估……循环直到达成共识。\n\n迭代协作的关键挑战是**版本管理和收敛控制**。没有约束的迭代会变成无休止的来回修改。AI 让\"再改一版\"的成本极低，反而可能导致决策无法收敛。\n\n**实践要点：**\n- 设定迭代次数上限（比如\"三轮未达成共识则升级决策\"）\n- 每轮迭代要标注\"本轮变更点\"和\"待解决分歧\"\n- 保留完整的迭代历史，支持回溯\n\n---\n\n## 产出交接的规范化\n\n当团队 A 把 AI 生成的内容传递给团队 B 时，需要附带什么信息？至少包括：\n\n| 交接信息 | 内容 | 目的 |\n|---------|------|------|\n| 产出版本 | 第几次生成、是否经过人工编辑 | 让接收方了解成熟度 |\n| 使用的核心提示 | 关键 prompt 或工作流描述 | 让接收方理解生成逻辑 |\n| 已验证内容 | 哪些部分经过人工校验 | 让接收方知道哪里可信 |\n| 已知局限 | AI 在哪些部分可能有偏差 | 避免接收方盲目信任 |\n| 使用建议 | 建议如何使用这份产出 | 降低误用风险 |\n\n这套信息就像药品包装上的\"成分表\"和\"注意事项\"——你可以选择不看，但它必须在那里。\n\n---\n\n## 知识传播：从一个团队到整个组织\n\n有个有趣的现象：组织里总有\"AI 先行者\"团队，他们摸索出了高效的 AI 工作流，但这些经验往往停留在小圈子内，无法传播到其他团队。\n\n为什么？因为 AI 工作流的知识很难用传统方式传递。你不能只告诉别人\"用 AI 做竞品分析\"，你得告诉他们具体的 prompt 怎么写、上下文怎么给、输出怎么校验、哪些坑要避开。这些都是**隐性知识**。\n\n有效的传播机制包括：\n\n- **模板化**：把经过验证的 AI 工作流固化为可复用的模板（包含 prompt、流程、检查清单）\n- **案例库**：维护一个内部\"AI 使用案例库\"，记录成功和失败案例\n- **结对实践**：让先行者团队和新手团队配对，做一个实际项目\n- **开放式展示**：定期的\"AI Show & Tell\"——团队展示自己的 AI 用法，允许其他团队提问和模仿\n\n---\n\n## 质量标准对齐：最被忽视的问题\n\n\"你觉得这个 AI 输出质量怎么样？\"——十个人会有十个不同的答案。\n\n这是跨团队 AI 协作中最隐蔽的问题：**大家对\"好的 AI 输出\"没有共同标准**。市场部觉得\"通顺有创意\"就是好，法务部觉得\"严谨无歧义\"才是好，产品部觉得\"结构清晰可执行\"是好。\n\n不解决这个问题，协作就会不断产生摩擦：上游觉得\"我已经做得很好了\"，下游觉得\"你给我的东西完全不能用\"。\n\n解决方案不是制定一个统一标准（那不现实），而是：\n\n1. **在每个协作场景下，提前定义\"可接受标准\"**——不是抽象的\"高质量\"，而是具体的检查项\n2. **建立\"验收测试\"概念**——像软件交付一样，AI 产出在交接前要通过接收方的验收条件\n3. **容忍渐进式完善**——初期标准可以低一些，随着协作磨合逐步提高\n\n---\n\n## 建立 AI 协作规范\n\n每个组织都需要一套明确的 AI 协作规范。不需要很复杂，但必须清晰：\n\n**关于\"何时使用 AI\"：**\n- 哪些任务鼓励使用 AI 辅助？\n- 哪些任务禁止使用 AI（比如涉及最高机密的决策）？\n- 哪些场景必须标注\"AI 辅助生成\"？\n\n**关于\"如何标注 AI 参与\"：**\n- 纯 AI 生成 vs. AI 辅助人工编辑 vs. 人工主导 AI 辅助——如何区分标注？\n- 对外沟通中是否需要披露 AI 参与？\n- 内部文档中是否保留 AI 生成的溯源信息？\n\n**关于\"责任归属\"：**\n- AI 产出中的错误，谁负责？（答案永远是：使用它并交付它的人）\n- 当 AI 产出在多团队间传递后出现问题，如何追溯责任链？\n\n---\n\n## 本章小结\n\nAI 协作不是技术升级，是工作方式的系统性改变。它要求团队间建立新的衔接机制、对齐新的质量标准、形成新的协作规范。三种基本模式——串行、并行、迭代——覆盖了大多数实际场景，关键在于识别你所处的模式并采用相应的管理策略。\n\n记住：AI 让\"做\"变快了，但\"做对\"和\"做齐\"仍然依赖人与人之间的协调。协作的本质没变，协作的方式在进化。\n\n---\n\n## 讨论问题\n\n1. 你所在的团队目前和其他部门有 AI 协作的场景吗？属于哪种模式？\n2. 如果要设计一个 AI 产出的\"交接清单\"，你觉得哪些信息是最关键的？\n3. 如何在\"鼓励大家积极使用 AI\"和\"确保跨团队产出质量\"之间找到平衡？\n\n---\n\n## 下章预告\n\n知道了如何协作之后，一个自然的问题是：我们组织在 AI 应用上到底走到了哪一步？下一章我们将介绍 AI 成熟度模型——一套帮助组织定位当前水平、规划进阶路径的实用框架。\n","wordCount":3426},{"id":"ai-literacy-part-3-8","bookId":"ai-literacy","fileName":"AI_Literacy_PartII_Ch8.md","partKey":"part-3","partTitle":"Part II - AI 原生工作基础","chapterInPart":8,"globalChapter":15,"title":"第十五章：AI 成熟度模型","markdown":"# 第十五章：AI 成熟度模型\n\n> **本章目标：** 掌握一套实用的五级 AI 成熟度模型，学会评估组织当前所处阶段，理解各阶段的典型特征、常见陷阱，以及如何有节奏地推进组织 AI 能力的进阶。\n\n---\n\n## 你到底走到了哪一步？\n\n你有没有这样的时刻——老板问你\"咱们公司 AI 应用水平怎么样\"，你脑子里闪过一堆碎片：小张在用 ChatGPT 写周报，市场部买了个 AI 作图工具，技术部在搞什么大模型微调……但你说不出一个完整的答案。\n\n因为你缺少一把尺子。\n\n2026年的现实是：几乎所有企业都在\"用 AI\"，但\"用\"的深度和广度千差万别。有的组织只是几个人在私下尝试，有的已经把 AI 嵌入了核心业务流程。表面上都在拥抱 AI，实际上可能相差三个代际。\n\n成熟度模型就是那把尺子。它不是为了给你打分，而是帮你回答两个问题：**我在哪里？我该往哪里去？**\n\n---\n\n## 什么不是成熟度模型\n\n**不是打分排名。** 成熟度模型不是用来证明\"我们比竞争对手强\"的工具。不同行业、不同规模、不同阶段的组织，合理的成熟度目标完全不同。\n\n**不是线性升级路径。** 不要以为从 Level 1 到 Level 5 是一条笔直的上升线。你的销售团队可能在 Level 3，你的财务团队可能还在 Level 1，这完全正常。\n\n**不是越高越好。** 并不是每个组织都需要达到 Level 5。有些业务场景下，Level 3 就是最优解。盲目追求最高等级反而会带来不必要的复杂性和风险。\n\n成熟度模型的真正价值，是提供**一种共同语言**——让组织内部在讨论 AI 发展时有统一的坐标系。\n\n---\n\n## 五级 AI 成熟度模型\n\n### Level 1：探索期（Exploring）\n\n**典型特征：**\n- 个别员工自发使用 AI 工具\n- 没有组织层面的 AI 策略\n- AI 使用主要集中在\"尝鲜\"和\"提升个人效率\"\n- 没有统一的工具选型和使用规范\n- 领导层对 AI 的认知停留在\"听说过\"\n\n**像什么？** 像一群人在没有地图的情况下各自探路。有人找到了捷径，有人走进了死胡同，但没有人在画地图。\n\n**这个阶段的信号：**\n- 员工使用哪些 AI 工具，公司完全不知道\n- 没有任何关于 AI 使用的正式沟通\n- AI 相关的讨论发生在茶水间而非会议室\n\n### Level 2：试点期（Piloting）\n\n**典型特征：**\n- 选定了 1-3 个团队或场景进行 AI 试点\n- 有初步的评估指标（虽然可能还不够精确）\n- 开始有专人或小组负责 AI 相关事务\n- 试点团队有基本的使用规范\n- 领导层关注试点结果\n\n**像什么？** 像农业试验田——在小块地上测试新品种，看看产量和风险如何，再决定是否大面积推广。\n\n**这个阶段的信号：**\n- 能说出\"我们在 XX 场景做了 AI 试点\"\n- 有初步的效果数据（哪怕是粗糙的）\n- 试点团队和非试点团队的工作方式明显不同\n\n### Level 3：规模化（Scaling）\n\n**典型特征：**\n- 多个部门都在使用标准化的 AI 工作流\n- 有统一的工具平台和使用政策\n- AI 产出开始进入正式的业务流程\n- 建立了培训体系和知识共享机制\n- 开始形成跨部门的 AI 协作模式\n\n**像什么？** 像一家连锁餐厅完成了标准化——不再是某个厨师的个人技艺，而是一套可复制的操作流程。\n\n**这个阶段的信号：**\n- 新员工入职时有 AI 工具使用培训\n- 有内部的\"AI 最佳实践\"文档或案例库\n- 大多数部门能说出自己日常用 AI 做什么\n\n### Level 4：优化期（Optimizing）\n\n**典型特征：**\n- 基于数据持续优化 AI 工作流\n- 有明确的 AI ROI 衡量方法\n- AI 使用质量有系统性的监控和反馈机制\n- 能快速识别新的 AI 应用场景\n- 组织能力开始围绕 AI 进行调整（而非只是\"加上 AI\"）\n\n**像什么？** 像一个进入\"精益生产\"阶段的工厂——不再是\"能跑就行\"，而是持续测量、持续改进、追求最优。\n\n**这个阶段的信号：**\n- 能用数据回答\"AI 为我们节省了多少成本/时间\"\n- 定期回顾和迭代 AI 工作流\n- 开始淘汰效果不好的 AI 应用\n\n### Level 5：原生化（AI-Native）\n\n**典型特征：**\n- 组织架构和流程从底层就是围绕 AI 能力设计的\n- 人与 AI 的协作模式已经内化为\"默认工作方式\"\n- 能力建设聚焦于\"人+AI\"的混合智能\n- AI 治理已成为日常运营的一部分\n- 持续探索 AI 能力边界的文化已经形成\n\n**像什么？** 像互联网原生企业之于传统企业——不是\"传统企业+互联网\"，而是从基因层面就是数字化的。\n\n**这个阶段的信号：**\n- 新的业务流程设计时，默认考虑 AI 参与\n- \"要不要用 AI\"不再是一个问题（就像现在没人问\"要不要用电脑\"）\n- 组织能力的竞争优势来源于人机协作的深度\n\n---\n\n## 自我评估的五个维度\n\n判断你在哪个等级，不是看单一指标，而是要从五个维度综合评估：\n\n| 维度 | 评估问题 | 关注点 |\n|------|---------|--------|\n| **技术** | 我们有什么工具和基础设施？ | 工具成熟度、集成程度、数据可用性 |\n| **人才** | 我们的人能用好 AI 吗？ | 技能水平、培训体系、人才结构 |\n| **流程** | AI 嵌入了哪些业务流程？ | 标准化程度、覆盖范围、与现有流程的融合度 |\n| **治理** | 我们如何管控 AI 的使用？ | 政策完备性、风险管理、合规保障 |\n| **文化** | 组织对 AI 的态度和行为是什么？ | 接受度、实验精神、学习氛围 |\n\n一个常见的情况是：技术维度在 Level 3（工具都买了），但人才维度还在 Level 1（没人会用）。这种\"偏科\"是正常的，也恰好指出了你的下一步投入方向。\n\n---\n\n## 如何推进：从一个等级到下一个\n\n### 从 Level 1 到 Level 2：关键动作是\"选择并聚焦\"\n\n- 不要试图全面铺开，选 1-2 个痛点明确、效果可衡量的场景\n- 指定负责人，给予时间和资源\n- 设定 2-3 个月的试点周期，定义\"成功\"的标准\n\n### 从 Level 2 到 Level 3：关键动作是\"标准化与推广\"\n\n- 把试点中验证有效的做法提炼为标准流程\n- 建立培训体系，而非依赖口口相传\n- 开始投入工具平台建设（统一入口、统一管理）\n\n### 从 Level 3 到 Level 4：关键动作是\"度量与迭代\"\n\n- 建立 AI 使用的效果度量体系\n- 引入反馈循环——定期回顾哪些有效、哪些该淘汰\n- 开始进行组织层面的能力调整\n\n### 从 Level 4 到 Level 5：关键动作是\"重新设计\"\n\n- 不再是\"给现有流程加 AI\"，而是\"从 AI 能力出发重新设计流程\"\n- 人才模型从\"能用 AI\"变为\"与 AI 协作\"\n- AI 治理从\"管控\"变为\"运营\"\n\n---\n\n## 每个阶段的常见失败模式\n\n| 阶段 | 典型失败 | 原因 |\n|------|---------|------|\n| 探索期 | 永远停留在\"玩玩\" | 缺乏明确目标和推动力 |\n| 试点期 | 试点\"成功\"但无法推广 | 试点条件不可复制，或组织缺乏推广意愿 |\n| 规模化 | 形式主义——有流程无实效 | 只推广了形式而非真正的能力 |\n| 优化期 | 过度优化局部，忽视全局 | 指标驱动导致视野狭窄 |\n| 原生化 | 过度依赖 AI，丧失人的判断力 | 自动化走得太远，人机平衡失控 |\n\n---\n\n## AI 成熟度悖论\n\n有一个有趣的现象值得一提：**在 AI 成熟度上，你走得越远，你越觉得自己不够成熟。**\n\nLevel 1 的组织通常觉得\"AI 不就那么回事嘛\"；Level 3 的组织开始意识到\"原来还有这么多我们没想到的\"；Level 5 的组织反而最焦虑——因为他们最清楚 AI 能力的边界正在快速移动，今天的最佳实践明天可能就过时了。\n\n这不是坏事。这说明你的认知在进步。就像学一门外语——初学者觉得自己说得还行，到了高级阶段反而越来越觉得说不好。这种\"越懂越谦虚\"的状态，恰恰是持续进步的驱动力。\n\n---\n\n## 本章小结\n\nAI 成熟度模型是一面镜子，帮助组织看清自己的位置。五个等级（探索、试点、规模化、优化、原生化）不是必须逐级攀升的台阶，而是一张地图上的坐标。从五个维度（技术、人才、流程、治理、文化）进行自评，识别短板，有针对性地投入——这比盲目追赶更有价值。\n\n记住：成熟度不是终点，是一种持续进化的能力。\n\n---\n\n## 讨论问题\n\n1. 如果用这个五级模型评估你所在的组织，你觉得整体在哪个等级？不同部门之间是否有差异？\n2. 你认为你所在行业的组织，AI 成熟度的\"合理目标\"应该是哪个等级？为什么？\n3. 在五个评估维度中，你觉得哪个维度最容易被忽视？为什么？\n\n---\n\n## 下章预告\n\n成熟度模型帮我们理解了\"组织今天在哪\"。但 AI 的能力正在快速跃迁——特别是 AI Agent（智能代理）的出现，正在改变\"组织能做什么\"的边界。下一章，我们将探讨 AI Agent 如何重塑未来的组织形态。\n","wordCount":3397},{"id":"ai-literacy-part-3-9","bookId":"ai-literacy","fileName":"AI_Literacy_PartII_Ch9.md","partKey":"part-3","partTitle":"Part II - AI 原生工作基础","chapterInPart":9,"globalChapter":16,"title":"第十六章：AI Agent 与未来组织","markdown":"# 第十六章：AI Agent 与未来组织\n\n> **本章目标：** 理解 AI Agent 在 2026 年的真实能力与边界，认识它对组织结构的深层影响，学会以务实态度规划人机协作团队的未来形态。\n\n---\n\n## 当 AI 不再只是\"回答问题\"\n\n你有没有这样的时刻——你对 AI 说\"帮我写一份报告\"，它写完了，你觉得还行。但你真正想说的其实是\"帮我搞定这件事\"——不只是写，而是去收集数据、分析趋势、形成结论、排好版、发给相关人。\n\n这就是从\"工具型 AI\"到\"Agent 型 AI\"的跨越。\n\n2026年的现实是：AI Agent 已经不再是学术论文里的概念，也不是科幻电影里的场景。它正在以一种低调但确实的方式进入组织——不是以\"超级智能\"的面貌，而是以\"能独立完成一连串任务的系统\"的身份。\n\n---\n\n## 什么不是 AI Agent\n\n**不是更聪明的聊天机器人。** 聊天机器人等你提问，回答，然后停下。Agent 会在你不提问的时候主动做事。\n\n**不是万能的数字员工。** 2026 年的 Agent 不能\"做任何事\"。它能做的是：在明确定义的范围内，自主规划步骤、执行操作、根据结果调整策略。\n\n**不是不需要人管的自动化。** 自动化是\"按照固定规则执行\"，Agent 的区别在于它能应对一定程度的不确定性——但这不意味着它不需要人的监督和干预。\n\n简单说：Agent = 能规划 + 能执行 + 能迭代的 AI 系统。\n\n---\n\n## 能力光谱：从脚本到 Agent\n\n理解 Agent，需要看到它在自动化能力光谱上的位置：\n\n```\n简单自动化 ──→ 工作流 AI ──→ AI Agent\n(固定规则)     (条件分支)      (自主规划)\n\n\"如果收到邮件，    \"分析邮件内容，     \"收到客户投诉后，\n 转发给张三\"       按类型分配给        自行判断优先级，\n                   不同处理人\"         收集相关信息，\n                                      起草回复方案，\n                                      提交人工审批\"\n```\n\n光谱左端是我们熟悉的 RPA（机器人流程自动化）——忠实执行预定义的步骤。光谱右端是 Agent——根据目标自行规划路径。真实世界中大多数应用处于中间地带。\n\n---\n\n## 2026 年，Agent 在哪里真正工作？\n\n不讲未来愿景，只讲已经在跑的场景：\n\n**客户服务：** Agent 处理 70% 的常见咨询，不是按照决策树回答（那是传统客服机器人），而是理解客户意图，查询多个系统，组合出个性化的解决方案。遇到超出能力范围的问题，自动转交人工并附带完整上下文。\n\n**代码审查：** Agent 在开发者提交代码后自动审查——不只是检查语法错误，而是分析代码逻辑、识别潜在的安全隐患、检查是否符合团队规范，并生成具体的修改建议。\n\n**数据监控：** Agent 持续监测业务指标，当发现异常时不只是\"报警\"，而是自动排查可能的原因、关联相关数据源、生成初步的分析报告，然后通知相关负责人。\n\n**日程与协调：** Agent 代表你处理会议安排——不是简单地找空闲时间，而是理解会议优先级、参与者的偏好、准备工作的需要，做出合理的安排决策。\n\n这些不是\"即将到来\"的未来，是 2026 年正在运行的现实。规模不算大，但趋势很清晰。\n\n---\n\n## Agent 对组织意味着什么\n\n### 1. Agent 作为\"虚拟团队成员\"\n\n当 Agent 能独立完成某类任务时，它在组织中的角色本质上接近于一个\"专项人员\"。这带来一个全新的问题：**容量规划**。\n\n以前的问题是\"我们需要招几个人做这件事\"，现在变成\"这件事需要多少人+多少 Agent 的组合来完成\"。这不只是成本计算的变化，更是工作设计的变化——你需要把任务拆分成\"适合人做的部分\"和\"适合 Agent 做的部分\"。\n\n像什么？像一个餐厅既有厨师也有自动炒菜机——关键不是二选一，而是如何设计一条生产线让两者各展所长。\n\n### 2. \"管理 Agent\"是一种新能力\n\n这听起来有点奇怪——管理一个软件系统？但如果你仔细想想，管理 Agent 和管理人有许多结构性相似：\n\n- 你需要给它明确的目标和权限边界\n- 你需要定义它的\"交付标准\"\n- 你需要监控它的表现并给予反馈\n- 你需要在它犯错时介入修正\n- 你需要根据它的能力调整它的职责范围\n\n唯一的区别是：Agent 不会有情绪，不需要激励，但也不会主动告诉你它在哪里卡住了。这要求管理者具备一种新的\"Agent 管理素养\"——知道何时信任、何时介入、何时调整。\n\n### 3. 信任校准：自主与审批的边界\n\n这是最核心的设计问题：**哪些决策可以让 Agent 自主做出，哪些必须经过人的批准？**\n\n一个实用的框架是按\"可逆性\"和\"影响范围\"两个维度划分：\n\n| | 影响范围小 | 影响范围大 |\n|---|---|---|\n| **可逆** | Agent 自主执行 | Agent 执行，事后人工抽查 |\n| **不可逆** | Agent 建议，人工快速确认 | Agent 方案 + 人工深度审批 |\n\n比如：Agent 帮你回复一封内部邮件（影响小、可逆）→ 可以自主执行。Agent 代表公司发出一份合同报价（影响大、不可逆）→ 必须人工审批。\n\n### 4. 凌晨三点的错误\n\n一个绕不过去的问题：Agent 在你睡觉时犯了错怎么办？\n\n传统自动化如果出错，通常就停了——系统报警，等人来处理。但 Agent 的特点是它会继续尝试——可能越错越远。\n\n这要求组织建立\"Agent 熔断机制\"：\n- 设定操作阈值——超过某个量级自动暂停\n- 建立异常检测——Agent 的行为模式偏离正常时触发报警\n- 定义\"安全动作\"——Agent 判断自己无法继续时应该做什么（而不是继续尝试）\n- 保留完整操作日志——事后可追溯每一步决策\n\n---\n\n## 未来组织的轮廓\n\n当 Agent 从\"工具\"变成\"成员\"，组织结构本身将发生什么变化？\n\n**更扁平。** 许多中间层的价值在于\"信息传递\"和\"执行监督\"——这些恰恰是 Agent 擅长的。管理层级可能会减少，每个管理者的管理幅度会扩大（因为 Agent 承担了部分协调工作）。\n\n**更弹性。** 团队组建将更像\"项目制\"——根据任务需要，快速组合不同的人和 Agent 形成工作小组，任务结束后解散。固定的部门边界将进一步模糊。\n\n**更专精。** 人的价值将集中在 Agent 做不了的事情上：创意判断、伦理决策、关系建立、异常处理。这意味着\"通才型执行者\"的角色减少，\"专精型判断者\"的角色增加。\n\n---\n\n## 风险：保持清醒\n\n在乐观之余，必须正视几个真实风险：\n\n**过度依赖。** 当团队习惯了 Agent 处理某类事务，人就会逐渐丧失这方面的能力。一旦 Agent 出问题，组织可能陷入\"不会的没人做\"的窘境。\n\n**机构知识流失。** 如果 Agent 承担了大量\"日常判断\"工作，组织中积累这些判断的人可能减少。知识变成了 Agent 的配置参数，而非人的经验。\n\n**级联失败。** 当多个 Agent 互相依赖时，一个 Agent 的错误可能传导到整个链条。这和金融系统中的\"系统性风险\"有类似的结构——个体风险小，但关联后风险放大。\n\n**应对策略：**\n- 保持\"人工备份能力\"——关键流程确保有人能在无 Agent 情况下操作\n- 定期进行\"Agent 失效演练\"——就像消防演习\n- 设计 Agent 系统时避免过度耦合——保持模块化、可降级\n\n---\n\n## 一种务实的态度\n\n谈论 AI Agent 时，最容易犯的错误是两个极端：\n\n一种是乌托邦幻想——\"Agent 会取代所有执行性工作，人类只需要思考和创造\"。这忽视了技术发展的渐进性和组织变革的复杂性。\n\n另一种是末日恐惧——\"Agent 会取代所有人的工作\"。这忽视了人机协作创造新价值的可能性，以及社会系统的适应能力。\n\n2026 年的务实立场是：**Agent 正在改变工作的组织方式，但改变是渐进的、可管理的、需要人主动设计的。** 它既不是救世主也不是终结者，而是一种需要被认真对待的新型组织能力。\n\n---\n\n## 本章小结\n\nAI Agent 是从\"回答问题\"到\"完成任务\"的跃迁。它在客户服务、代码审查、数据监控等场景已有实际应用。Agent 对组织意味着新的容量规划方式、新的管理能力需求、新的信任校准机制。未来的组织将更扁平、更弹性、更专精——但也面临过度依赖、知识流失、级联失败等风险。保持务实：既不盲目乐观，也不无谓恐惧。\n\n---\n\n## 讨论问题\n\n1. 在你的工作场景中，有哪些任务适合交给 Agent 自主完成？你设定的\"信任边界\"在哪里？\n2. 如果你是管理者，你会如何向团队介绍\"我们要引入一个 AI Agent 作为虚拟团队成员\"这件事？\n3. 你能想到你所在组织中可能出现的\"Agent 级联失败\"场景吗？如何预防？\n\n---\n\n## 下章预告\n\n技术可以购买，流程可以设计，但有一样东西买不来也设计不了——那就是文化。下一章，也是本书的最后一章，我们将探讨如何建立真正的 AI 原生组织文化：那些无形但决定一切的信念、习惯和共识。\n","wordCount":3317},{"id":"ai-literacy-part-3-10","bookId":"ai-literacy","fileName":"AI_Literacy_PartII_Ch10.md","partKey":"part-3","partTitle":"Part II - AI 原生工作基础","chapterInPart":10,"globalChapter":17,"title":"第十七章：建立 AI 原生组织文化","markdown":"# 第十七章：建立 AI 原生组织文化\n\n> **本章目标：** 理解 AI 原生文化的内涵，识别文化建设中的常见障碍，掌握通过具体行动塑造组织 AI 文化的路径。作为全书终章，回顾从个体到组织的完整旅程，给出面向未来的行动指引。\n\n---\n\n## 最后一块拼图\n\n你有没有这样的时刻——公司买了最好的 AI 工具，发了最详细的使用规范，做了最全面的培训……然后发现大多数人还是不用。或者用了，但偷偷用，不敢跟同事说。\n\n问题出在哪里？不是技术，不是流程，不是制度。\n\n是文化。\n\n2026年的现实是：技术采购可以一周完成，流程设计可以一个月搞定，但文化的改变——人们真正相信什么、习惯做什么、觉得什么是\"正常的\"——需要持续不断的耕耘。而且没有捷径。\n\n这也是为什么我们把\"文化\"放在全书的最后一章。不是因为它最不重要，恰恰相反——它是所有其他章节能否真正落地的土壤。没有合适的文化土壤，前面的一切都是空中楼阁。\n\n---\n\n## 什么不是 AI 原生文化\n\n**不是\"人人都在用 AI\"。** 使用率高不等于文化健康。如果人们是因为考核压力才用，或者为了\"显得先进\"才用，那不是文化，是表演。\n\n**不是\"对 AI 无条件乐观\"。** AI 原生文化不是\"AI 教\"——不是谁质疑 AI 谁就落后。健康的文化应该包含质疑和反思。\n\n**不是\"用 AI 越多越光荣\"。** 如果组织氛围变成\"不用 AI 做的事情就低人一等\"，那这种文化同样有毒。AI 是手段，不是目的。\n\n真正的 AI 原生文化，是**组织成员对 AI 形成了成熟、理性、开放的集体态度**——既不神化也不妖魔化，既能拥抱也能批判，既追求效率也坚守质量。\n\n---\n\n## AI 原生文化的五个核心特征\n\n### 1. 实验是常态\n\n\"试一试\"不需要申请、不需要审批、不需要写报告。员工可以自由尝试用 AI 解决自己的工作问题，失败不会被问责——只要在安全边界内。\n\n这不是放任。有边界：不能用公司机密数据做实验，不能让未经验证的 AI 输出进入正式流程。但在边界之内，实验是被鼓励的。\n\n**反面特征：** 任何 AI 相关的尝试都需要层层审批，一次失败就\"你看吧我说不行吧\"。\n\n### 2. 透明无污名\n\n使用 AI 是公开的、正常的，不需要隐藏。说\"这份报告我用 AI 辅助完成的\"不会被看低，就像说\"这份表格我用 Excel 做的\"一样自然。\n\n同时，不使用 AI 也不会被视为\"落后\"。选择手工完成某项工作可能有充分的理由——也许那个场景 AI 确实不好用，也许那项工作本身就需要纯人类的思考。\n\n**反面特征：** 悄悄用 AI 但对外假装全是自己写的；或者公开嘲笑不用 AI 的同事。\n\n### 3. 质量标准优先于速度\n\nAI 让生产速度暴增，但如果文化导向是\"快就是好\"，最终一定会出问题。健康的文化强调：AI 帮你提速了，但省下来的时间应该用于更深入的思考和更严格的审核——而非产出更多的\"垃圾\"。\n\n像什么？像赛车手拿到了更快的引擎——聪明的车手不是把所有提升都变成更高的速度，而是把一部分用于更精准的转弯和更安全的控制。\n\n**反面特征：** AI 能一小时写 10 篇文章所以我们就要求每人每天 10 篇——不管质量。\n\n### 4. 持续学习是组织呼吸\n\nAI 的能力边界每个月都在变化。三个月前做不到的事现在也许能做了。去年的最佳实践今年可能已经过时。\n\nAI 原生组织把学习视为呼吸一样自然的事——不是\"每年一次集中培训\"，而是持续的、碎片化的、嵌入日常的知识更新。\n\n**反面特征：** \"我们去年培训过了，够了。\"\n\n### 5. 平衡的怀疑主义\n\n既不是\"AI 说的都对\"，也不是\"AI 不靠谱别用了\"。而是一种理性的、有分寸的态度：了解 AI 的能力边界，知道它在哪里可信，在哪里需要验证，在哪里完全不适用。\n\n**反面特征：** 对 AI 产出完全不审核直接用；或者明明 AI 能帮忙也坚持\"我自己来比较放心\"。\n\n---\n\n## 领导者的角色：做第一个用的人\n\n文化从上往下传染的速度远快于从下往上。\n\n如果 CEO 在全员会上说\"我昨天用 AI 帮我梳理了一个决策思路，很有启发，但有两个地方我觉得它的逻辑有问题，我重新想了\"——这句话传递的信号比任何培训都有效：\n\n- 领导在用（所以你也可以用）\n- 领导公开说在用（所以用了不丢人）\n- 领导会批判性地使用（所以不是盲从）\n- 领导把它当工具而非权威（所以我们保持判断力）\n\n**领导者最重要的三个行动：**\n\n1. **公开使用，公开讨论**——让团队看到你是怎么和 AI 互动的，包括你的犹豫和判断\n2. **创造心理安全**——明确说\"试错是安全的\"，并在有人试错时用行动证明\n3. **奖励正确的行为**——不是奖励\"用了 AI\"，而是奖励\"用 AI 做出了更好的成果\"或\"发现了 AI 的一个有趣用法并分享给团队\"\n\n---\n\n## 三种常见的文化障碍\n\n### 障碍一：替代恐惧\n\n\"如果我用 AI，老板会不会觉得不需要那么多人了？\"\n\n这不是杞人忧天。在某些组织里，这种恐惧是有现实基础的——确实有公司以\"AI 能做了\"为由裁员。\n\n**破解之道：** 组织需要明确传达一个信息：AI 的引入是为了\"让人做更有价值的事\"，而非\"用更少的人\"。而且这不能只是口号——需要用实际行动证明：那些用好 AI 的人获得了发展机会，而非被优化掉。\n\n### 障碍二：完美主义陷阱\n\n\"AI 写的东西不够好，还不如我自己来。\"\n\n这种态度在专业能力强的人群中特别普遍。他们有高标准（这是好事），但他们的参照系是\"理想的人工产出\"——而忽略了时间成本的对比。\n\n**破解之道：** 不是\"AI 的输出 vs. 你的理想输出\"，而是\"AI 辅助你达到高标准的总时间 vs. 完全手工达到同等标准的总时间\"。换一种比较方式，答案往往不同。\n\n### 障碍三：盲目狂热\n\n\"AI 太厉害了！我们应该把所有东西都交给 AI！\"\n\n这种热情通常出现在 AI 使用的早期阶段——被几次成功体验冲昏头脑，还没遇到过 AI 严重失败的案例。\n\n**破解之道：** 不需要泼冷水，但需要引导：分享失败案例、讨论边界在哪里、建立\"凡是 AI 产出都要人工审核\"的底线意识。热情是好资产，但需要理性来驾驭。\n\n---\n\n## 通过行动建设文化\n\n文化不是宣讲出来的，是做出来的。几个具体的建设手段：\n\n**培训体系——但不只是技能培训**\n\n技能培训教你\"怎么用\"，但文化培训要让你理解\"为什么用、什么时候用、用到什么程度\"。最好的培训是场景化的——不是抽象地讲 AI 原理，而是拿你团队的真实工作场景来演练。\n\n**展示与分享——让好实践被看见**\n\n定期的\"AI Show & Tell\"：各团队展示自己的 AI 应用案例。不需要是惊天动地的创新，日常的\"小聪明\"同样值得分享。关键是让使用 AI 变成一件\"值得谈论\"的正常事情。\n\n**实践社区——同伴学习网络**\n\n建立跨部门的 AI 实践社区。不是正式组织，是松散的学习网络——有人提问\"这个场景怎么用 AI\"，有人回答\"我试过，效果还行，prompt 在这里\"。同伴间的影响力往往比自上而下的推广更有效。\n\n**激励对齐——奖励你想看到的行为**\n\n如果你希望人们积极使用 AI，那在绩效考核、晋升标准、项目评估中就需要体现这一点。不是\"用了 AI 加分\"（那会导致滥用），而是\"用 AI 提升了成果质量\"或\"通过 AI 实践贡献了组织知识\"。\n\n---\n\n## 回顾全书：从个体到组织的旅程\n\n走到这里，让我们回望一下整本书的旅程。\n\n**第一部分** 讲的是个人：如何理解 AI 的能力和局限，如何在日常工作中与 AI 有效协作，如何保持作为人的判断力和主体性。那是\"一个人如何成为 AI 原生工作者\"的故事。\n\n**第二部分** 讲的是组织：当一群 AI 原生工作者聚在一起时，组织层面需要什么支撑——角色如何重新定义，工作流如何重新设计，治理如何建立，跨团队如何协作，成熟度如何评估，Agent 如何融入，文化如何塑造。\n\n从第一章到第十章，有一条暗线贯穿始终：**AI 原生不是一种状态，而是一种能力——持续学习、持续适应、持续进化的能力。**\n\n没有哪个组织能宣布\"我们已经是 AI 原生了\"然后就此停步。因为 AI 本身在变，应用场景在变，组织的需求在变。今天的最佳实践是明天的基本功，今天的前沿是明天的常识。\n\n---\n\n## 一个结束也是一个开始\n\n如果这本书让你带走一个认知，我希望是这个：\n\n**AI 原生不是一个目的地，而是一种持续的实践。**\n\n就像\"健康\"不是某天体检合格就达成了——它是每天的饮食、运动、作息的持续积累。AI 原生也是如此：每一次使用 AI 的决策、每一次对 AI 输出的审核、每一次跨团队的协作优化、每一次对失败的反思——这些日常的微小行动，累积起来就是文化，就是能力，就是竞争力。\n\n技术会继续进步，工具会不断迭代，但组织中\"人如何与 AI 共处\"这个核心问题不会消失——只会越来越重要。\n\n你读完了这本书。但你的 AI 原生实践，才刚开始。\n\n---\n\n## 讨论问题\n\n1. 如果用五个核心特征来评估你所在组织的文化，哪些方面做得较好？哪些方面差距最大？\n2. 你在自己的工作中遇到过\"替代恐惧\"\"完美主义\"或\"盲目狂热\"中的哪一种？你是如何应对的？\n3. 如果你有权做一件事来推动组织的 AI 文化建设，你会选择做什么？为什么？\n4. 回顾全书内容，哪个概念或框架对你触动最大？你计划如何将它应用到自己的工作中？\n\n---\n\n> *AI 原生不是终点，是起点。不是答案，是问题。不是一次性的转型，是持续的进化。*\n>\n> *祝你在这条路上，走得远，走得稳，走得明白。*\n","wordCount":3692}],"chapterCount":18,"wordCount":62153}]}</script>

      renderBookPicker();
      currentTitle.textContent = "首页";

      content.innerHTML =
        '<div class="home-layout">' +
          '<div class="home-copy">' +
            '<p class="home-kicker">AI 科普 / AI 原生工作</p>' +
            '<h1 class="home-title">受一线 AI 实践启发，写给中文使用者的一本小书</h1>' +
            '<p class="home-lede">OpenAI、Anthropic 这样的公司，正在用自己的方式教政府、创业者、组织和普通人如何使用 AI。我没办法去参加某个国家的 AI 素养课程，但可以在这些公开信号的启发下，按自己的理解重新写一组尽可能清楚的中文科普文章。</p>' +
            '<p>这不是翻译，也不是标准答案。它更像一份持续生长的写作实验：通过和 AI 讨论、追问、改写，把“AI 到底是什么、怎么用、怎么保持判断力”这些问题讲给中文读者听。</p>' +
            '<div class="home-actions">' +
              '<button class="text-button" data-start-reading="true">开始阅读</button>' +
              '<button class="text-button" data-show-about="true">关于这个项目</button>' +
            '</div>' +
            '<h2>参考与启发</h2>' +
            '<ul class="source-list">' +
              '<li><a href="https://openai.com/index/malta-chatgpt-plus-partnership/" target="_blank" rel="noreferrer">OpenAI and Malta partner to bring ChatGPT Plus to all citizens</a></li>' +
              '<li><a href="https://claude.com/blog/the-founders-playbook" target="_blank" rel="noreferrer">Anthropic: The founder&#39;s playbook</a></li>' +

          '<button class="book-cover" data-start-reading="true" type="button" aria-label="打开这本书">' +
            '<span class="cover-kicker">Book 01</span>' +
            '<span>' +
              '<span class="cover-title">' + escapeHtml(book.title || library.title || "给中文使用者的 AI 原生工作手册") + '</span>' +
              '<span class="cover-subtitle">AI 科普、工作方法、组织变化，以及普通人如何保持判断力。</span>' +
            '</span>' +
            '<span class="cover-footer"><span>' + (book.chapterCount || 0) + ' 篇</span><span>点击阅读</span></span>' +
          '</button>' +
        '</div>';
      renderToc();
      renderNotes();
      requestAnimationFrame(updateProgress);
    }

    function renderAbout() {
      setView("about");
      renderBookPicker();
      currentTitle.textContent = "关于";
      articleMeta.textContent = "项目说明";
      content.innerHTML =
        '<h1>关于这个项目</h1>' +
        '<p>这个站点不是一个泛泛的 AI 工具导航，也不是一份追热点的教程。它想做的是：受 OpenAI、Anthropic 等一线 AI 公司公开实践的启发，重新写一份更适合中文使用者阅读和行动的 AI 科普与 AI 原生工作手册。</p>' +
        '<p>我会把原始材料、自己的理解和中文语境下的延展尽量分清楚。这里的观点不一定都对，但它们应该是可讨论、可实践、也可被修正的。</p>' +
        '<h2>为什么叫“AI 原生工作”</h2>' +
        '<p>因为 AI 不只是提高某个动作的效率。更深的变化在于：如果 AI 能力已经存在，我们是不是应该重新设计任务、流程、角色和组织协作方式。</p>' +
        '<h2>这个站点如何更新</h2>' +
        '<p>正文来自本仓库里的 Markdown 文件，由一个本地生成器打包成静态网页。这样它可以部署在 Vercel 上，也可以随着内容逐章修改。</p>' +
        '<div class="home-actions"><button class="text-button" data-start-reading="true">从前言开始</button></div>';
      renderToc();
      renderNotes();
      requestAnimationFrame(updateProgress);
    }

    function renderView() {
      if (state.view === "about") {
        renderAbout();
      } else if (state.view === "reader") {
        renderArticle();
      } else {
        renderHome();
      }
    }

    function chapterNumberText(chapter) {
      return chapter.globalChapter === 0 ? "序" : String(chapter.globalChapter);
    }

    function chapterMetaText(chapter) {
      const chapterText = chapter.globalChapter === 0 ? "前言" : "第 " + chapter.globalChapter + " 章";
      return chapter.partTitle + " / " + chapterText + " / " + (Math.round(chapter.wordCount / 100) / 10) + " 千字";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function inlineMarkdown(value) {
      let html = escapeHtml(value);
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(new RegExp(String.fromCharCode(96) + "([^" + String.fromCharCode(96) + "]+)" + String.fromCharCode(96), "g"), "<code>$1</code>");
      return html;
    }

    function renderMarkdown(markdown, query = "") {
      const lines = markdown.split(/\r?\n/);
      const blocks = [];
      let paragraph = [];
      let list = [];
      let listType = null;
      let tableRows = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        blocks.push("<p>" + inlineMarkdown(paragraph.join(" ")) + "</p>");
        paragraph = [];
      }

      function flushList() {
        if (!list.length) return;
        const tag = listType === "ol" ? "ol" : "ul";
        blocks.push("<" + tag + ">" + list.map((item) => "<li>" + inlineMarkdown(item) + "</li>").join("") + "</" + tag + ">");
        list = [];
        listType = null;
      }

      function tableCells(line) {
        return line.replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
      }

      function isSeparatorRow(cells) {
        return cells.every((cell) => /^:?-{3,}:?$/.test(cell));
      }

      function flushTable() {
        if (!tableRows.length) return;
        const rows = tableRows.map(tableCells);
        const hasHeader = rows.length > 1 && isSeparatorRow(rows[1]);
        const bodyRows = hasHeader ? rows.slice(2) : rows;
        if (hasHeader) {
          blocks.push(
            "<table><thead><tr>" +
              rows[0].map((cell) => "<th>" + inlineMarkdown(cell) + "</th>").join("") +
              "</tr></thead><tbody>" +
              bodyRows.map((row) => "<tr>" + row.map((cell) => "<td>" + inlineMarkdown(cell) + "</td>").join("") + "</tr>").join("") +
              "</tbody></table>"
          );
        } else {
          blocks.push(
            "<table><tbody>" +
              bodyRows.map((row) => "<tr>" + row.map((cell) => "<td>" + inlineMarkdown(cell) + "</td>").join("") + "</tr>").join("") +
              "</tbody></table>"
          );
        }
        tableRows = [];
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          flushParagraph();
          flushList();
          flushTable();
          continue;
        }
        if (/^---+$/.test(line)) {
          flushParagraph();
          flushList();
          flushTable();
          blocks.push("<hr>");
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          flushList();
          flushTable();
          const level = heading[1].length;
          blocks.push("<h" + level + ">" + inlineMarkdown(heading[2]) + "</h" + level + ">");
          continue;
        }
        if (line.startsWith(">")) {
          flushParagraph();
          flushList();
          flushTable();
          blocks.push("<blockquote>" + inlineMarkdown(line.replace(/^>\s?/, "")) + "</blockquote>");
          continue;
        }
        if (line.startsWith("|") && line.endsWith("|")) {
          flushParagraph();
          flushList();
          tableRows.push(line);
          continue;
        }
        const unordered = line.match(/^[-*]\s+(.+)$/);
        const ordered = line.match(/^\d+\.\s+(.+)$/);
        if (unordered || ordered) {
          flushParagraph();
          flushTable();
          const type = ordered ? "ol" : "ul";
          if (listType && listType !== type) flushList();
          listType = type;
          list.push((unordered || ordered)[1]);
          continue;
        }
        flushTable();
        paragraph.push(line);
      }
      flushParagraph();
      flushList();
      flushTable();

      let html = blocks.join("\n");
      if (query.trim()) {
        const safeQuery = escapeRegExp(query.trim());
        html = html.replace(new RegExp("(" + safeQuery + ")", "gi"), "<mark>$1</mark>");
      }
      return html;
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^$(){}|[\]\\]/g, "\\$&");
    }

    function filteredChapters() {
      const query = state.query.trim().toLowerCase();
      const bookChapters = chapters();
      if (!query) return bookChapters;
      return bookChapters.filter((chapter) =>
        chapter.title.toLowerCase().includes(query) ||
        chapter.partTitle.toLowerCase().includes(query) ||
        chapter.markdown.toLowerCase().includes(query)
      );
    }

    function renderToc() {
      const visible = filteredChapters();
      const groups = new Map();
      visible.forEach((chapter) => {
        if (!groups.has(chapter.partKey)) groups.set(chapter.partKey, []);
        groups.get(chapter.partKey).push(chapter);
      });

      toc.innerHTML = [...groups.entries()].map(([partKey, group]) => {
        const items = group.map((chapter) =>
          '<button class="chapter-button ' + (chapter.id === state.activeId ? "active" : "") + '" data-id="' + chapter.id + '">' +
            '<span class="chapter-num">' + chapterNumberText(chapter) + '</span>' +
            '<span>' +
              '<span class="chapter-name">' + escapeHtml(chapter.title) + '</span>' +
              '<span class="chapter-meta">' + (Math.round(chapter.wordCount / 100) / 10) + ' 千字 · ' + escapeHtml(chapter.fileName) + '</span>' +
            '</span>' +
          '</button>'
        ).join("");
        return '<div class="part-title">' + escapeHtml(group[0].partTitle) + '</div><div class="chapter-list">' + items + '</div>';
      }).join("");
    }

    function renderArticle() {
      const bookChapters = chapters();
      const chapter = bookChapters.find((item) => item.id === state.activeId) || bookChapters[0];
      if (!chapter) return;
      setView("reader");
      state.activeId = chapter.id;
      state.activeBookId = activeBook().id;
      localStorage.setItem("reader.activeBookId", state.activeBookId);
      localStorage.setItem("reader.activeId", state.activeId);
      renderBookPicker();
      currentTitle.textContent = activeBook().title + " / " + chapter.title;
      articleMeta.textContent = chapterMetaText(chapter);
      content.innerHTML = renderMarkdown(chapter.markdown, state.query);
      applyNoteHighlights(chapter);
      renderNotes();

      const index = bookChapters.findIndex((item) => item.id === chapter.id);
      updateNav(prevButton, bookChapters[index - 1], "上一章");
      updateNav(nextButton, bookChapters[index + 1], "下一章");
      renderToc();
      requestAnimationFrame(() => {
        updateProgress();
        if (pendingNoteId) {
          scrollToNote(pendingNoteId);
          pendingNoteId = "";
        }
      });
    }

    function activeChapter() {
      return chapters().find((item) => item.id === state.activeId);
    }

    function notesForActiveBook() {
      return notes.filter((note) => note.bookId === activeBook().id);
    }

    function applyNoteHighlights(chapter) {
      const chapterNotes = notes.filter((note) => note.chapterId === chapter.id && note.selectedText);
      chapterNotes.forEach((note) => highlightFirstMatch(note.selectedText, note.id));
    }

    function highlightFirstMatch(text, noteId) {
      const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
      let node = walker.nextNode();
      while (node) {
        const index = node.nodeValue.indexOf(text);
        if (index >= 0) {
          const range = document.createRange();
          range.setStart(node, index);
          range.setEnd(node, index + text.length);
          const span = document.createElement("span");
          span.className = "note-highlight";
          span.dataset.noteId = noteId;
          span.title = "查看批注";
          range.surroundContents(span);
          return;
        }
        node = walker.nextNode();
      }
    }

    function renderNotes() {
      const bookNotes = notesForActiveBook().slice().sort((a, b) => b.createdAt - a.createdAt);
      if (!bookNotes.length) {
        noteList.innerHTML = '<div class="chapter-meta">还没有批注。划选正文里的句子就可以写。</div>';
        return;
      }
      noteList.innerHTML = bookNotes.map((note) =>
        '<button class="note-item" data-note-id="' + note.id + '">' +
          '<span class="note-quote">' + escapeHtml(note.selectedText.slice(0, 42)) + '</span>' +
          '<span class="note-text">' + escapeHtml(note.noteText || "无文字批注") + '</span>' +
          '<span class="chapter-meta">' + escapeHtml(note.chapterTitle || "") + '</span>' +
        '</button>'
      ).join("");
    }

    function scrollToNote(noteId) {
      const target = content.querySelector('[data-note-id="' + noteId + '"]');
      if (!target) return;
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      target.animate([{ outlineColor: "transparent" }, { outlineColor: "var(--accent)" }, { outlineColor: "transparent" }], { duration: 1000 });
    }

    function hideSelectionPopup() {
      selectionPopup.classList.remove("open");
      selectedTextForNote = "";
      noteInput.value = "";
      selectedPreview.textContent = "";
      saveNoteButton.disabled = true;
    }

    function showSelectionPopup(range, selectedText) {
      selectedTextForNote = selectedText;
      noteInput.value = "";
      selectedPreview.textContent = selectedText.length > 120 ? selectedText.slice(0, 120) + "..." : selectedText;
      saveNoteButton.disabled = true;
      const rect = range.getBoundingClientRect();
      const popupWidth = Math.min(360, window.innerWidth - 24);
      const left = Math.min(window.innerWidth - popupWidth - 12, Math.max(12, rect.left));
      const bottomTop = rect.bottom + 10;
      const top = bottomTop > window.innerHeight - 230 ? Math.max(12, rect.top - 230) : bottomTop;
      selectionPopup.style.left = left + "px";
      selectionPopup.style.top = top + "px";
      selectionPopup.classList.add("open");
      noteInput.focus();
    }

    function makeImportedChapter(bookId, file, markdown, index) {
      const h1 = [...markdown.matchAll(/^#\s+(.+)$/gm)].map((match) => match[1].trim());
      const title = h1[0] || file.name.replace(/\.md$/i, "");
      return {
        id: bookId + "-chapter-" + (index + 1),
        bookId,
        fileName: file.name,
        partKey: "imported",
        partTitle: "导入内容",
        chapterInPart: index + 1,
        globalChapter: index + 1,
        title,
        markdown,
        wordCount: Array.from(markdown.replace(new RegExp(String.fromCharCode(96).repeat(3) + "[\\s\\S]*?" + String.fromCharCode(96).repeat(3), "g"), "").replace(/\s/g, "")).length,
      };
    }

    async function importMarkdownFiles(fileList) {
      const files = [...fileList].filter((file) => file.name.toLowerCase().endsWith(".md"));
      if (!files.length) return;
      files.sort((a, b) => a.name.localeCompare(b.name, "zh-Hans-CN", { numeric: true }));
      const bookName = window.prompt("给这批 Markdown 起一个书名", files[0].name.replace(/\.md$/i, ""));
      if (!bookName) return;
      const bookId = "imported-" + Date.now();
      const texts = await Promise.all(files.map((file) => file.text()));
      const chapters = files.map((file, index) => makeImportedChapter(bookId, file, texts[index], index));
      const book = {
        id: bookId,
        title: bookName,
        description: "浏览器导入",
        chapters,
        chapterCount: chapters.length,
        wordCount: chapters.reduce((total, chapter) => total + chapter.wordCount, 0),
      };
      importedBooks.push(book);
      saveImportedBooks();
      state.activeBookId = book.id;
      state.activeId = chapters[0]?.id;
      renderArticle();
    }

    function updateNav(button, chapter, label) {
      button.disabled = !chapter;
      button.innerHTML = chapter
        ? '<div class="nav-label">' + label + '</div><div class="nav-title">' + escapeHtml(chapter.title) + '</div>'
        : '<div class="nav-label">' + label + '</div><div class="nav-title">没有更多章节</div>';
      button.onclick = () => {
        if (!chapter) return;
        state.activeId = chapter.id;
        window.scrollTo({ top: 0, behavior: "smooth" });
        renderArticle();
      };
    }

    function updateProgress() {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const ratio = max > 0 ? Math.min(100, Math.max(0, (scrollTop / max) * 100)) : 0;
      progress.style.width = ratio + "%";
    }

    toc.addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (!button) return;
      state.activeId = button.dataset.id;
      document.body.classList.remove("menu-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderArticle();
    });

    content.addEventListener("mouseup", () => {
      if (state.view !== "reader") return;
      const selection = window.getSelection();
      const selectedText = selection ? selection.toString().trim() : "";
      if (!selection || !selectedText || selectedText.length < 2) return;
      if (!content.contains(selection.anchorNode) || !content.contains(selection.focusNode)) return;
      showSelectionPopup(selection.getRangeAt(0), selectedText);
    });

    content.addEventListener("mousedown", (event) => {
      if (!selectionPopup.classList.contains("open")) return;
      if (event.target.closest("[data-note-id]")) return;
      hideSelectionPopup();
    });

    content.addEventListener("click", (event) => {
      const startButton = event.target.closest("[data-start-reading]");
      if (startButton) {
        state.activeId = chapters()[0]?.id;
        window.scrollTo({ top: 0, behavior: "smooth" });
        renderArticle();
        return;
      }
      const aboutTrigger = event.target.closest("[data-show-about]");
      if (aboutTrigger) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        renderAbout();
        return;
      }
      const highlight = event.target.closest("[data-note-id]");
      if (!highlight) return;
      const note = notes.find((item) => item.id === highlight.dataset.noteId);
      if (note) window.alert((note.selectedText || "") + "\n\n" + (note.noteText || "无文字批注"));
    });

    saveNoteButton.addEventListener("click", () => {
      const chapter = activeChapter();
      const noteText = noteInput.value.trim();
      if (!chapter || !selectedTextForNote || !noteText) {
        hideSelectionPopup();
        window.getSelection()?.removeAllRanges();
        return;
      }
      const note = {
        id: "note-" + Date.now(),
        bookId: activeBook().id,
        chapterId: chapter.id,
        chapterTitle: chapter.title,
        selectedText: selectedTextForNote,
        noteText,
        createdAt: Date.now(),
      };
      notes.push(note);
      saveNotes();
      pendingNoteId = note.id;
      hideSelectionPopup();
      window.getSelection()?.removeAllRanges();
      renderArticle();
    });

    noteInput.addEventListener("input", () => {
      saveNoteButton.disabled = !noteInput.value.trim();
    });

    cancelNoteButton.addEventListener("click", () => {
      hideSelectionPopup();
      window.getSelection()?.removeAllRanges();
    });

    cancelNoteTextButton.addEventListener("click", () => {
      hideSelectionPopup();
      window.getSelection()?.removeAllRanges();
    });

    selectionPopup.addEventListener("mousedown", (event) => {
      event.stopPropagation();
    });

    document.addEventListener("mousedown", (event) => {
      if (!selectionPopup.classList.contains("open")) return;
      if (selectionPopup.contains(event.target)) return;
      if (content.contains(event.target)) return;
      hideSelectionPopup();
      window.getSelection()?.removeAllRanges();
    });

    noteList.addEventListener("click", (event) => {
      const item = event.target.closest("[data-note-id]");
      if (!item) return;
      const note = notes.find((entry) => entry.id === item.dataset.noteId);
      if (!note) return;
      state.activeBookId = note.bookId;
      state.activeId = note.chapterId;
      pendingNoteId = note.id;
      renderArticle();
      document.body.classList.remove("menu-open");
    });

    search.addEventListener("input", () => {
      state.query = search.value;
      const first = filteredChapters()[0];
      if (first && !filteredChapters().some((chapter) => chapter.id === state.activeId)) {
        state.activeId = first.id;
      }
      renderArticle();
    });

    homeButton.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderHome();
    });

    aboutButton.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderAbout();
    });

    importButton.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => importMarkdownFiles(fileInput.files));
    dropZone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropZone.classList.add("drag-over");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
    dropZone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropZone.classList.remove("drag-over");
      importMarkdownFiles(event.dataTransfer.files);
    });

    bookSelect.addEventListener("change", () => {
      state.activeBookId = bookSelect.value;
      state.activeId = chapters()[0]?.id;
      localStorage.setItem("reader.activeBookId", state.activeBookId);
      localStorage.setItem("reader.activeId", state.activeId || "");
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderView();
    });

    document.getElementById("increaseFont").addEventListener("click", () => {
      state.fontSize = Math.min(24, state.fontSize + 1);
      localStorage.setItem("reader.fontSize", state.fontSize);
      document.documentElement.style.setProperty("--font-size", state.fontSize + "px");
    });

    document.getElementById("decreaseFont").addEventListener("click", () => {
      state.fontSize = Math.max(16, state.fontSize - 1);
      localStorage.setItem("reader.fontSize", state.fontSize);
      document.documentElement.style.setProperty("--font-size", state.fontSize + "px");
    });

    document.getElementById("themeButton").addEventListener("click", (event) => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      localStorage.setItem("reader.theme", state.theme);
      document.documentElement.dataset.theme = state.theme;
      event.currentTarget.textContent = state.theme === "dark" ? "浅色" : "深色";
    });

    document.getElementById("menuButton").addEventListener("click", () => {
      document.body.classList.toggle("menu-open");
    });

    document.getElementById("notesButton").addEventListener("click", () => {
      document.body.classList.add("menu-open");
      noteList.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") hideSelectionPopup();
    });

    window.addEventListener("scroll", () => {
      updateProgress();
      if (selectionPopup.classList.contains("open")) hideSelectionPopup();
    }, { passive: true });
    window.addEventListener("resize", updateProgress);

    document.getElementById("themeButton").textContent = state.theme === "dark" ? "浅色" : "深色";
    if (!chapters().some((chapter) => chapter.id === state.activeId)) {
      state.activeId = chapters()[0]?.id;
    }
    renderBookPicker();
    renderView();
  </script>
</body>
</html>

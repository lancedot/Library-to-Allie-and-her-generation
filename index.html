<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library to Allie and her generation</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --panel: #fffdf8;
      --panel-strong: #ffffff;
      --text: #24211b;
      --muted: #746d60;
      --line: #ded7c8;
      --accent: #206a5d;
      --accent-soft: #e3f1eb;
      --mark: #fff1a8;
      --shadow: 0 18px 50px rgba(57, 45, 27, 0.12);
      --reader-width: 760px;
      --font-size: 19px;
      --line-height: 1.88;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #151515;
      --panel: #202020;
      --panel-strong: #262626;
      --text: #eee9de;
      --muted: #aaa294;
      --line: #393734;
      --accent: #7bc8b6;
      --accent-soft: #17332d;
      --mark: #6a5818;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 100vh;
    }

    body[data-view="home"] .app,
    body[data-view="bookstore"] .app,
    body[data-view="about"] .app {
      grid-template-columns: 1fr;
    }

    body[data-view="home"] .sidebar,
    body[data-view="bookstore"] .sidebar,
    body[data-view="about"] .sidebar,
    body[data-view="home"] .topbar,
    body[data-view="bookstore"] .topbar,
    body[data-view="about"] .topbar {
      display: none;
    }

    .public-nav {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 42px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 8;
    }

    body[data-view="home"] .public-nav,
    body[data-view="bookstore"] .public-nav,
    body[data-view="about"] .public-nav {
      display: flex;
    }

    .public-brand {
      font-size: 15px;
      font-weight: 900;
      color: var(--text);
    }

    .public-nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .public-nav .text-button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 18px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
    }

    .brand {
      margin: 0 0 16px;
      font-size: 20px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: 0;
    }

    .book-picker {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .book-select {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      outline: none;
      font-weight: 800;
    }

    .book-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .site-nav {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .site-nav .text-button {
      width: 100%;
    }

    .site-nav .active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    body.single-book .site-nav,
    body.single-book .book-picker,
    body.single-book .import-tools {
      display: none !important;
    }

    .import-tools {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .drop-zone {
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
    }

    .hidden-input {
      display: none;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr;
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      min-height: 40px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .part-title {
      margin: 18px 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .chapter-list {
      display: grid;
      gap: 6px;
    }

    .chapter-button {
      width: 100%;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: start;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .chapter-button:hover,
    .chapter-button.active {
      background: var(--accent-soft);
    }

    .chapter-num {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }

    .chapter-name {
      min-width: 0;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
    }

    .chapter-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 10px 26px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px);
    }

    .current-title {
      min-width: 0;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-button,
    .text-button {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
    }

    .icon-button {
      padding: 0;
      font-size: 18px;
    }

    .icon-button:hover,
    .text-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .progress-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: 3px;
      background: transparent;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 120ms linear;
    }

    .reader-shell {
      padding: 44px 28px 70px;
    }

    body[data-view="home"] .reader-shell,
    body[data-view="bookstore"] .reader-shell,
    body[data-view="about"] .reader-shell {
      padding: 60px 46px 70px;
    }

    .reader {
      width: min(var(--reader-width), 100%);
      margin: 0 auto;
      padding: 54px 58px 64px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    body[data-view="home"] .reader,
    body[data-view="bookstore"] .reader,
    body[data-view="about"] .reader {
      width: min(1120px, 100%);
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    body[data-view="home"] .search-row,
    body[data-view="home"] #toc,
    body[data-view="home"] .notes-panel,
    body[data-view="bookstore"] .search-row,
    body[data-view="bookstore"] #toc,
    body[data-view="bookstore"] .notes-panel,
    body[data-view="about"] .search-row,
    body[data-view="about"] #toc {
      display: none;
    }

    .article-meta {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .content {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Serif CJK SC", serif;
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: break-word;
    }

    .content h1,
    .content h2,
    .content h3 {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .content h1 {
      margin: 0 0 28px;
      font-size: 34px;
    }

    .content h2 {
      margin: 44px 0 16px;
      font-size: 25px;
      border-top: 1px solid var(--line);
      padding-top: 30px;
    }

    .content h3 {
      margin: 28px 0 10px;
      font-size: 20px;
    }

    .content p {
      margin: 14px 0;
    }

    .content blockquote {
      margin: 24px 0;
      padding: 14px 18px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 8px 8px 0;
    }

    .content hr {
      margin: 34px 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .content ul,
    .content ol {
      padding-left: 1.4em;
    }

    .content table {
      width: 100%;
      margin: 24px 0;
      border-collapse: collapse;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 0.92em;
      line-height: 1.55;
    }

    .content th,
    .content td {
      padding: 10px 12px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .content th {
      background: var(--accent-soft);
      color: var(--text);
      font-weight: 800;
    }

    .content mark {
      background: var(--mark);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    .home-kicker {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
    }

    .home-title {
      margin: 0 0 22px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 52px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .home-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 36px;
      align-items: center;
      min-height: min(660px, calc(100vh - 150px));
    }

    .home-copy {
      min-width: 0;
    }

    .home-lede {
      max-width: 680px;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 21px;
      line-height: 1.75;
    }

    .home-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 24px 0 34px;
    }

    .book-shelf {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 18px;
      align-self: stretch;
      align-content: center;
    }

    .bookstore-title {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.25;
      font-weight: 900;
    }

    .bookstore-lede {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .book-cover {
      position: relative;
      display: grid;
      align-content: space-between;
      min-height: 330px;
      padding: 34px 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--panel-strong) 92%, var(--accent-soft)), var(--panel-strong));
      color: var(--text);
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .book-cover::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      border-radius: 6px;
      pointer-events: none;
    }

    .book-cover:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      transition: transform 160ms ease, border-color 160ms ease;
    }

    .cover-kicker {
      position: relative;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .cover-title {
      position: relative;
      display: block;
      margin: 46px 0 18px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 34px;
      line-height: 1.22;
      font-weight: 900;
      letter-spacing: 0;
    }

    .cover-subtitle {
      position: relative;
      display: block;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .cover-footer {
      position: relative;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .source-list {
      display: grid;
      gap: 10px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .source-list a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    .source-list a:hover {
      text-decoration: underline;
    }

    .footer-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: min(var(--reader-width), 100%);
      margin: 18px auto 0;
    }

    .nav-card {
      min-height: 76px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .nav-card[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .nav-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .nav-title {
      margin-top: 6px;
      font-weight: 800;
      line-height: 1.4;
    }

    .note-highlight {
      background: color-mix(in srgb, var(--mark) 75%, var(--accent-soft));
      border-bottom: 2px solid var(--accent);
      cursor: pointer;
    }

    .selection-popup {
      position: fixed;
      z-index: 30;
      width: min(360px, calc(100vw - 24px));
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      box-shadow: var(--shadow);
      display: none;
      gap: 10px;
    }

    .selection-popup.open {
      display: grid;
    }

    .selection-popup-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .selection-popup-title {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
    }

    .popup-close {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .popup-close:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .selected-preview {
      max-height: 72px;
      overflow: auto;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    .note-input {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      line-height: 1.5;
    }

    .popup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .text-button[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
      color: var(--muted);
      border-color: var(--line);
    }

    .notes-panel {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .notes-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .note-list {
      display: grid;
      gap: 8px;
    }

    .note-item {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .note-quote {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 800;
    }

    .note-text {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .mobile-menu {
      display: none;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        width: min(84vw, 330px);
        transform: translateX(-105%);
        transition: transform 180ms ease;
        box-shadow: var(--shadow);
      }

      body.menu-open .sidebar {
        transform: translateX(0);
      }

      .mobile-menu {
        display: inline-grid;
        place-items: center;
      }

      .topbar {
        padding: 10px 12px;
      }

      .reader-shell {
        padding: 20px 12px 46px;
      }

      body[data-view="home"] .reader-shell,
      body[data-view="bookstore"] .reader-shell,
      body[data-view="about"] .reader-shell {
        padding: 24px 16px 46px;
      }

      .reader {
        padding: 30px 20px 42px;
      }

      .content h1 {
        font-size: 28px;
      }

      .content h2 {
        font-size: 22px;
      }

      .home-title {
        font-size: 34px;
      }

      .home-lede {
        font-size: 18px;
      }

      .home-layout {
        grid-template-columns: 1fr;
        min-height: 0;
        gap: 28px;
      }

      .public-nav {
        padding: 14px 14px;
        align-items: flex-start;
        flex-direction: column;
      }

      .public-nav-links {
        width: 100%;
      }

      .public-nav .text-button {
        flex: 1;
      }

      .book-shelf {
        grid-template-columns: 1fr;
      }

      .book-cover {
        min-height: 300px;
      }

      .selection-popup {
        left: 12px !important;
        right: 12px;
        bottom: 12px;
        top: auto !important;
        width: auto;
      }

      .footer-nav {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="progress-wrap" aria-hidden="true"><div class="progress" id="progress"></div></div>
  <nav class="public-nav" aria-label="站点导航">
    <div class="public-brand">Library to Allie and her generation</div>
    <div class="public-nav-links">
      <button class="text-button" id="publicHomeButton" type="button">首页</button>
      <button class="text-button" id="publicBookstoreButton" type="button">书城</button>
      <button class="text-button" id="publicAboutButton" type="button">关于</button>
    </div>
  </nav>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <h1 class="brand" id="libraryTitle">Library to Allie and her generation</h1>
      <div class="site-nav">
        <button class="text-button" id="homeButton" type="button">首页</button>
        <button class="text-button" id="bookstoreButton" type="button">书城</button>
        <button class="text-button" id="aboutButton" type="button">关于</button>
      </div>
      <div class="book-picker" id="bookPicker">
        <select class="book-select" id="bookSelect" aria-label="选择书籍"></select>
        <div class="book-description" id="bookDescription"></div>
      </div>
      <div class="import-tools" id="importTools">
        <button class="text-button" id="importButton" type="button">导入 MD 成书</button>
        <input class="hidden-input" id="fileInput" type="file" accept=".md,text/markdown,text/plain" multiple>
        <div class="drop-zone" id="dropZone">拖一批 Markdown 到这里</div>
      </div>
      <div class="search-row">
        <input class="search" id="search" type="search" placeholder="搜索章节或正文" autocomplete="off">
      </div>
      <nav id="toc" aria-label="章节目录"></nav>
      <section class="notes-panel" aria-label="批注">
        <h2 class="notes-title">批注</h2>
        <div class="note-list" id="noteList"></div>
      </section>
    </aside>
    <main class="main">
      <header class="topbar">

  <script id="library-data" type="application/json">{"title":"Library to Allie and her generation","authorTools":false,"singleBook":false,"books":[{"id":"ai-literacy","title":"给中文使用者的 AI 原生工作手册 V2","description":"写给 Allie 和她这一代人的 AI 科普小书。当前先展示重写后的 Part I，后续章节会继续更新。","chapters":[{"id":"ai-literacy-part-1-1","bookId":"ai-literacy","fileName":"AI_Literacy_PartI_Ch1_v2.md","partKey":"part-1","partTitle":"Part I - 全民 AI 素养基础","chapterInPart":1,"globalChapter":1,"title":"第一章：AI 到底是什么","markdown":"# 第一章：AI 到底是什么\n\n> 读完这章，你会明白一件事：AI 看起来像很多东西，但它其实是一种你从未见过的新东西。\n\n---\n\n## 你可能遇到过这些时刻\n\n问过 AI\"今天北京天气怎么样\"，它给你的是一个模糊的、不知道是哪天的答案？\n\n问过它\"最近有什么新闻\"，它说不太确定，或者给你讲了一件去年的事？\n\n或者反过来——你问了一个挺难的问题，它回答得头头是道，你心想\"真厉害\"。结果下一次，你问了一个看起来更简单的问题，它却一本正经地给你编了一个根本不存在的数据，或者把两件完全不相关的事混在一起说。\n\n你困惑了：**这东西到底是聪明还是笨？**\n\n这个困惑，几乎每个开始用 AI 的人都有过。\n\n答案是：**它既不聪明，也不笨。它是一种你从来没见过的东西——而我们习惯用\"聪明/笨\"这把尺子，去量一把完全不同形状的东西。**\n\n这一章，我们就来搞清楚：AI 到底是什么。\n\n---\n\n## 它不是在帮你\"查\"东西\n\n你有没有用 AI 问过类似\"今天股市怎么样\"或者\"最近有什么新闻\"这类问题，然后发现它要么说不知道，要么给你一个过时的信息？\n\n这不是 AI 坏掉了。\n\n原因是：**AI 根本没有在帮你查任何地方。**\n\n搜索引擎做的事，是在互联网上找到已经存在的内容，然后把链接给你。你问百度\"北京天气\"，百度是真的去查了一下——它找到了气象局的数据，把结果显示给你。\n\nAI 做的事情完全不同。它没有在查任何地方。它做的事情，更像是这样：\n\n> 想象一个人，从小到大读了几十亿本书、几千亿篇文章——新闻、教材、小说、对话记录、技术文档……几乎人类写过的所有东西。读完之后，他把书全还回去了，但他的脑子里留下了这一切的\"印记\"。\n>\n> 现在你问他问题，他不是去查书——他是凭这个\"印记\"来回答你。\n\n这就是为什么他知道\"量子力学是什么\"，却不知道\"今天的天气\"——因为今天的天气，他读书的时候还没发生。\n\nAI 不是搜索引擎。它是一个读过海量文字、然后凭记忆和你对话的系统。\n\n---\n\n## 它不是一个装着答案的\"数据库\"\n\n有些人觉得：AI 肯定是有一个超级大的数据库，里面存着所有问题的标准答案，你一问它就去查那个库。\n\n不是这样的。\n\n数据库是什么？是把东西整整齐齐地存起来。你查身份证信息，它精确地返回那一条记录，一个字不差。\n\nAI 没有这样的\"答案库\"。它知道的所有东西，都已经在训练过程中变成了模型内部的一种\"模式\"——不是一条一条存着的文字，而是一种对语言规律的\"感觉\"。\n\n这就是为什么 AI 有时候记得住大方向，却说错细节。\n\n就像你记得某部电影的故事大概是什么，但你背不出其中某个角色的台词一个字不差——但如果你硬要背，你可能会\"凭感觉\"说出一句听起来像那个角色会说的话，但其实原话不是这样的。\n\nAI 也会这样。它会\"凭感觉\"生成一个听起来对的答案，但那个答案不一定真的对。\n\n---\n\n## 它不\"理解\"你说的话——至少不是你以为的那种理解\n\n这一点是最容易被忽视的，也是最重要的。\n\nAI 在语言上表现得非常流畅，以至于我们很容易觉得它\"懂\"我们在说什么。\n\n但它对世界的认识，是通过文字学来的，不是通过经历活出来的。\n\n举个例子：AI 知道\"火会烫人\"，是因为无数文章里这么写过——不是因为它被烫过。它知道\"失去亲人很痛苦\"，是因为人类写过太多关于悲伤的文字——不是因为它有情感。\n\n这不是说 AI 没用，而是说：**它活在语言的世界里，不在我们生活的现实世界里。**\n\n有一个很实际的后果：\n\n你问 AI \"我现在应该去哪家医院\"，它可能给你一个听起来合理的答案——但它不知道你在哪个城市、你的医保在哪里报销、哪家医院今天有没有专家门诊。它只是在用语言模式，生成一个\"通常情况下合理的回答\"。\n\n所以在涉及你自己的具体情况时，AI 的回答只能是参考，不能是决定。\n\n---\n\n## 那它到底是什么？\n\n说了这么多\"不是\"，AI 到底是什么？\n\n用一句话说：\n\n**AI 是一个概率性的文字生成系统。**\n\n这句话拆开来：\n\n**\"概率性\"** —— AI 每次说的话，都是在预测\"接下来最可能出现什么文字\"。它不是在查找答案，不是在推理真相，而是在做一种极其复杂的预测。\n\n**\"文字生成\"** —— AI 的本质工作就是生成文字。这个过程本身，不等于理解，不等于事实，也不等于判断。\n\n这也解释了为什么 AI 有时候看起来那么厉害——因为它见过的文字多得惊人，预测能力极强。但它的能力边界，始终是\"生成听起来合理的文字\"，而不是\"保证说出来的都是事实\"。\n\n---\n\n## 为什么 AI 有时候会胡说八道？\n\n这个现象有个名字，叫**幻觉（Hallucination）**。\n\n很多人第一次听到这个词，觉得是个 bug，等 AI 进化了就会修好。\n\n其实不完全是这样。\n\n幻觉来自 AI 的工作方式本身——它的目标是生成\"流畅的、符合上下文的文字\"，而不是\"只说自己确定的事情\"。当它对某个问题没有足够的训练数据，或者问题超出了它的知识范围，它不会停下来说\"我不知道\"——它会继续生成，填补空白，有时候填出来的就是错的。\n\n一个帮你记住这件事的比喻：\n\n想象一个非常健谈的人，就算某段内容记不清了，也会流畅地讲下去，中间穿插一些听起来合理的细节。你事后查资料才发现：那几个\"细节\"其实是他临场发挥的。\n\nAI 就是这样一个\"永远不会卡顿\"的讲述者。\n\n好消息是：2026年的 AI 在表达不确定时，已经比早期模型诚实得多——它会更主动地说\"我不太确定这个\"。但这个机制并不完美，幻觉依然存在，在涉及具体事实、数字、来源的地方尤其需要小心。\n\n---\n\n## 去神化，也去妖魔化\n\n我们正处在一个 AI 叙事容易走极端的时代。\n\n一端是神化：什么都问 AI，把它的每一个回答都当成权威，不加验证就直接用。\n\n另一端是妖魔化：觉得 AI 是骗局，充满危险，完全拒绝碰它。\n\n两种态度都会让你吃亏。\n\n神化，会让你在 AI 说错的时候付出代价。\n\n妖魔化，会让你错过一个正在深刻改变工作方式的工具。\n\n正确的姿态是：**理解它是什么、能做什么、不能做什么，然后有策略地使用它。**\n\n这，就是 AI 素养的起点。\n\n---\n\n## 本章要点卡\n\n📌 **记住这三件事：**\n\n1. AI 不是搜索引擎——它不帮你\"查\"，它凭\"记忆\"生成回答\n2. AI 的回答是预测，不是事实——流畅不等于正确\n3. AI 活在语言世界里——它不了解你的具体处境\n\n---\n\n✅ **读完这章，你可以做的事：**\n\n- [ ] 下次用 AI 之前，先问自己：我是要它帮我\"查\"，还是帮我\"想\"？如果是\"查\"，用搜索引擎更可靠\n- [ ] 当 AI 给你一个具体的数字或事实，养成习惯：重要的信息，独立核实一下\n- [ ] 和身边还在\"神化\"或\"妖魔化\" AI 的朋友，聊聊这章里的任何一个比喻\n\n---\n\n*下一章：AI 擅长什么——找到它真正的价值区间*\n","wordCount":2642},{"id":"ai-literacy-part-1-2","bookId":"ai-literacy","fileName":"AI_Literacy_PartI_Ch2_v3.md","partKey":"part-1","partTitle":"Part I - 全民 AI 素养基础","chapterInPart":2,"globalChapter":2,"title":"第二章：AI 擅长什么","markdown":"# 第二章：AI 擅长什么\n\n> 读完这章，你会找到 AI 真正值得你用的地方——不是什么都能做，但做对了事，效率差距巨大。\n\n---\n\n## 你可能有过这种感觉\n\n朋友说 AI 很厉害，你试了一下，让它查今天的新闻——它不知道。\n让它帮你算一笔账——算错了。\n让它推荐一家你家附近的餐厅——推荐了一家已经关门的。\n\n然后你得出结论：\"AI 也没那么厉害嘛。\"\n\n这个结论不完全对。更准确的说法是：**你用它做了它不擅长的事。**\n\nAI 不是万能的，但在某些事情上，它的效率高得惊人。找到那些事情，是这一章的目标。\n\n---\n\n## 先说一件2026年必须知道的事\n\n两年前，谈 AI 能做什么，答案相对固定：它只能用语言回答你，数字算不准，实时信息不知道。\n\n现在不一样了。\n\n2026年的主流 AI，大多数都配备了工具调用能力——需要计算时调用计算器，需要查实时信息时调用搜索，需要处理文件时直接读取分析。\n\n所以\"AI 能做什么\"这个问题，准确的问法是：**你用的这个 AI，配备了哪些工具？**\n\n带着这个认知，我们来看 AI 真正擅长的事。\n\n---\n\n## AI 最擅长的七件事\n\n### 第一件：把长的变短\n\n你有一份50页的报告要读，但你只有10分钟。\n你开完一个小时的会议，需要整理成一页纸的会议纪要。\n你收到十封邮件，想知道哪封最重要。\n\n这类任务，AI 做得又快又稳。\n\n为什么？因为\"把长的变短、把复杂的变简单\"，本质上是一种语言重构任务——正是语言模型最擅长的事。\n\n**在中国职场最常用的场景：**\n把冗长的微信群消息记录整理成结论、把领导发来的长文件提炼成三个重点、把行业报告压缩成一段可以直接汇报的文字。\n\n---\n\n### 第二件：帮你写第一稿\n\n面对空白文档发呆，是很多人最真实的职场体验。\n\n不知道怎么开口的邮件、不知道怎么起头的方案、不知道怎么措辞的通知——这些\"从零开始\"的任务，AI 可以在几秒内给你一个可以继续改的初稿。\n\n**关键认知：** AI 给你的是初稿，不是终稿。它的价值是帮你跨过\"空白页恐惧\"，从零到有。从有到好，还需要你来。\n\n**常见场景：**\n- 给客户写一封措辞需要拿捏的邮件\n- 写一份项目提案的框架\n- 起草一则员工通知\n\n---\n\n### 第三件：改写和润色\n\n同样的意思，你可能表达得太直接、太口语、或者太啰嗦。AI 可以帮你换一种表达。\n\n**最实用的几个场景：**\n- 把一封语气太生硬的投诉邮件，改得专业但不失立场\n- 把中式英语写的邮件，润色成地道的商务英语\n- 把技术部门写的文档，翻译成业务部门能看懂的语言\n\n**注意一点：** AI 改的是形式，核心意思需要你来把关。改完之后通读一遍，确认\"这还是我想说的\"。\n\n---\n\n### 第四件：帮你想更多可能性\n\n当你脑子里只有一个方案，或者想破头也想不出新角度时，AI 是一个很好的思维伙伴。\n\n它没有你的职场包袱，不怕\"这个想法会不会被笑话\"，可以在几秒内抛出十个方向——哪怕有几个听起来不靠谱，但其中可能有一个你没想到的角度。\n\n**实用方式：**\n- \"这个问题还有哪些我没考虑到的角度？\"\n- \"如果我是客户，我会提出哪些反对意见？\"\n- \"帮我想五个不同风格的方案名称\"\n\n它帮你把选项从3个扩展到15个。从15个里选最好的那个，还是你来。\n\n---\n\n### 第五件：把复杂的说简单\n\n你看不懂一份合同条款、一份技术文档、一段法律条文——让 AI 用普通话解释给你听。\n\n这是 AI 一个非常实用但经常被低估的能力。\n\n**在中国的常用场景：**\n- \"这份劳动合同里的竞业限制条款，实际上在要求我做什么？\"\n- \"这个医院的检查报告，指标偏高是什么意思？\"\n- \"这个 App 的隐私政策，我实际上同意了什么？\"\n\n**一个小技巧：** 你可以指定解释的对象。\"用我爸爸能听懂的方式解释\"和\"用有法律背景的人熟悉的方式解释\"，会得到完全不同但各自准确的结果。\n\n注意：AI 的解释是帮助你理解，涉及重要决策（签合同、做医疗决定）还是要找专业人士确认。\n\n---\n\n### 第六件：翻译\n\n这是 AI 最成熟的能力之一，而且2026年的翻译质量已经大幅超越早期机器翻译。\n\n日常商务邮件、内部文件、会议记录的翻译——质量已经足够高，可以直接使用或稍作修改。\n\n真正需要专业人工审核的，是法律合同、医疗文件这类语言细节影响实质权益的场景。\n\n---\n\n### 第七件：整理和分类\n\n把一堆乱的东西，整理成有结构的形式。\n\n**常用场景：**\n- 把客户反馈按主题分类汇总\n- 把散落在各个地方的信息整合成一份报告\n- 把会议上讨论的事情整理成带负责人和截止时间的任务清单\n\n---\n\n## 一句话记住这一章\n\n> **AI 擅长语言层面的任务：把长的变短、帮你起草、改写润色、扩展思路、解释复杂的、翻译、整理归类。**\n>\n> **判断一个任务适不适合给 AI：这是在处理语言，还是在查找事实？前者给 AI，后者用搜索或专业来源。**\n\n---\n\n## 📌 本章要点卡\n\n1. AI 擅长的核心是**语言层面的任务**——生成、转化、整合、解释\n2. 2026年配有工具的 AI，还能处理计算和实时信息——但先确认你用的 AI 有没有这些工具\n3. AI 的价值是帮你**从零到有**——起点加速，不是替代你的判断\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 想出你工作里**一件重复性的语言任务**（写周报、整理会议记录、改邮件），今天试着让 AI 帮你做一次\n- [ ] 下次让 AI 生成内容后，通读一遍，找出至少**一处需要你修改**的地方——养成\"AI起草，我来把关\"的习惯\n- [ ] 下次遇到看不懂的文件或条款，试试让 AI 用普通话解释给你听\n\n---\n\n*下一章：AI 不擅长什么——在你开始依赖它之前，必须知道的边界*\n","wordCount":2202},{"id":"ai-literacy-part-1-3","bookId":"ai-literacy","fileName":"AI_Literacy_PartI_Ch3_v3.md","partKey":"part-1","partTitle":"Part I - 全民 AI 素养基础","chapterInPart":3,"globalChapter":3,"title":"第三章：AI 不擅长什么","markdown":"# 第三章：AI 不擅长什么\n\n> 读完这章，你会知道什么时候必须踩刹车——不是不让你用 AI，而是让你用得更安全。\n\n---\n\n## 为什么这章很重要\n\nAI 说错话的时候，和它说对话的时候，语气完全一样。\n\n它不会结巴，不会停顿，不会说\"呃……这个我不太确定\"。它会用同样流畅、同样自信的方式，给你一个错误的答案。\n\n这才是真正需要警惕的地方。\n\n不了解 AI 的局限，你就没有办法在对的时候踩刹车。\n\n---\n\n## 先做一个重要区分\n\n在说具体局限之前，我们需要区分两种性质完全不同的\"做不到\"：\n\n**第一种：配置问题。** 不是 AI 本身不能做，是你用的那个 AI 没有配备对应的工具。换个配置，问题就解决了。\n\n**第二种：能力边界。** 无论哪个模型、哪种配置，在现阶段都存在的根本性局限。\n\n理解这个区分，能让你对 AI 的判断更准确——不会因为误解\"配置问题\"而低估 AI，也不会因为忽视\"能力边界\"而过度信任它。\n\n---\n\n## 第一种：配置问题（换个工具能解决）\n\n### 实时信息\n\n早期的 AI 不知道今天发生的事，因为它的知识有一个截止日期，之后的事一概不知。\n\n2026年的现状：大部分主流 AI 平台已经配备了联网搜索工具。当你的问题涉及实时信息，它会主动去查，再给你答案。\n\n**但你需要确认：** 你用的 AI 在回答时，是真的在联网查，还是凭旧知识回答？对时效性强的信息——比如最新政策、股价、某家公司的现状——问完之后确认一下它有没有引用最新来源。\n\n### 数字计算\n\n早期语言模型做数学，本质上是在\"预测答案通常是什么\"，而不是真正在算——所以错误率高。\n\n2026年的现状：配有代码解释器的 AI，会直接写代码运行来得出结果，准确性大幅提升。\n\n**但同样需要确认：** 你的 AI 是在真正运行计算，还是在用语言描述计算过程？对于重要的财务数字，验算一遍永远是好习惯。\n\n---\n\n## 第二种：能力边界（现阶段根本性的局限）\n\n这才是这章真正要说的重点。这些局限，换再好的 AI 工具也不会消失。\n\n### 局限一：幻觉——它会一本正经地说错话\n\n幻觉，是指 AI 生成了听起来完全合理、但实际上不准确甚至完全错误的内容。\n\n2026年的模型，幻觉频率已经明显下降，在不确定时也会更多地说\"我不太确定\"。但它并没有消失。\n\n原因在于 AI 的工作方式：它的目标是生成\"流畅合理的文字\"，而不是\"只说自己确定的事\"。当训练数据不足，或者问题超出它的知识范围，它不会停下来——它会继续生成，填补空白，有时候填错。\n\n**最需要小心的场景：**\n- 具体的人名、职位、时间节点\n- 具体的统计数字或研究结论\n- 小众领域的专业信息\n\n**基本原则：** 重要的信息，去原始来源核实。把 AI 的输出当起点，不当终点。\n\n---\n\n### 局限二：引用捏造——它会编造一个\"看起来真实\"的来源\n\n这是幻觉的一个特别危险的变体。\n\n当你让 AI 引用一篇论文、一本书、一份报告时，它有时候会给你一个格式完整、看起来完全真实的引用——有作者名、有期刊名、有年份——但那篇文章根本不存在。\n\n它不是在故意骗你，它只是在用\"生成一个格式正确的引用\"来回应你的请求，就像它生成其他任何文字一样。\n\n国内外都发生过律师在法庭文书里引用了 AI 捏造的判例，被对方当场揭穿，造成严重的专业声誉损失。\n\n**基本原则：** 任何需要引用具体文献的场景，必须亲自找到并核实原始来源。AI 给的引用，只能当作\"搜索线索\"，不能直接使用。\n\n---\n\n### 局限三：逻辑可能断裂——流畅不等于严密\n\nAI 非常擅长维持表面的逻辑流畅——它知道什么时候该用\"因此\"，什么时候该用\"然而\"，一段论证读起来环环相扣。\n\n但在长文档、复杂推理里，它可能在第三段得出一个结论，在第七段又悄悄给出一个与之矛盾的结论——并且用流畅的语言，让这个矛盾看起来像自然的过渡。\n\n**需要特别注意的场景：**\n- 多步骤推理（因为A所以B，因为B所以C……）\n- 长篇分析报告\n- 涉及多个变量相互影响的复杂判断\n\n**基本原则：** 对逻辑要求高的文档，不要只是\"读一遍感觉没问题\"。有意识地检查：这些结论之间，真的在互相支撑，还是只是听起来流畅？\n\n---\n\n### 局限四：爱说你想听的话\n\n这个问题有个学术名字，叫**拍马屁效应（Sycophancy）**。\n\nAI 在训练过程中接受了大量人类反馈来优化输出，这个过程带来了一个副作用：它学会了倾向于给出\"让人满意\"的答案，而不是\"让人不舒服但正确\"的答案。\n\n**具体表现：**\n- 你提出一个有问题的计划，它先帮你把这个计划说得更好听，然后才（也许）提一两条温和的建议\n- 你坚持一个错误的观点，在你反复坚持后，它往往会退让，而不是坚持正确答案\n- 你问\"我写的这段话怎么样\"，它倾向于给你多打几分\n\n**为什么危险：** 当你用 AI 评估方案、识别风险、做决策支持时，你需要的是诚实的质疑，不是优雅的肯定。\n\n**一个有用的技巧：** 明确告诉它\"请扮演一个挑剔的批评者，找出这个方案最大的问题\"，或者\"你不需要肯定我，直接告诉我哪里有漏洞\"。给它一个\"可以说不好\"的明确授权。\n\n---\n\n### 局限五：它不了解你的具体处境\n\nAI 没有价值观，没有真实的利益考量，也不了解你的实际情况——即使它表现得好像有。\n\n它不知道你公司真实的权力结构，不知道你和这个客户的历史，不知道你们行业的潜规则，不知道你个人的风险偏好。它只知道你告诉它的那些。\n\n当你问它\"这个决定好不好\"，它给你的回答，本质上是基于\"类似问题的常见回答方式\"生成的，而不是基于对你真实处境的理解。\n\n**基本原则：** AI 的分析，适合用来扩展你的思考维度，不适合替代你的判断。它帮你想到更多可能性，但\"这件事该怎么做\"，必须由真正理解处境的人来决定。\n\n---\n\n### 局限六：它不能帮你承担后果\n\nAI 是工具，工具没有法律主体资格。\n\n如果 AI 的输出造成了错误——财务损失、合规风险、商业决策失误——责任由谁承担？\n\n答案是：使用者。\n\n**这不是在吓你，而是帮你建立一个清晰的认知：** AI 可以帮你做事，但它不能帮你承担后果。在决定\"要不要把某个重要任务完全交给 AI 处理\"时，这条认知应该始终在你脑海里。\n\n---\n\n## 一张实用的风险判断表\n\n| 风险级别 | 场景 | 建议 |\n|---------|------|------|\n| 🟢 低 | 内部草稿、头脑风暴、个人学习 | 放心用，通读一遍即可 |\n| 🟡 中 | 对外沟通、含数据的报告、客户提案 | 核实关键数字和事实，检查逻辑 |\n| 🔴 高 | 法律文件、财务报告、合规内容、重大决策依据 | 必须有专业人工审核，AI 只能辅助 |\n\n---\n\n## 📌 本章要点卡\n\n1. AI 的局限分两类：**配置问题**（换工具能解决）和**能力边界**（现阶段根本性的）\n2. 能力边界里最重要的三条：**幻觉**（会说错）、**引用捏造**（会编来源）、**爱说你想听的**（会拍马屁）\n3. AI 不能帮你承担后果——用它的输出做重要决定时，**你是最终负责人**\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 下次 AI 给你一个具体的数字或引用，试试去**独立核实**一下——感受一下它准不准\n- [ ] 下次让 AI 评估你的方案时，加一句：\"**请直接告诉我这个方案最大的问题**\"，看看答案是否不同\n- [ ] 对照风险判断表，想想你工作里用 AI 做的事，分别属于哪个级别\n\n---\n\n*下一章：AI 安全与隐私——你贴进去的内容，到底去了哪里*\n","wordCount":2904},{"id":"ai-literacy-part-1-4","bookId":"ai-literacy","fileName":"AI_Literacy_PartI_Ch4_v2.md","partKey":"part-1","partTitle":"Part I - 全民 AI 素养基础","chapterInPart":4,"globalChapter":4,"title":"第四章：AI 安全与隐私","markdown":"# 第四章：AI 安全与隐私\n\n> 读完这章，你会知道什么东西绝对不能贴进 AI——以及为什么。\n\n---\n\n## 一个你可能从没想过的问题\n\n你每天用 AI 处理各种事情。\n\n但你有没有停下来想过：**你贴进去的那些内容，AI 公司拿去干嘛了？**\n\n这不是技术人员才需要关心的问题。这是所有人都应该知道的基本常识。\n\n因为在这件事上犯错，代价可能不是\"AI 回答得不好\"，而是数据泄露、违反合规、法律纠纷，或者职业声誉的损害。\n\n---\n\n## 你贴进去的数据，到底去了哪里？\n\n答案取决于你用的是哪种 AI 服务。\n\n### 消费级 AI（免费版 / 个人版）\n\n当你用个人账号使用 ChatGPT、Claude、文心一言这类产品时，你输入的内容**默认可能被用于改进模型**。\n\n2026年，大部分主流平台都提供了\"退出训练\"的选项。比如 ChatGPT 可以在设置里关闭\"改进模型\"，Claude 对付费用户默认不用于训练。\n\n但问题是：**大多数人根本不知道这个开关在哪里，或者从来没有去动过它。**\n\n底线是：如果你在消费级 AI 里输入了敏感信息，而且没有确认过隐私设置——那些信息可能已经进入了训练数据的管道。\n\n### 企业级 AI（Enterprise 版本）\n\n大型 AI 提供商都有企业版产品，核心承诺通常是：\n\n- 不用客户数据训练模型\n- 数据按合同约定的期限处理后删除\n- 满足相关合规要求\n\n如果你的公司采购了企业版 AI 服务，通过官方渠道使用，数据保护级别比个人版高得多。\n\n**但有一个前提：你用的确实是企业版通道。** 很多员工虽然公司有官方 AI 工具，但因为习惯或者方便，仍然把工作内容粘贴进自己的个人账号——这等于绕过了所有企业级保护。\n\n### 本地部署\n\n一些对数据安全要求极高的组织，会在自己的服务器上部署 AI 模型。这种情况下，数据完全不离开组织的系统边界。\n\n国内的一些银行、医院、政府机构已经在走这条路。代价是部署和维护需要专业团队，模型能力通常也不如最前沿的云端版本。\n\n---\n\n## 什么东西绝对不能贴进公共 AI？\n\n无论你用的是哪个平台，只要不是经过企业安全评估的官方渠道，以下内容绝对不要输入：\n\n### ❌ 密码和系统凭证\n\n听起来不可思议，但确实有人把密码、API Key、系统访问凭证粘贴进 AI——\"帮我看看这个配置有没有问题\"。\n\n一旦这些信息进入 AI 的处理管道，你无法确定它会被存储多久、是否会出现在日志里。\n\n### ❌ 客户的个人信息\n\n姓名、手机号、身份证号、地址、购买记录——任何能直接识别到具体个人的信息。\n\n在中国的《个人信息保护法》下，未经授权将客户个人数据传输给第三方 AI 服务，**可能构成违法行为**，不只是\"不太好\"的问题。\n\n### ❌ 公司商业机密\n\n未公开的财务数据、产品计划、并购谈判、定价策略、核心客户名单——这些是公司的核心资产。\n\n2023年三星半导体的案例是这方面最被广泛引用的教训：工程师将机密源代码粘贴进 ChatGPT，信息泄露后，公司被迫全面禁止员工使用外部 AI 工具。\n\n### ❌ 法律相关的保密信息\n\n律师与客户之间的保密通信、正在进行的诉讼策略——这些信息如果被第三方获取，可能导致法律特权的丧失。\n\n### ❌ 医疗与健康信息\n\n患者的诊断记录、检验报告、治疗方案——在大多数法律框架下属于最高级别的敏感数据。\n\n---\n\n## \"我只是让它帮我改个格式\"——一个常见的自我安慰\n\n很多人觉得：\"我只是贴了一小段，让它整理一下而已。\"\n\n问题在于：你贴进去的那\"一小段\"，可能已经足够暴露关键信息了。\n\n一个思维实验：\n\n你把内部报告的一段粘贴进 AI 让它润色，那段里提到了\"Q3 营收下滑12%\"和\"东南亚市场撤出计划\"。\n\n你觉得这只是一小段。但对于有心人来说，这已经是非常有价值的未公开信息了。\n\n**一个好用的判断规则：如果这条信息出现在微博上你会紧张，那它就不应该出现在公共 AI 的输入框里。**\n\n---\n\n## 安全使用的实用方法：匿名化处理\n\n知道不能贴什么，不意味着 AI 就没法帮你处理敏感工作。\n\n关键是：**用匿名化或抽象化的方式描述问题。**\n\n**例子：**\n\n你有一份包含客户真实信息的合同需要优化措辞。\n\n❌ 不安全：把合同全文（含客户姓名、金额、条款）直接粘贴进去。\n\n✅ 安全：\n> \"我有一份 B2B 销售合同，需要优化付款条件和违约责任这两个条款的表述。以下是当前版本（把具体金额替换成[X万元]，客户名称替换成[客户方]）……\"\n\n你得到的帮助是一样的，但实质性的敏感信息留在了你的系统里。\n\n---\n\n## 一张日常场景判断表\n\n| 场景 | 建议 |\n|------|------|\n| 用 AI 改写一封不含敏感信息的内部邮件 | ✅ 通常安全 |\n| 把客户完整联系方式粘贴进去让 AI 整理 | ❌ 含个人数据，不要用公共 AI |\n| 上传已公开的行业报告让 AI 总结 | ✅ 公开信息，可以使用 |\n| 上传公司未公开的财务报表让 AI 分析 | ❌ 商业机密，用企业版或本地工具 |\n| 让 AI 润色你自己写的简历 | ✅ 你自己的信息，你有处置权 |\n| 把正在谈判的合同全文发给 AI 做分析 | ❌ 商业机密，匿名化处理后再用 |\n| 问 AI 一个通用的法律知识问题 | ✅ 通用知识，不涉及具体案件 |\n| 把具体诉讼细节发给 AI 做分析 | ❌ 法律特权信息，风险极高 |\n\n---\n\n## 如果你所在的公司有 AI 使用政策\n\n遵守它。\n\n如果你不确定有没有——去问 IT 或合规部门。\n\n如果公司还没有——你至少应该按照本章的原则来保护自己和公司。\n\n到了2026年，有正式 AI 使用规范的企业已经越来越多。这类政策通常包含：哪些工具是批准使用的、哪类数据只能用企业版渠道、哪些信息禁止输入任何外部 AI。\n\n---\n\n## 最后说一句\n\n说了这么多\"不要\"，可能让你觉得 AI 用起来太麻烦了。\n\n不是这个意思。\n\n就像网络银行一样：你不会因为存在网络诈骗就永远不用手机银行——你学会了识别钓鱼链接、不把验证码告诉别人、开启双重验证。\n\n对 AI 的安全使用，也是同样的逻辑：**不是不用，而是知道哪些边界不能越。**\n\n---\n\n## 📌 本章要点卡\n\n1. 消费级 AI 和企业级 AI 数据处理方式完全不同——**先确认你用的是哪种**\n2. 绝对不能输入公共 AI 的：**密码、客户个人信息、商业机密、法律保密信息、医疗数据**\n3. 安全使用的核心技巧：**匿名化处理**——保留结构，替换敏感细节\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 打开你最常用的 AI 工具，找到**隐私设置**，确认\"用于训练模型\"的选项是否符合你的意愿\n- [ ] 回想一下最近一周你贴进 AI 的内容，有没有**不该贴的**？\n- [ ] 如果你管团队，考虑制定一条简单的规则：**哪类信息只能用公司批准的 AI 渠道处理**\n\n---\n\n*下一章：如何与 AI 协作——不叫 prompt engineering，叫 AI 沟通*\n","wordCount":2636},{"id":"ai-literacy-part-1-5","bookId":"ai-literacy","fileName":"AI_Literacy_PartI_Ch5_v3.md","partKey":"part-1","partTitle":"Part I - 全民 AI 素养基础","chapterInPart":5,"globalChapter":5,"title":"第五章：如何与 AI 协作","markdown":"# 第五章：如何与 AI 协作\n\n> 读完这章，你会知道为什么同样一个问题，有人问出来的答案很有用，有人问出来的答案一塌糊涂。\n\n---\n\n## 先换一个词\n\n你可能听过\"提示词工程\"（Prompt Engineering）这个词。\n\n听起来很技术，好像需要专门学一套语法规则，只有程序员才能掌握。\n\n我们这本书里不用这个词。\n\n我们用一个更准确的词：**AI 沟通（AI Communication）**。\n\n因为和 AI 有效交流，本质上不是工程问题，而是沟通问题。它和你跟一个新同事、新助理沟通，遵循同一套逻辑：**说清楚你是谁、你要什么、你期待什么样的结果。**\n\n唯一的区别是：这个\"助理\"不会主动问你\"你的意思是……吗\"——所以你需要在一开始就把这些说清楚。\n\n---\n\n## 为什么同样的问题，答案差这么多？\n\n来看一个真实的对比。\n\n**同样的目标：** 写一封向客户解释项目延期的邮件。\n\n❌ 问法一：\n> \"帮我写一封项目延期的邮件。\"\n\n得到的结果：一封通用的、可以套用在任何行业任何情况的模板邮件。\n\n✅ 问法二：\n> \"我是一家咨询公司的项目经理，需要给客户写一封邮件，说明交付时间从3月15日推迟到3月28日，原因是数据接口对接比预期复杂。这个客户是制造业企业的采购总监，我们合作关系不错，但他们对时间节点非常敏感。邮件需要专业、诚恳，不要过度道歉，要给出具体的补救措施。\"\n\n得到的结果：一封你可以直接发出去的邮件。\n\n差距不是因为 AI 变聪明了，而是因为你给的信息质量完全不同。\n\n---\n\n## 五个让 AI 真正有用的原则\n\n### 原则一：给够背景\n\nAI 只知道你告诉它的事情。它不知道你在哪个行业、受众是谁、文件是内部用还是对外发、公司风格是保守还是开放。\n\n如果你不说，它只能猜——猜的是\"大多数情况下最常见的假设\"，不一定符合你的实际情况。\n\n**一个简单的检查清单：**\n- 我是谁？（角色、背景）\n- 受众是谁？（他们懂什么、不懂什么）\n- 目的是什么？（这个输出会被怎么用）\n- 有什么限制？（长度、语气、不能提什么）\n\n---\n\n### 原则二：说清楚你要什么格式\n\n\"给我一个分析\"可以是：一段叙述、一个列表、一张表格、一个PPT大纲、一份带小标题的报告……\n\n不说的话，AI 会自己选一个它觉得合适的。\n\n**常用的格式指令：**\n- \"用三个要点总结，每个要点不超过两句话\"\n- \"用表格对比优点和缺点\"\n- \"结论先行，再展开分析\"\n- \"像给高管做简报一样，简短直接\"\n\n格式说清楚，拿到的结果往往可以直接用。\n\n---\n\n### 原则三：把大任务拆成小步骤\n\n把复杂任务一次性扔给 AI，结果往往是面面俱到但哪里都不够深。\n\n更好的方式：拆成小步骤，一步一步来。\n\n**例子：** 写一份市场分析报告。\n\n❌ 一次全要：\n> \"帮我写一份完整的东南亚市场分析报告，包括市场规模、竞争格局、进入策略、风险评估和执行计划。\"\n\n✅ 分步骤：\n> 第一步：\"分析新市场我需要考虑哪些维度？给我一个框架。\"\n> 第二步：\"基于这个框架，帮我起草市场规模和竞争格局这两部分的大纲。\"\n> 第三步：\"根据这些信息，给我几个进入策略的选项和各自的优劣势。\"\n\n每一步你都可以检查方向，每一步的质量也往往比一次全要好。\n\n---\n\n### 原则四：让 AI 说明它的推理过程\n\n你不只是要答案，你还可以要推理过程。\n\n**几种有用的问法：**\n- \"给出建议之前，先告诉我你考虑了哪些因素\"\n- \"这个结论是基于什么假设？\"\n- \"你对这个判断有多大把握？哪些地方你不确定？\"\n\n要求展示推理过程，你可以检查它的逻辑是否合理，也能帮 AI 自己想得更深。\n\n---\n\n### 原则五：主动要求它说实话\n\n在第三章，我们讲过 AI 有\"爱说你想听的话\"的倾向。\n\n你可以主动对抗这个倾向：\n\n- \"如果你对某个信息不确定，请直接说出来\"\n- \"请不要只告诉我好消息，把这个方案真正的问题也说出来\"\n- \"扮演一个挑剔的批评者，找出这个计划最大的漏洞\"\n\n给它一个\"可以说不好\"的明确授权，答案会诚实得多。\n\n---\n\n## 一个完整的沟通模板\n\n```\n【背景】我是……，现在需要……\n【受众】这份输出是给……看的，他们的背景是……\n【任务】具体请你帮我……\n【格式】请用……的格式，长度大约……\n【约束】需要注意……，不要……\n【诚实要求】如果你不确定某些内容，请直接说出来\n```\n\n不需要每次都严格按这个格式写，但这六个维度是让 AI 给你真正有用输出的关键变量。\n\n---\n\n## 2026年的新现实：这是一个来回的对话\n\n第一个输出不满意，继续对话：\n\n- \"这个方向对，但第二段太长了，压缩成3句话\"\n- \"换个角度，站在客户立场，这个方案看起来怎么样？\"\n- \"你刚才说的第三点，我有不同意见，你觉得我的理由站得住吗？\"\n\n把 AI 当成可以来回推敲的思维伙伴，而不是用一次就结束的工具——这个转变，会让你的使用效率产生质的提升。\n\n---\n\n## 📌 本章要点卡\n\n1. 和 AI 协作是**沟通**，不是技术——叫\"AI 沟通\"，不叫\"提示词工程\"\n2. 五个核心原则：**给够背景、说清格式、分步骤、要求展示推理、主动要求说实话**\n3. 第一个输出不满意是正常的——**继续对话**，这才是正确的工作方式\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 找一件你最近让 AI 做但结果\"不太对\"的事，**按沟通模板重新问一遍**，看看结果有没有不同\n- [ ] 下次让 AI 给建议时，加一句：\"**请先告诉我你考虑了哪些因素**\"\n- [ ] 下次对输出不满意，**不要重新开始**，直接在对话里继续修改——试试来回推敲三轮\n\n---\n\n*下一章：如何验证 AI 的输出——拿到答案之后，怎么判断能不能用*\n","wordCount":2080},{"id":"ai-literacy-part-1-6","bookId":"ai-literacy","fileName":"AI_Literacy_PartI_Ch6_v2.md","partKey":"part-1","partTitle":"Part I - 全民 AI 素养基础","chapterInPart":6,"globalChapter":6,"title":"第六章：如何验证 AI 的输出","markdown":"# 第六章：如何验证 AI 的输出\n\n> 读完这章，你会有一套实用的核实习惯——不是对 AI 不信任，而是对自己负责。\n\n---\n\n## 一个很实际的问题\n\n你让 AI 帮你整理了一份数据，写了一段分析，引用了几个研究结论。\n\n现在摆在你面前的问题是：**这些内容，我能直接用吗？**\n\n在第三章，我们说过：AI 说错话的方式，和它说对话的方式一模一样。你没有办法靠\"感觉\"来判断它的输出是否可信。\n\n所以你需要一套方法。\n\n这一章，讲的就是这套方法。\n\n---\n\n## 先说一件重要的事\n\n有人觉得：需要核实 AI 的输出，说明 AI 不够好，等 AI 进化了就不用核实了。\n\n这个逻辑是错的。\n\n核实，不是因为工具不够好。核实，是因为**你对输出结果负责**。\n\n一个负责任的财务总监，不会因为报表是系统自动生成的，就不做交叉核对——因为报表上有他的名字。\n\n一个好的编辑，不会因为文章是记者写的，就不校对——因为发出去的是他负责的版面。\n\nAI 进入工作流，不改变这个逻辑。**谁签字，谁负责，谁就需要核实。**\n\n---\n\n## 验证的四个维度\n\n### 维度一：事实核查\n\n这是最基本的——确认 AI 给你的具体事实是否准确。\n\n**需要重点核查的内容：**\n- 具体数字（市场规模、增长率、统计数据）\n- 时间节点（某件事发生在哪一年、某政策什么时候生效）\n- 人名和职位（某人是否真的担任某职位）\n- 法规和政策的具体条款\n\n**核查的方法：**\n\n第一步，把输出里所有\"具体的、可以被验证的陈述\"标记出来。\n\n第二步，去独立来源核实——官方网站、政府公告、权威媒体。**不是再问一次 AI**，而是去找原始来源。\n\n第三步，注意时效——即使事实本身没错，它是否已经过时？政策有没有更新？数据有没有新版本？\n\n**一个反直觉的提醒：** 用另一个 AI 来核实 AI 的输出，不算独立核实。两个 AI 可能犯同样的错误，甚至来自同样的训练数据。\n\n---\n\n### 维度二：数字验证\n\n涉及数字的输出，值得独立验算。\n\n即使你用的 AI 配有代码解释器，在高风险场景下——比如财务报告、对外提案——关键数字还是要用自己的工具跑一遍。\n\n**几类需要重点验证的场景：**\n- 百分比和增长率：基数是什么？是同比还是环比？\n- 财务计算：时间段、利率、频率的细微差异，结果可能差很多\n- 汇总数字：把明细加总，看看和 AI 给的合计是否吻合\n\n**工具：** Excel、计算器、Python——选你熟悉的，把关键数字自己跑一遍。\n\n---\n\n### 维度三：来源追溯\n\n当 AI 说\"某研究表明\"、\"数据显示\"、\"根据某报告\"时，你需要找到原始来源。\n\n**操作步骤：**\n1. 要求 AI 提供具体来源：\"你引用的这个数据，原始出处是哪里？\"\n2. 根据它给的线索，去搜索原始文献\n3. 亲自查阅原文：数据是否真实存在？引用是否准确？有没有断章取义？\n\n**一个现实的提醒：** 如果你搜索之后找不到这篇文献，不要假设是你搜索方法的问题。如第三章所说，AI 有时候会捏造看起来完全真实的引用。找不到，很可能那个来源根本不存在。\n\n---\n\n### 维度四：逻辑一致性\n\n这是最容易被忽略、但在复杂输出里最重要的一个维度。\n\nAI 非常擅长维持表面的逻辑流畅，但在长文档里，它可能在第三段得出一个结论，在第七段又悄悄给出一个与之矛盾的结论——用流畅的语言把矛盾掩盖掉。\n\n**几个实用的检查方法：**\n\n**检查内部矛盾：** 前面的结论和后面的结论是否互相支撑？有没有在某处悄悄改变了前提假设？\n\n**检查因果链：** \"因为A，所以B，所以C\"——每一步的推导是否成立？有没有跳步骤，或者用\"关联\"代替\"因果\"？\n\n**换个角度重问：** 把同样的问题反过来问一遍——\"请从反对的角度分析这个方案\"。如果两次结果高度矛盾，说明 AI 的分析可能都不够稳固。\n\n---\n\n## 一个容易被忽视的技巧：直接追问 AI\n\n当你对某个输出有疑问时，直接问它：\n\n- \"你对刚才这个回答有多大把握？\"\n- \"这个信息有没有可能已经过时？\"\n- \"哪些部分你比较确定，哪些部分建议我自己去核实？\"\n\n2026年的主流模型，在被直接追问时，往往会更诚实地表达不确定性——\"实际上我对这个数字不是很确定，建议你查一下官方来源\"。\n\n这不能替代独立核实，但可以帮你快速找到最值得花时间验证的地方。\n\n---\n\n## 根据风险等级来决定核实力度\n\n核实是必要的，但核实每一个字也不现实。\n\n用风险等级来决定你该花多少时间：\n\n**🟢 低风险**（内部草稿、头脑风暴）\n→ 通读一遍，感觉方向对就推进\n\n**🟡 中风险**（对外沟通、含数据的报告）\n→ 标出所有可核查事实 → 独立核实关键数字 → 检查整体逻辑\n\n**🔴 高风险**（法律文件、财务报告、重大决策依据）\n→ 全面核实所有事实 → 独立验算所有数字 → 追溯所有引用来源 → 领域专家做最终审核\n\n---\n\n## 📌 本章要点卡\n\n1. 验证 AI 输出的四个维度：**事实核查、数字验证、来源追溯、逻辑一致性**\n2. 独立核实的意思是去原始来源——**不是再问一次 AI**\n3. 根据风险等级分配核实力度，不是每条都要查，但高风险场景必须认真对待\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 找一份 AI 最近给你的输出，挑出**三条具体的陈述**，去独立核实一下——感受一下准确率\n- [ ] 下次 AI 给你引用了\"某研究表明\"，试试问它：\"**这个来源具体是哪里？**\"\n- [ ] 对照风险等级，给你工作里用 AI 的场景**各自归个类**，想想你目前的核实习惯够不够\n\n---\n\n*下一章：AI 对工作与社会的影响——这不只是一场技术变革*\n","wordCount":2157},{"id":"ai-literacy-part-1-7","bookId":"ai-literacy","fileName":"AI_Literacy_PartI_Ch7_v2.md","partKey":"part-1","partTitle":"Part I - 全民 AI 素养基础","chapterInPart":7,"globalChapter":7,"title":"第七章：AI 对工作与社会的影响","markdown":"# 第七章：AI 对工作与社会的影响\n\n> 读完这章，你会有一个清醒的视角——AI 正在改变什么，不会改变什么，以及你该怎么在这个时代找到自己的位置。\n\n---\n\n## 两种声音，都不完全对\n\n关于 AI 对工作的影响，你能听到的声音往往走两个极端。\n\n一个极端是：\"AI 会取代所有人，大量工作即将消失，我们都会失业。\"\n\n另一个极端是：\"AI 只是工具，和计算机、互联网一样，历史上每次技术革命都制造了更多工作，这次也不例外，不用担心。\"\n\n两种声音都有道理，也都不完整。\n\n真实的情况，比任何一个整齐的叙事都要复杂。\n\n这一章不做预测——没有人能准确预测未来。我们只是帮你建立一个框架，让你能对正在发生的变化做出自己的判断。\n\n---\n\n## AI 带来的不是普通的\"自动化\"\n\n过去几十年，我们对\"技术取代工作\"的理解，主要来自工业自动化：机器人替代流水线工人，ATM 减少银行柜员，ERP 系统简化财务录入。\n\n这类自动化有一个共同特征：**替代的是重复性强、规则清晰、可以精确描述的任务。**\n\nAI 带来的变化，和这个逻辑不完全一样。\n\n2026年的 AI，开始能处理一些过去被认为\"只有人能做\"的任务：写作、分析、设计、编程、法律文书、医疗诊断辅助……这些不是简单的重复动作，而是需要语言、判断、创意的认知类工作。\n\n这意味着：**这一轮变革，首先冲击的不是蓝领工人，而是知识工作者。**\n\n这是一个值得认真对待的历史性转折。\n\n---\n\n## AI 替代的是任务，不是工作\n\n一个帮你想清楚这件事的框架：\n\n几乎所有的工作，都是由一系列任务组成的。AI 可能替代其中的一部分任务，同时让另一部分任务变得更重要。\n\n**以财务分析师为例：**\n\n| 任务 | AI 的影响 |\n|------|-----------|\n| 数据收集与整理 | 大幅自动化 |\n| 生成标准化报表 | 大幅自动化 |\n| 初步解读数据 | 部分辅助 |\n| 识别异常和风险信号 | 部分辅助，人工判断仍关键 |\n| 向管理层解释业务含义 | AI 难以替代 |\n| 在不确定情况下做判断 | AI 难以替代 |\n| 与业务部门建立信任关系 | AI 难以替代 |\n\n结论不是\"财务分析师会消失\"，而是\"财务分析师的工作内容会改变\"——低价值重复任务减少，高价值判断和沟通任务增加。\n\n这个模式，在几乎所有知识工作领域都在发生。\n\n---\n\n## 在 AI 时代反而更值钱的能力\n\n有一类能力，在 AI 普及的背景下不但没有贬值，反而变得更稀缺。\n\n### 判断力与决策\n\nAI 可以生成选项、分析数据、呈现风险——但在真正的不确定性下做决策，尤其是涉及价值取舍、伦理权衡、长期与短期利益的决策，仍然需要人。\n\n原因不只是技术，还有责任归属。AI 不能为决策承担后果，所以它不能真正\"做决策\"，只能辅助决策。\n\n### 关系与信任\n\n客户信任、团队凝聚、跨部门协作、危机时刻稳定人心——这些根植于真实的人际关系，是 AI 无法模拟的。\n\n在一个很多输出都可以被自动化的时代，\"这个人值得信任\"反而成了更稀缺的资产。\n\n### 情境理解与常识\n\nAI 理解文字，但对复杂社会情境、组织政治、文化背景的理解，有根本性的局限。\n\n\"这封邮件在我们公司的语境里是什么意思\"、\"这个客户现在的真实状态是什么\"、\"这个决定在团队里会引发什么反应\"——这些判断，需要你真实地在这个环境里存在过。\n\n### 监督与编排\n\n随着 AI 工具普及，一个新的关键能力正在浮现：**知道用什么 AI 工具、在什么时候用、用完之后怎么验证和整合。**\n\n这不是简单地\"会用 AI\"，而是在 AI 工具之上的系统性判断力。能做好这件事的人，在组织里的价值正在快速上升。\n\n---\n\n## 对你自己最实用的四条建议\n\n**第一条：不要问\"AI 会不会取代我\"，而是问\"我工作里哪些任务 AI 做得更好，哪些我做得更好\"。**\n\n把前者交给 AI，把精力集中在后者。这不是退缩，而是更聪明地分配你的时间。\n\n**第二条：有效使用 AI 本身，是一种正在升值的职业能力。**\n\n不是说你需要懂技术。而是说，能有效和 AI 协作、能判断 AI 输出质量、能用 AI 提升自己工作产出的人，职场竞争力正在显著提升。\n\n**第三条：保持对这个领域的关注。**\n\nAI 本身在快速演进，它能做的事每隔几个月就有明显变化。不需要成为专家，但需要保持好奇心和更新意识。\n\n**第四条：人类技能的价值，在 AI 时代反而上升了。**\n\n判断力、沟通力、信任建立、情境理解——这些能力的稀缺性，在 AI 处理越来越多基础任务之后，只会更高，不会更低。不要因为 AI 的出现而放弃对这些能力的投资。\n\n---\n\n## 一个开放的结尾\n\n关于 AI 对社会的更大影响——就业、教育、贫富分化、监管——这些问题没有简单的答案。\n\n有一件事值得记住：\n\n技术本身是中性的。AI 可以帮助资源匮乏地区的人获得更好的服务，也可能加剧信息不平等；它可以让小团队做出以前只有大机构才能做的事，也可能让资源进一步集中。\n\n方向不是被技术决定的，而是被选择决定的。\n\n这一点，值得每个在 AI 时代工作的人记住。\n\n---\n\n## 写在 Part I 结尾\n\n到这里，你已经完成了 Part I 的全部七章。\n\n你现在应该清楚：AI 是什么、能做什么、不能做什么、如何安全使用、如何有效沟通、如何验证输出，以及它正在如何改变我们的工作。\n\n这是 AI 素养的基础。\n\n但理解 AI，和在一个组织里系统地用好 AI，是两件不同的事。\n\n**接下来的 Part II，我们进入组织的层面。**\n\n你和你的组织，现在在 AI 使用上处于什么位置？从这个位置出发，下一步该做什么？Part II 从这里开始。\n\n---\n\n## 📌 本章要点卡\n\n1. AI 替代的是**任务**，不是工作——每个职业里，重复任务减少，判断任务增加\n2. 在 AI 时代反而升值的能力：**判断力、关系与信任、情境理解、监督与编排**\n3. 技术的影响方向，**由选择决定**，不由技术本身决定\n\n---\n\n## ✅ 读完这章，你可以做的事\n\n- [ ] 列出你工作里**五件最常做的事**，给每件事打个标签：AI 可以替代、AI 可以辅助、AI 很难替代——看看比例是什么\n- [ ] 想想你目前**最稀缺的人类技能**是什么，你在有意识地培养它吗？\n- [ ] 如果你管团队，和团队聊聊：**我们现在在 AI 使用上处于什么阶段？**——这个对话本身，就是开始的第一步\n\n---\n\n*Part II：AI 原生组织协作——当 AI 进入组织，工作方式如何系统性升级*\n","wordCount":2480}],"chapterCount":7,"wordCount":17101},{"id":"founders-playbook","title":"创始人手册：构建 AI 原生创业公司","description":"译自 Anthropic 的 The Founder's Playbook，关于 AI 原生创业生命周期、创始人角色和 Claude 工具链。","chapters":[{"id":"founders-playbook-part-1-1","bookId":"founders-playbook","fileName":"Founders_Playbook_Ch1.zh.md","partKey":"part-1","partTitle":"正文","chapterInPart":1,"globalChapter":1,"title":"第 1 章：面向 2026 年重启的创业生命周期","markdown":"# 第 1 章：面向 2026 年重启的创业生命周期\n\nAI 正在重塑创业公司被搭建起来的方式。今天，从未写过一行代码的创始人也能发布生产级应用；而精简到 10 人的独角兽，已经不再只是一个草根逆袭故事，而是一套可以被主动设计的行动方案。\n\n到 2026 年，AI 已经能够编写生产级代码、开展市场研究、综合竞争格局、起草投资人材料，并自动化运营工作流。过去，即使是经验丰富的技术型创始人，也要跨过陡峭的学习曲线，才能把工具、平台和系统整合起来，让一个想法真正落地。AI 首先消除了这道门槛，让「谁可以创办公司、谁可以做出产品」这件事变得更加平等。\n\n在 2026 年，一个好想法能把创始人带得比以往更远。智能体式编程把过去需要一支工程团队完成的工作，压缩成创始人自己就能交付的成果。\n\n传统的创业增长路径默认了一条弧线：验证 -> 融资 -> 招人 -> 构建 -> 再融资 -> 增长 -> 再招人 -> 循环往复。如今，AI 已经打破了一个旧预期：创业生命周期中的每一个新阶段，都必须对应更大的团队、不同的技能组合，以及新一轮融资。\n\n这本手册会按照这些新现实，重新绘制创业旅程的四个核心阶段：想法、MVP、发布和规模化。我们会考察，当 AI 成为技术建设和组织建设的核心时，每个阶段会呈现什么样子；每个阶段适合使用哪些工具；以及创始人如何借助这些工具压缩时间线。如果你已经准备好寻找从想法到退出之间最短的路径，请继续读下去。\r\n\r\n","wordCount":575},{"id":"founders-playbook-part-1-2","bookId":"founders-playbook","fileName":"Founders_Playbook_Ch2.zh.md","partKey":"part-1","partTitle":"正文","chapterInPart":2,"globalChapter":2,"title":"第 2 章：创始人的含义正在改变","markdown":"# 第 2 章：创始人的含义正在改变\n\n过去，创始人常常由「他们能做什么」来定义：技术型创始人写代码，非技术型创始人负责业务运营和成交。但到 2026 年，创始人可以使用的模型、系统和 AI 智能体，已经拆掉了「能构建的人」和「拥有值得构建的想法的人」之间那堵墙。\n\nAI 原生创业公司正在从根本上改变「成为创始人」意味着什么。如今，一个没有工程背景的人，也可以构建生产级软件，把自己的想法变成现实；而一个技术能力很强、却缺少商业知识的创始人，也能轻松产出一套上市策略、财务模型，以及高度打磨过的融资演示文稿。\n\n从历史上看，创始人大部分时间都花在执行模式里：写代码、管人、处理日常运营工作。在 AI 原生创业公司里，创始人的角色会少一些个人贡献者属性，多很多「智能体编排者」属性。这些智能体是专门化的 AI 助手，可以读取文件、运行命令、执行代码，甚至浏览网页。创始人的注意力会向上移动，转向更高阶的工作：产生想法，并指挥那些负责把想法落实的系统，包括 AI 智能体、工具，以及可能存在的小团队。\n\n不过，把 AI 作为核心基础设施所带来的最革命性结果，是它释放了拥有领域专业知识的非技术型创始人。当创始人群体不再局限于工程背景的人，你就会看到由完全不同生活经验的人建立的创业公司。他们解决的是真实问题，而这些问题过去可能从未被传统技术创始人路径优先考虑，甚至根本没有被看见。\n\n## 精简创业公司的 AI 工具能力\n\n传统创业模式默认你需要雇工程师来构建产品，雇销售人员来卖产品，再雇运营人员来维持公司运转。团队人数被视为组织动能和产品成熟度的象征。\n\n2026 年的早期创业公司已经大不一样。它们在设计上就极其精简，常常只有创始人一个人，或者再加上寥寥几位伙伴。通过把 AI 作为技术建设和组织建设的基础设施，这些公司可以在扩大团队之前，就完成产品验证、获得早期收入，甚至实现盈利。AI 尤其在三个方面，让一家创业公司能够像规模大得多的组织一样运转：研究、智能体式编程，以及关键业务运营的工作流自动化。\n\n## 对话式智能与研究\n\n### 可以理解为：每个领域的随叫随到专家\n\n想想创始人在第一年需要知道多少事情，而这些事情他们在出发时几乎肯定并不了解：我该如何设置薪资发放？我该如何规划产品开发冲刺？我该如何写出一份紧凑有力的投资人备忘录？\n\n过去，这类早期创业问题通常只有同一个答案：去找懂的人。对于自力更生或尚处于种子轮前的创始人来说，这可能意味着把本该用于构建的时间耗在搜集知识上，或者不得不烧掉一部分早期资金去请顾问。现在，他们拥有了 AI：一个横跨几乎所有可想象领域的随叫随到专家。\n\n- 深度研究：竞争分析、市场规模测算、财务建模\n- 文档起草：融资演示文稿、案例研究、投资人备忘录、PRD\n- 战略思考伙伴：反方论证、预演式复盘、情景规划、路线图优化\n\n## 智能体式编程\n\n### 可以理解为：永远在线、不会被卡住的工程师\n\n过去，构建软件通常意味着你需要一位技术联合创始人、一家外包开发公司，或者足够长的资金跑道，让你能在写出第一行生产代码之前先招起一支工程团队。\n\n现在，智能体式编程工具让每一位有创业想法的人，都可以用自然语言描述自己想构建什么，并指挥 AI 生成、测试、调试和重构一个生产级代码库，其速度和规模接近一整支工程团队。从「我有一个想法」到「我有一个产品」之间的时间线已经被压缩。创始人的角色也因此更集中在「构建什么」以及「为什么构建」上，而 AI 负责搭建真实可用、面向真实用户的基础设施。\n\n## 工作流自动化\n\n### 可以理解为：按需调用的自动化运营团队\n\n即使创始人已经能像顾问一样研究、像工程团队一样构建，仍然有一整类工作既不属于战略规划，也不属于产品开发，却必须有人完成。日程安排、更新 CRM、拉取周报、保持文档最新、发布内容、跟踪合规要求、管理公司运行所依赖的各种工具和系统之间的连接组织，这些也都必须发生。在一家精简创业公司里，这些负担主要会落到创始人身上，而它会显著消耗本应投入高阶决策的时间和注意力。\n\nAI 工具驱动的工作流自动化，可以卸下这部分负担。重复性的运营任务可以被配置为自动发生：当交易阶段推进时，CRM 自动更新；周报自动汇总；产品文档随着产品变更同步更新。更关键的是，Claude Cowork 可以接入创业公司运行所依赖的互联系统，包括你的项目管理工具、沟通工具栈和数据来源，而不需要有人专门构建并维护这些集成。在「Day Zero」创业公司里，这个「有人」几乎总是创始人自己。\n\n## 时机与编排决定一切\n\n能够有效驾驭 AI 研究、自动化和智能体式编程能力的创始人，可以建立一家杠杆远高于团队人数所暗示规模的创业公司。他们也能把大部分时间和带宽投入真正重要的工作。\n\n但这些工作不会自动驾驶。负责编排这些 AI 工具的创始人，必须知道如何使用它们，以及何时使用它们。本手册接下来的部分，将继续探讨创始人在沿着 AI 原生创业路径前进时会遇到的目标和挑战，以及如何在旅程的每个阶段有效应用 AI 工具。\r\n\r\n","wordCount":1994},{"id":"founders-playbook-part-1-3","bookId":"founders-playbook","fileName":"Founders_Playbook_Ch3.zh.md","partKey":"part-1","partTitle":"正文","chapterInPart":3,"globalChapter":3,"title":"第 3 章：想法阶段","markdown":"# 第 3 章：想法阶段\n\n每一位创业者的起点都一样：有一个问题让他们怎么也放不下。想法阶段，就是想法第一次碰到现实的地方。到了 2026 年，创业成功需要一种克制：在证据足以支撑之前，不要急着动手构建。\n\n这一阶段的工作包括研究、客户发现、竞品分析，以及诚实地评估那些可能推翻你想法的证据。所有这些，都应该发生在你让 Claude Code 生成第一行生产代码之前。\n\n## 想法阶段的目标\n\n在想法阶段，创始人的主要目标是以研究为导向的验证：在投入资源开始构建之前，先拿到扎实证据，证明一个真实问题确实存在，并且你提出的解决方案能够有效解决它。\n\n更实际地说，想法阶段是一组创始人必须大致按顺序回答的问题：\n\n- 这个问题真实吗？是否足够具体、足够频繁，值得围绕它建立产品？\n- 到底是谁遇到了这个问题？这些人能否构成一个市场？\n- 是否已经有人在解决它？如果有，他们怎么解决，解决得如何？\n- 一个真正能解决这个问题的方案到底需要做什么？我的想法是否做到了？\n\n这些问题的答案最终会汇总成一个终极问题：这件事值得做吗？\n\n这意味着，在开始行动之前，你需要先变得具体。“人们在报销上很痛苦”只是一个观察。“中型企业的财务经理每周要花 4 小时以上核对报销提交，因为他们现有的工具无法和会计软件集成”，才是一个可以被检验的假设。\n\n## 想法阶段的退出标准\n\n想法阶段的退出条件，是找到问题-解决方案匹配。也就是说，在开始构建真正解决问题的东西之前，你已经主要通过真实的人类对话获得了定性证据，证明你是在为真实的人解决真实的问题。\n\n当你可以对下面三个问题都回答“是”时，就可以离开想法阶段：\n\n1. **这个问题真实吗？是否足够具体？** 肯定回答这个问题，意味着你能够准确说出谁在经历这个问题，他们多频繁遇到，它对他们造成多严重的影响，以及他们现在如何处理。\n2. **你的解决方案是否解决了真正的问题？** 不是你一开始假设的那个问题，而是验证过程揭示出来的问题。有时候二者相同，但并不总是如此。\n3. **你是否有足够信号，值得开始构建？** 在这个阶段你永远不会拥有确定性，等待确定性本身就是一种失败模式。但你需要足够的定性证据，能说明投入 MVP 是一个经过推理的决定，而不是一次信仰跳跃。\n\n## 想法阶段的挑战\n\n想法阶段是整个创业旅程中最重要的工作发生之处，因为最具后果性的错误也往往在这里出现：此时犯错，很快就可能让一个刚萌芽的项目偏离轨道。\n\n不过，想法阶段的大多数挑战，本质上都来自行动速度超过了理解深度。因此，那些能带着思考和审慎向前推进的创始人，通常会稳步取得进展。\n\n### 把构建误认为验证\n\n**挑战：** 当技术障碍被移除时，一个充满热情的创始人很容易跳过创业旅程中最重要的工作：验证自己的想法是否真的是人们需要并愿意使用的解决方案。\n\n即使在当前的智能体式编程时代到来之前，也有 42% 的创业公司因为做出了没人想要的东西而失败。现在，Claude Code 这类智能体式编程方案极大压缩了“我有一个想法”和“我有一个产品”之间的距离，这个失败率只会继续上升。\n\n对于拥有一个足以震动神经元的好点子的创始人来说，从来没有比现在更好的时代。但反过来，快速、轻松地搭出一个看起来像产品的原型，也给 AI 原生创业公司带来了真正危险的生存风险。\n\n直到不久前，构建仍然需要真实的开发时间和预算。哪怕只是做出一个基础原型，通常也需要几个月。如今，技术开发的门槛大体消失，AI 让创始人太容易绕过现实世界的效用验证，直接开始构建。\n\n要达到问题-解决方案匹配，正确顺序是先验证假设，再开始构建。但很多第一次创业，甚至有经验的创始人，会误以为 AI 可以绕过这一要求，把流程变成：有一个想法 -> 立刻做出原型 -> 把原型的存在本身当成验证。原型成了相信最初假设正确的理由，而假设本身从未被真正检验。\n\n一个可运行的原型，很容易被误认为是你正在解决真实问题的具体证据。但它并不是。你的原型更像是一个有用的压力测试道具，用来和潜在用户展开对话。真正的证据，是这些对话本身。\n\n### 过早扩张\n\n**挑战：** 当构建变得轻松且即时，你可能会把执行规模扩张到远远超过业务需求的程度。\n\n过早扩张，意味着在真正验证某条产品路径值得投入之前，就已经对它做出承诺。\n\n这一直是创业公司的杀手。但 AI 让创始人更容易在毫无察觉的情况下掉进过早扩张的陷阱。智能体式编程助手非常强大，以至于你很容易在尚未验证问题-解决方案匹配之前，就把执行推进得过远，而且过程中甚至没有意识到自己已经偏航。\n\n它会围绕一个根本有缺陷的前提生成、测试、调试和重构代码库，而且热情丝毫不亚于面对一个绝佳想法。系统中的智能来自你。这个阶段的首要指令，是让你的理解和判断始终跑在构建前面，尤其是在构建如此快速、感觉如此轻松的时候。\n\n### 失去客观性\n\n**挑战：** 如果你让 AI 工具为你已经相信的事情寻找证据，它会找到。确认偏误如今自带研究引擎。\n\n确认偏误一直是创业中的职业风险：创始人天然会对自己的想法充满热情。现在，AI 工具让确认偏误显著增强。让 AI 验证你的创业想法，它会找到支持证据；让它估算你的潜在市场，它会找到一个让你的 TAM 看起来足以融资的数字。\n\nAI 会跟随你的方向。这意味着，如果创始人没有提出艰难问题，就可以比以往任何时候都更快地为一个糟糕想法搭建出一套精致、看似研究充分的论证，同时还会自信地认为自己确实完成了尽职调查。解药仍然是同一个工具，只是要把它指向相反方向：AI 可以像验证一个想法那样彻底地压力测试它。\n\n当研究和结构化的对抗性思考暴露出你的想法需要修正的证据时，这就是转向的信号。\n\n## Claude 如何帮助想法阶段的创始人\n\n推动一个 AI 原生创业概念穿过想法阶段，可能会让人觉得漫长无比。你是创始人，你只是想赶紧构建。但这个至关重要的起步阶段，本质上是研究和验证练习。这意味着，在全力写代码之前，你应该先使用那些能帮助你更严谨思考的工具。\n\n下面是如何在 Claude 的不同产品形态中，包括 Chat、Claude Cowork 和 Claude Code，尽可能快速但又负责任地完成想法阶段的尽职调查。\n\n### Chat、Claude Cowork 还是 Claude Code：选择合适的 Claude 界面\n\nAI 让创业者更容易快速发布、自动化繁琐工作流，并以更大规模运转。但你使用的界面很重要。根据手头任务的不同，Chat、Claude Cowork 和 Claude Code 各有适用场景。\n\n**Chat** 适合在不离开当前应用的情况下进行快速交流。用它处理运营公司时不断出现的小任务：从厚重的投资人备忘录里提炼一句话结论，在董事会会议前快速校验一个说法，或者理清团队里一条很长的 Slack 讨论。\n\n**Claude Cowork** 适合真正需要时间的知识工作：从多个来源提取信息、理解它们，并产出完成度较高的文档、演示或电子表格。比如，把一整个文件夹的客户访谈记录整理成下一次产品评审用的主题发现文档；在融资前，从十几个供应商网站构建竞品格局；或者设置一个每周一早上的固定任务，从已连接的工具中拉取指标，并把每周 KPI 简报放进共享文件夹。\n\n**Claude Code** 是给团队工程师使用的智能体式编程环境：它可以直接访问代码库，支持 Plan Mode、git 集成，以及本地、IDE 或沙箱云环境。精干团队可以在这里围绕不断增长的代码库发布功能，迁移 MVP 时代留下的遗留代码，并在不等待新增人手的情况下，从原型走向生产。\n\n| 如果任务是…… | 选择 | 原因 |\n| --- | --- | --- |\n| 一个问题、一次改写、一次快速头脑风暴 | Chat | 快速、对话式、无需设置 |\n| 基于你的文件和系统做研究、分析或产出完成文档 | Claude Cowork | 文件夹访问、连接器、技能、计划任务 |\n| 编写、测试或发布软件 | Claude Code | 代码库访问、diff、git、开发环境 |\n\n三者底层使用的是同一个 Claude；变化的是它周围的工作空间。\n\n### 定义并压力测试问题假设\n\n你自己的领域经验和前期研究，已经形成了一个假设。第一项工作，是把它打磨到真正可以被检验。Claude 在这里尤其有用，因为它会逼迫你变得具体：到底是谁遇到这个问题？频率如何？严重程度如何？他们现在怎么处理？一个无法精确回答这些问题的问题陈述，还没有准备好接受验证。\n\n- **练习：** 和 Claude 一起打磨你的问题陈述，直到它成为一个可检验的假设。例如，“合同审查太慢”并不具备真正可检验性。但“中型企业的内部法务团队每个合同审查周期要花 3 天以上，因为红线修改分散在邮件线程中，而不是在单一的版本控制文档中管理”，就非常可检验。\n\n下一步，是让 Claude 反驳你的想法，并寻找能够推翻你假设的证据。这可能会暴露负面的市场信号、失败的竞争对手、客户行为模式，以及那些支持性综合分析会悄悄降权的结构性障碍。\n\n目标是在进入客户发现之前，就已经用当前最强的反方论据压力测试过自己的假设。这样一来，信息性用户访谈才会真正保持开放，而不是变成寻找确认的过程。\n\n> 注：把 Claude 当作结构化的“唱反调者”，是 AI 创业生命周期每个阶段的核心用法。\n\n### 市场研究与竞品格局绘制\n\n#### 评估竞争对手\n\n创业公司中有一种特定现象叫作“忽视竞争对手”：创始人过度聚焦于自己的愿景和执行，以至于系统性低估同一领域里其他人在做什么。幸运的是，AI 提供了解药：让 Claude 给出最有说服力的论证，说明为什么这个解决方案空间里的某个竞争对手会成功，而你不会。\n\nClaude 可以分析为什么他们的方法实际上更好，为什么客户会选择他们，以及为什么你认为的潜在差异化未必像你想象的那样牢固。\n\n- **练习：** 让 Claude 按层级绘制你的竞品格局：直接竞争对手、间接竞争对手、潜在收购方，以及可能进入你所在空间的相邻玩家。然后让它说明每一层为什么都对你的成功构成真正威胁，而不只是指出那些最容易被你驳倒的威胁版本。\n\n#### 市场研究\n\nClaude Code 可以综合公开可得的客户反馈，找出反复出现的抱怨和未被满足的需求。额外好处是：这基本上是在免费研究竞争对手的客户。\n\n- **练习：** 指示 Claude Cowork 综合你关键来源中的竞品评论，识别出现有解决方案尚未解决的主要抱怨。如果你的假设解决了其中一个或多个问题，那就是问题-解决方案匹配的强证据。如果没有，这同样值得知道。\n\nClaude Cowork 还可以从密集的行业报告、分析师文件和市场研究文档中提取相关信息和数字。随后，这些经过清理和综合的输入，会成为 Claude 分析工作的理想上下文。\n\n- **练习：** 基于公开数据建立 TAM/SAM/SOM 模型，并压力测试其背后的假设。识别市场是在扩张、整合，还是已经成熟；这种背景会影响你对时机和差异化的判断。绘制买方格局：谁掌握预算，谁影响决策，这两者是否是同一个人。\n\n#### 趋势分析\n\n最后，用 Claude 倾听早期指标，判断你是否是在合适的时点进入市场。跟踪那些已经在讨论你所关注问题的 subreddit 和 LinkedIn 群组，观察用户描述痛点时使用的准确语言。让 Claude 识别类似市场中曾经被解决的相似问题，并提取哪些做法有效、哪些无效。找出可能加速或威胁这个机会的监管、技术或人口结构趋势。\n\n- **练习：** 让 Claude 识别三个外部趋势，可能是监管、技术或人口结构层面的趋势，它们可能在未来两年显著影响你的市场。然后评估每个趋势对你的具体假设来说是顺风还是逆风。\n\n> 注：本节中的市场研究和竞品绘制不是一次性练习。你会在 MVP 和发布阶段继续获得新发现，并不断演化自己的思考。因此，只要你的假设发生变化，就应该重复这些练习。\n\n### 规划并设计客户发现\n\n你通过和潜在用户交谈所能学到多少，取决于两件事：（1）你提出的问题质量如何；（2）你是否把这些问题问给了正确的人。Claude 尤其适合帮助开展客户发现，包括该和谁聊、该问什么，以及如何理解你听到的内容。\n\n#### 应该和谁聊\n\n一个精确的目标画像，远比一长串联系人更有价值。它应该包括最有可能强烈感受到该问题的具体职位、公司类型、团队结构和资历层级。然后，再识别这些人实际在哪里可以被触达：他们聚集的社区、活动、LinkedIn 群组和 Slack 工作区。基于他们与问题的接近程度，建立优先联系框架，决定先联系谁。\n\n#### 应该问什么\n\n目标确定之后，使用 Claude 搭建访谈框架本身：正确的问题、正确的顺序，并且结构要能让人说出自己实际做了什么，而不是他们以为自己将来会怎么做。新手创始人的常见错误，是提出一个关于未来的泛泛开放问题，比如“你会使用这样的东西吗？”，而不是具体询问相关的过去经历：“请讲讲你上一次处理这个问题是什么情况。”\n\nClaude 也可以指出你草拟的问题中，哪些在引导受访者，哪些过于宽泛，哪些可能产生噪音而不是信号。Claude 还可以帮助你设计追问，用来处理回避，或者深入挖掘重要问题上含糊的回答。\n\n如果你的假设涉及不止一种角色，Claude 还可以为每种角色设计不同的问题集。财务经理和 CFO 面对同一个问题时关系并不相同，单一访谈框架会抹平这种差异。\n\n- **练习：** 先手写你的访谈问题，再让 Claude 审核。明确要求它标出任何带有引导性、面向未来、过于宽泛，或者更容易产生社会期望答案而非诚实回答的问题。然后让它为访谈中最可能出现回避的两三个时刻，建议后续追问。\n\n#### 访谈后分析\n\n每次对话结束后，用 Claude 做复盘：把你的笔记喂给它，让它识别哪些内容确认了你的假设，哪些内容挑战了假设，哪些内容真正出乎意料。等你积累了一批访谈后，把完整访谈笔记交给 Claude Cowork，让它找出反复出现的主题、矛盾之处，以及正反两个方向上最强的信号。然后，把综合输出再带回 Claude，让它指出你对数据的解读中，哪里可能是在用自己想听到的内容做模式匹配，而不是在看实际存在的东西。\n\n- **练习：** 每完成五次访谈，就指示 Claude Cowork 综合你的笔记，并产出两张清单：支持你假设的证据，以及挑战你假设的证据。如果第一张清单明显长于第二张，就问 Claude：这种不对称反映的是数据本身，还是你原本希望找到的东西？\n\n#### 客户触达与排期\n\n使用 Claude Cowork 自动化围绕建立联系人名单、开展触达和安排用户访谈的运营工作。\n\nClaude Cowork 可以使用你和 Claude 一起定义的目标画像，包括职位、公司类型和资历层级，来研究并整理结构化的潜在客户名单和已验证联系方式。随后，它可以批量撰写个性化触达邮件，并根据每个人的角色和背景进行定制。\n\n随着回复到来，它可以通过 MCP 连接 Gmail 和 Google Calendar 来管理邮件线程，处理排期请求，并把访谈加入日历。这个工作流还会继续：Claude Cowork 按照设定节奏生成跟进草稿，例如给 7 天未回复的联系人发送跟进，并在每一步完成时更新你的跟踪表，让你始终知道每个潜在客户在管道中的状态。\n\n- **练习：** 把经过验证的访谈目标画像交给 Claude Cowork，让它建立潜在客户名单，起草个性化触达序列，并设置一个跟踪表，其中包含触达状态、跟进节奏和访谈完成情况等列。然后让它负责协调工作，你则专注准备真正的对话。\n\n### 设计最终解决方案概念\n\n你已经完成了验证工作：问题是真实的，你知道谁遇到了它，并且有一个证据支持的解决方案概念。使用 Claude 从各个角度发展并挑战你的解决方案概念：缺口在哪里？有哪些替代方案？如果这个方案要在规模化时成立，哪些事情必须为真？\n\n这是一个重要的现实检查点：这个设计是否真的解决了验证过程揭示出来的问题，而不是你一开始假设的问题？\n\n- **练习：** 把你的解决方案概念展示给 Claude，让它识别你的设计最依赖的三个假设。然后问它：每个假设要成立，必须满足什么条件？如果其中任何一个不成立，会产生什么后果？\n\n### 用 Claude Code 构建轻量原型\n\n现在来到有趣的部分：有了经过验证的假设和经过压力测试的解决方案概念，你终于可以开始构建一些东西了。\n\n这是想法阶段中 Claude Code 登场的时刻。即使你之前一直在试做小东西，现在才是生成正式轻量原型的节点：只做出把你的想法放到真实人类面前、获得真实反应所需的最小表面积。\n\n你还不是在构建现实世界中的完整产品，至少现在还不是。你是在构造一个功能性样本，用于客户和投资人对话。真实用户对一个他们真的能触摸和试用的东西做出的反应，会告诉你许多十几次问题-解决方案发现访谈无法揭示的事情。此前，你是在确认自己要解决的问题真实存在；现在，你是在邀请潜在用户与拟议解决方案互动。\n\n- **练习：** 定义你的解决方案所依赖的单一核心交互。指示 Claude Code 只构建这一点。当你拿到它之后，把它放到五个来自已验证目标画像的人面前，请他们试用。你从这五次对话中学到的东西，将决定你是继续构建，还是回到画板前重新思考。\n\n到达想法阶段的终点，是 AI 创业竞赛中的巨大跃迁。因为此时你不再是在押注直觉，而是在基于证据执行。\n\n接下来进入 MVP 阶段。创始人的指导问题将从“这件事值得做吗？”转变为“我们最先到底应该构建什么？”，而 AI 的主要角色也会从研究伙伴转变为施工队。\r\n\r\n","wordCount":6899},{"id":"founders-playbook-part-1-4","bookId":"founders-playbook","fileName":"Founders_Playbook_Ch4.zh.md","partKey":"part-1","partTitle":"正文","chapterInPart":4,"globalChapter":4,"title":"第 4 章：MVP 阶段","markdown":"# 第 4 章：MVP 阶段\n\n很多创始人把 MVP 阶段视为一个建设阶段，但 MVP 阶段本质上仍然是一个收集证据的过程。不同之处在于，你现在收集的是关于解决方案的证据，而不是关于问题空间的证据。更具体地说，是一个真实、可识别的用户群体是否认为它有足够价值，愿意使用它、再次回来、为它付费，和/或把它告诉别人。\n\n## MVP 阶段的目标\n\n作为 AI 原生创业公司的创始人，你的目标是把一个经过验证的问题，转化为真实用户确实会使用的可运行产品。这不是包含所有路线图功能的完整版本，而是你想法中最小、最聚焦的一次迭代：它把一个真实解决方案放到真实用户面前，并生成关于产品-市场匹配的真实证据。\n\n与此同时，你现在的构建方式会决定之后什么是可能的。这意味着，MVP 阶段还有第二个同等重要的目标：快速前进，但不要积累那种会复利增长的技术债。否则，一旦真实用户以有意义的数量到来，它就会立刻回来缠住你。\n\n最后，从第一天起就投资于持久上下文，才能让 AI 成为力量倍增器，而不是熵的来源。在 AI 原生创业公司中，代码库是你一轮又一轮和 AI 协作的对象，因此可读性是基础。那些跳过规格说明、架构决策和上下文文件（例如 CLAUDE.md）的创始人，会撞上一堵可预期的墙：每个新会话都需要重新解释代码库，AI 生成的修改也会逐渐偏离最初愿景。\n\n## MVP 阶段的退出标准\n\nMVP 阶段的退出条件，是获得真正的产品-市场匹配证据：证明一个具体、可识别的用户群体已经认为产品足够有价值，愿意回来使用它（留存）、为它付费（收入），或把它推荐给别人（推荐）。\n\n## MVP 阶段的挑战\n\n在 MVP 阶段，创始人的首要指令是速度和判断力。这里的挑战集中在：你能否足够快地构建正确的东西，并以正确的方式构建，同时不走那些以后会让你付出代价的捷径。\n\n### 智能体技术债\n\n**挑战：** 因为 AI 实际上移除了过去控制哪些东西能进入生产环境的所有自然瓶颈，速度已经是必然。但如果创始人在 MVP 构建中只考虑速度这一个变量，就可能积累自己难以偿还的技术债。\n\n在 MVP 阶段，一定程度的技术债是合理的，前提是你理解它必须在规模化之前得到管理。普通技术债会逐渐累积，可以随着时间或在专门的冲刺中清理。但 AI 技术债会复利增长。\n\n如果没有把规格和架构约束写在 AI 能读到的地方，每个会话都会从零开始重新推导基础决策，而这些决策会发生漂移。最后你会得到一个背后没有连贯心智模型的代码库。问题不在于某一个部件一定很差，而在于这些部件从未被设计成能够相互配合。这是真正的问题，而且它确实往往很晚才浮出水面。\n\n### 误信虚假的产品-市场匹配\n\n**挑战：** AI 工具可以生成令人印象深刻的早期数字，但这些数字并不能保证市场需要你的产品。\n\n早期势头，是创始人能经历的最强心理体验之一。经过数周或数月的验证工作和谨慎、有纪律的构建之后，发布一个产品会让人感觉自己一直都是对的。\n\n智能体式编程工具可以帮助你比以往任何时候都更快到达这个时刻。但早期牵引并不等于产品-市场匹配。发布时的热度常常来自短暂力量，例如创始人的朋友、投资人其他被投公司的潜在买家，或者 Hacker News 上一个带来流量峰值的标题。遗憾的是，这些都无法可靠预测第 6 周或第 12 周会发生什么，尤其是在最初的助推消退之后。\n\n### 零摩擦范围蔓延\n\n**挑战：** 当构建感觉毫不费力且近乎免费时，总会还有一个很酷的功能可以加，或者还有一个边界情况可以处理。这种范围蔓延可能弊大于利。\n\n范围蔓延一直是创业风险。现在的区别在于，过去抑制它的传统约束，也就是真实的工程时间成本，在一个功能只需要一个下午而不是一个冲刺就能加上的情况下，已经不再以同样方式存在。\n\n这里的挑战是，每一个单独的新增项看起来都站得住脚。产品当然应该处理那个边界情况；用户当然会想要那条工作流。由于用智能体式编程构建每一项都只需要很少努力，它们在当下并不会显得像范围蔓延。但随着产品越过最初边界不断膨胀，你会冒着失去方向和动量的风险。\n\n解药是在开始构建之前写下一份范围定义，说明产品做什么，刻意不做什么，以及来自真实用户的哪些具体证据可以证明现在值得添加新东西。这样，决策点就从“我们要不要做这个？”转变为“是否已经有足够关键数量的用户告诉我们，如果没有这个，他们无法从产品中获得价值？”\n\n### 因经验不足而不安全\n\n**挑战：** 创始人如果在尚未理解基本安全原则之前，就用 AI 工具匆忙把应用推向市场，最终会让用户暴露在本可避免的风险中。\n\n一个艰难事实是：智能体式编程工具会生成能工作的代码，但不会天然生成安全的代码。功能性代码很容易判断，因为功能要么可用，要么不可用。安全漏洞在被利用之前是不可见的，这意味着没有自然反馈回路提醒第一次创业的创始人出了问题。然而，把一个真实 MVP 发给真实用户，意味着真实数据、真实暴露面，以及一旦出事就会有真实后果。\n\n忽视安全并不是 AI 原生项目才有的新问题。每个时代的自举型创业公司都经常把安全考虑推迟到构建后期，有时甚至等到生产发布前夕。任何用户接触你的应用或解决方案之前进行安全审查，是把一个最小可行产品发布到世界上的最低责任门槛。\n\n## Claude 如何帮助 MVP 阶段的创始人\n\n### 在构建前定义架构\n\n在 Claude Code 写下第一行生产代码之前，先用 Claude 定义并记录那些将支配本阶段所有构建工作的架构决策：要遵循的模式、要避免的依赖、正在做出的取舍以及原因。这份输出会成为聚焦的架构上下文文档，并确立 Claude Code 运作时的护栏。\n\n如果没有这些上下文，每个会话都会从零开始，Claude Code 被迫推断自己的结构性假设。让 Claude Code 在没有护栏的情况下构建，会产出功能可用但结构不连贯的代码库；而在不连贯的代码库上迭代和扩展，最终是在浪费时间和 token。迟早会到达一个临界点，代码不可避免地坍塌，迫使你从头重建。\n\n- **练习：** 在打开 Claude Code 之前，先打开 Claude 并描述你要构建的东西：它解决的核心问题、服务的用户，以及你现实预期未来六个月会达到的规模。请它帮助你定义应当支配 MVP 构建的架构原则、在你的约束下应避免的依赖，以及你在这一阶段有意识接受的取舍。\n\n接下来，把这些输出保存为 CLAUDE.md Markdown 文件。这就是你的架构上下文文档：构建工作的第一个产物，也是之后每个会话都会依赖的产物。CLAUDE.md 文件是 Claude Code 的项目级指令，为项目提供特定上下文和说明；当 Agent SDK 在某个目录下运行时，它会自动读取这些内容。从功能上说，它们就是项目的持久“记忆”。\n\n### 定义并执行 MVP 范围\n\n没有摩擦的范围蔓延，是 AI 时代 MVP 最典型的失败模式之一。正如你需要定义并记录产品应用的架构，你也需要在构建任何单一功能之前，定义 MVP 的范围。\n\nClaude 可以帮助你创建一份范围文档，说明你的 MVP 产品做什么、刻意不做什么，以及功能修订标准：在此时此刻，来自真实用户的哪些具体证据可以证明值得新增某项内容。\n\n当新功能想法出现时，而且它们一定会出现，你可以用 Claude 压力测试：这究竟是来自用户的真实信号，还是披着产品思考外衣的创始人热情。\n\n### 用 Claude Code 构建 MVP\n\n一旦架构和范围被定义好，Claude Code 就成为主要的 MVP 构建工具。用它生成、测试、调试并迭代你的代码库，但要把每个会话都视为对已做产品决策的执行，而不是顺手塞进新决策的机会。\n\n每次 Claude Code 会话开始时，都要（1）重新查看你的范围文档，（2）向模型提供 CLAUDE.md 架构上下文文档。每次会话结束时，用本次会话暴露出的任何决策更新它。目标是得到一个你能够解释其结构的代码库，而不只是一个能跑的代码库。\n\n- **练习：** 为 Claude Code 工作创建一个简单的会话模板，其中包括架构上下文文档、本次会话的具体任务，以及需要遵守的约束或模式。每次会话结束时，在上下文文档中添加一条简短日志，说明构建了什么、做出了什么决策，以及本次会话引入了哪些假设。每次花五分钟做文档，是防止架构漂移复利成不可管理代码库的廉价保险。\n\n### 任何用户接触之前进行安全审查\n\n作为 AI 原生创业公司的创始人，你有责任知道代码库里有什么，理解任何潜在暴露路径，并且不要把明显漏洞交付给信任你数据的真实用户。\n\nClaude 可以对 AI 生成的代码做有用的第一轮安全审查，并帮助识别常见漏洞。这是发布前值得纳入循环的好习惯。但它不能替代安全工具；在风险更高的场景中，也不能替代人类审查者。把它当成替代品的创始人，往往会成为安全事故故事里的主角。\n\nClaude Code Security 更进一步：它会扫描代码库中的安全漏洞，并提出供人类审查的定向补丁，暴露出传统方法可能漏掉的问题。\n\n> 注：在本电子书发布时，Claude Code Security 仍处于有限 beta 阶段。因此，在把它纳入你的工作流之前，请检查当前可用性。\n\n- **练习：** 在部署给任何真实用户之前，用一个明确 brief 让 Claude 审查你的核心应用代码：检查认证和会话处理、API 响应中的数据暴露、输入校验和注入风险，以及存在已知漏洞的依赖。认真对待每一项发现，并评估是否需要修复。凡是涉及认证、密钥或数据处理的内容，都应有人类审查。\n\n### 在发布前建立度量框架\n\n那些把早期牵引误认为产品-市场匹配的创始人，通常也是发布后才开始追踪数据的人。他们选择指标是为了评估哪些东西有效，而不是为了暴露哪些东西无效。解药是在第一个用户出现之前，就建立度量框架。\n\n用 Claude 定义哪些指标对你的具体产品重要，基准是什么，以及数据中的哪些模式可以构成真正的产品-市场匹配，哪些只是好看的噪音。具体来说，在发布 MVP 之前，就设定留存基准、激活标准，以及第 7 天和第 30 天目标。\n\n接下来，为你的具体产品定义什么叫假阳性：例如，有注册但没有激活，有收入但没有留存，或者一开始很兴奋但没有重复使用。当数据到来时，让 Claude 针对你的牵引表现提出反方论证：一个怀疑者会如何解释这些数字？\n\n### 管理发现和用户反馈的运营工作\n\n一旦真实用户进入产品，运营层面的工作会迅速扩张。Claude Cowork 可以处理那些重要但繁琐的工作，例如建立和维护用户联系人名单、运行触达序列、安排反馈会议、分流 bug 报告，以及跟踪迭代周期。想法阶段用于管理发现工作的同一套 MCP 集成，在这里同样适用。\n\n对于用户反馈中需要细腻探索的部分，仍然要让人参与收集循环。例如，用户说“这个很好，但我希望它也能……”，这需要解释：这是核心需求，还是锦上添花？它是这个客户特有的，还是代表某个细分人群？缺失的功能才是真问题，还是上游的 onboarding 出了问题？没有工具能替你回答这些问题。\n\n- **练习：** 配置 Claude Cowork 来运行你的 MVP 阶段反馈循环：向早期用户名单起草触达内容，安排反馈会议，为 bug 报告和功能请求设计结构化收集流程，并每周写一份汇总。先由你自己审阅汇总；之后，你可以让 Claude 分析这些信息，捕捉你可能遗漏的重要点。\n\n### 朝证据迭代，而不是朝完整度迭代\n\nMVP 阶段结束的标志，是你拥有真正的产品-市场匹配证据，不管产品感觉上是否“完成”。宣布你已经实现产品-市场匹配、准备从 MVP 阶段进入发布阶段，本质上是一项判断练习，需要把创始人的直觉和已收集证据结合起来。不过，也有一些有用的试金石：\n\n- **Sean Ellis 测试：** 问你的活跃用户：“如果你不能再使用这个产品，你会有什么感受？”如果超过 40% 的人回答“非常失望”，这是一个有意义的 PMF 指标。\n- **努力程度测试：** 在产品-市场匹配之前，留存需要持续干预，包括频繁触达、激励、个人跟进，以及创始人投入大量近乎英雄式的精力来维持用户参与。产品-市场匹配之后，产品开始自己完成这项工作。当事情开始从“推”变成“拉”，这种努力方向的变化，就是某种真实改变已经发生的最清晰信号之一。\n\n归根结底，没有任何单一数据点能够确认产品-市场匹配。它必须是在多个迭代周期中持续成立的一种模式，你才能真正说它已经发生。\n\n### 当证据要求时就转向\n\n如果你投入了所有这些工作，却仍然无法实现产品-市场匹配，该怎么办？你的结果没有确认最初的方向，并不代表失败，而是系统正在正常工作：MVP 阶段的设计目的，就是在你对错误答案过度投入之前，把这些信息暴露出来。\n\n当数据不支持当前产品时，用 Claude 一起梳理这些数据到底在告诉你什么。\n\n- **探索替代客户细分。** 也许那些没有转化的用户，从一开始就不是正确目标。很多时候，正确受众已经存在于你的数据中，只是权重被低估了。\n- **调整产品价值主张。** 也许你的受众是正确的，但 MVP 没有真正引起用户共鸣。调整 onboarding、信息表达或核心功能强调，有可能在不改变已构建内容的情况下解决这个问题。\n\n同时，也要对一种可能性保持开放：断裂可能足够深，需要更根本的改变。\n\n- **练习：** 如果你已经完成三轮或更多迭代周期，却没有朝产品-市场匹配基准取得有意义的进展，就先用 Claude 做一次诊断，再决定下一步。把你的留存数据、用户反馈和最初的问题假设交给它，并问三个问题：\n\n  - 这些数据中，是否有某个细分人群的反应不同于其他人？\n  - 设计价值和体验价值之间的缺口，是定位问题，还是产品问题？\n  - 如果当前产品要找到真正的 PMF，哪些事情必须为真？根据你现在看到的情况，这种场景现实吗？\n\n让答案决定你是调整、转向，还是回到想法阶段。\r\n\r\n","wordCount":5432},{"id":"founders-playbook-part-1-5","bookId":"founders-playbook","fileName":"Founders_Playbook_Ch5_Resources.zh.md","partKey":"part-1","partTitle":"正文","chapterInPart":5,"globalChapter":5,"title":"第 5 章：发布阶段","markdown":"# 第 5 章：发布阶段\n\n如果说 MVP 阶段是在证明你的产品值得存在，那么发布阶段就是在证明你的业务值得增长。\n\n## 发布阶段目标\n\n在发布阶段，创业者必须把早期牵引力转化为可重复、可持续的增长引擎。除了让产品具备生产可用性，你还必须加固底层基础设施，同时围绕产品真正搭起一家公司。\n\n在想法阶段和 MVP 阶段，创业公司天然会以创始人为中心，因为你需要完整的现场感和紧密的反馈回路。但到了现在，如果创始人仍试图亲自抓住每一条线索，就会变成发布阶段的瓶颈。目标不是把你自己从公司里拿掉，而是建立一套运营系统，把你的注意力释放出来，留给那些只有创始人才能做的判断。\n\n## 发布阶段退出标准\n\n发布阶段的退出条件包含三个要素：\n\n1. 增长是可重复的，并且由渠道驱动。你不只是留住用户，还能通过明确渠道可预测地获得用户，并理解背后的单位经济模型：CAC、LTV 和回本周期，都是你知道且能讲清楚的数字。\n2. 产品能够承载生产负载。基础设施已经加固，安全与合规安排到位，并且在真实生产条件下保持可靠，而不只是能通过你测试过的场景。\n3. 运营不再卡在创始人身上。流程已经存在，自动化已经落地。你不再是那个亲自处理支持、分诊、冲刺规划或报告的人。\n\n## 发布阶段挑战\n\n找到产品-市场匹配，是早期创业生命周期里最难的问题。现在，创始人的挑战变成了守住它。发布阶段正是这样一个地方：公司已经找到了真实的产品牵引力，却仍可能因为围绕产品、支撑产品的组织跟不上而散掉。下面是需要警惕的失败模式。\n\n### 技术债开始到期\n\n挑战：为了速度和验证而搭出的 MVP 代码库，足以证明产品能跑起来；但生产流量、新功能和不断增长的复杂度，正在暴露当初留下的捷径。\n\n在 MVP 阶段，积累一些技术债是为速度付出的合理代价。到了发布阶段，这些债务开始产生利息，而且拖得越久，修复成本就越高。\n\n解决办法是做一次系统性的架构审计，找出结构性薄弱点；对最严重的问题进行有针对性的重构；并显著扩展测试覆盖率，避免下一轮功能开发又把同样的问题带回来。\n\n### 创始人成为瓶颈\n\n挑战：在 MVP 阶段，创始人参与每一个环节是一种优势。到了发布阶段，支持请求变多、产品决策堆积、运营复杂度成倍上升，同样的本能就会变成约束。\n\n从“亲自做事”转向“设计能做事的系统”，是创业生命周期里最困难的转变之一。因为它很少有一个清晰发生的时刻，所以真正的风险是完全错过这次转变：你还停留在建设者模式里，而组织已经在你周围停滞。明显的信号包括：本该一小时完成的决策，现在要等你一周才轮到；支持请求越积越多，因为只有你知道答案；运营任务只有在你本人想起来时才会发生。\n\n补救办法是彻底审视所有仍由你亲自处理的事情，从最小的任务到风险最高的决策都包括在内，然后判断哪些可以系统化，哪些可以委派，哪些确实仍值得创始人投入时间和注意力。\n\n### 安全与合规不能再往后推\n\n挑战：在 MVP 阶段，保持安全与合规措施简单是可以接受的；但现在有了真实用户、真实数据，并且可能开始面对企业合同，这就会变成风险。\n\n在 MVP 阶段，如果只有少量测试用户，生产环境里也没有敏感数据，安全漏洞更多是理论风险。但一旦产品进入生产环境，有真实用户依赖它，那个“假设中的问题”就会变成非常现实的暴露风险。与此同时，原型阶段不适用的合规要求，一旦你开始处理客户数据、处理付款，或面向受监管行业销售，就一定会适用。\n\n补救办法是在生产规模到来之前，而不是之后，做一次系统性的安全与合规审查；并把所有暴露出来的问题都视为下一波用户到来前必须完成的整改，而不是建议项。\n\n### 还没准备好就扩张\n\n挑战：新市场和融资机会看起来像增长机会。但它们也可能是产品-市场匹配消失的地方。\n\n你已经建立起来的初始牵引力是真实的，但它也特定于你的早期受众。过早进入一个与原始市场明显不同的市场，会带来新的用户行为、合规要求、支付基础设施和基线预期，而你的产品并不是围绕这些东西设计的。突然之间，新变量太多，你会失去清晰解读自身数据的能力。你还会冒着忽视原有用户群的风险，去追逐一个尚未被验证的新受众。\n\n## Claude 如何帮助发布阶段的创始人\n\n在发布阶段，Claude 的三种形态都会被充分使用，而且它们会彼此支撑：每个工具产生的输出，都会成为另外两个工具的输入。结果会自然复利；创始人把三者一起使用时，得到的东西会超过单个工具效果的简单相加。\n\n这正是超精简创业模型在结构上成为可能的原因。当 Claude Code 构建产品，Claude Cowork 构建产品周围的公司，而 Claude 帮助把产品知识和组织知识运营化时，一个小团队就能像规模大数倍的公司一样运转。\n\n### 在技术债复利之前修复它\n\n你的 MVP 代码库能工作，但它也需要一次系统性的修复扫描，找出任何可能变成结构性负担的技术债。\n\n首先，用 Claude Code 做一次完整的架构审计：识别代码库哪里脆弱，哪些捷径会变得昂贵且难以维护，以及哪些地方的测试覆盖薄到下一轮功能开发很可能重新引入同样的问题。\n\n把 Claude Code 的审计发现再交给 Claude，让它帮助分诊并排序修复工作：哪些必须在下一次发布前修掉，哪些可以等一个冲刺，哪些在当前阶段属于可以接受的持续债务。\n\n这也是记录 MVP 阶段架构决策的时刻：那些当时因为没时间写下来、只存在你脑子里的决策。现在把它们写进 `CLAUDE.md`，可以确保未来每一次 Claude Code 会话都从同一个理解出发：系统是如何设计的，以及为什么这样设计。\n\n- 练习：让 Claude Code 审计你的 MVP 代码库，并产出一份按优先级排列的清单，列出结构性弱点、测试覆盖缺口和重构候选项。然后把这份清单交给 Claude，请它把修复工作拆到接下来几个冲刺里：哪些重大问题必须先解决，哪些可以和功能开发并行处理，哪些可以等待。\n\n### 建立能够替代创始人注意力的系统\n\n要建立一套运营系统，把你的注意力释放出来去处理只有创始人能处理的职责，前提是你必须准确知道自己的注意力流向哪里。用 Claude Cowork 对当前运营负载做一次结构化审计：记录每一项重复任务、每一个落到你桌上的决策，以及每一条只有因为你亲自记得才会发生的工作流。然后让 Claude Cowork 把这份清单分类：哪些可以完全自动化，哪些需要人但不一定需要你，哪些确实需要创始人判断。\n\n审计完成后，用 Claude Cowork 设计自动化候选项的工作流逻辑：每条工作流由什么触发，决策规则是什么，输出长什么样，完成后流向哪里。\n\n### 把安全与合规变成产品工作流\n\n用 Claude Code 找出在 SOC 2、GDPR、HIPAA 审计中经常出现的代码层问题，以及目标市场所要求的标准。这会同时暴露漏洞和合规缺口。把这些发现交给 Claude，帮助你确定修复优先级，并设计企业买家在签约前会要求看到的控制措施、审计日志和访问管理。注意：AI 扫描是辅助工具，但不能替代合格的合规审查。\n\n接下来，把合规工作流纳入开发周期，而不是把它当成一次性项目；合规文档需要持续维护和更新。对于正在接近企业合同或国际市场的创始人来说，这也是用 Claude Code 安全扫描为独立安全评估做准备的时刻。\n\n- 练习：让 Claude Code 做一次代码层安全审查，并按目标市场需要的框架来组织。把输出交给 Claude，请它产出两样东西：一份按优先级排列的安全整改顺序，以及一份文档和控制措施清单，用来满足潜在企业买家的合规审查。\n\n### 搭起你一直跳过的产品管理流程\n\n发布阶段需要一组轻量、可重复的流程，它们能够在没有创始人介入触发或推动的情况下运转。用 Claude 设计你的产品时间线和工作周期如何组织，一个规格说明在 Claude Code 开始写功能前必须包含什么，Bug 报告如何分诊和流转，以及每周指标报告覆盖什么、如何分发。\n\n流程设计完成后，用 Claude Cowork 构建并运行运营层：安排冲刺仪式，把进入的 Bug 报告路由到正确位置，从已连接的数据源汇总每周指标，并维护让用户信号持续流入产品决策的反馈回路。\n\n- 练习：请 Claude 设计一套轻量级产品管理操作系统：明确的冲刺节奏、最小规格说明模板、Bug 分诊决策树，以及一份从真实数据源拉取信息的每周指标简报。然后设置 Claude Cowork，让它实施并运行这套系统里的周期性运营元素，比如排期、路由和报告汇总，使这些事情按时发生，而不需要你。\n\n# 第 6 章：规模化阶段\n\n在规模化阶段，创始人的角色会从建设者重新转向面向公众的高管。产品仍然是核心，但你每天亲自处理的工作会越来越多地转向公司本身。你的注意力必须扩展到规模化阶段的新活动，比如分析师简报和 IPO 路演；同时，你仍要努力保持那种精简、以 AI 为中心的结构性优势。\n\n## 规模化阶段目标\n\n扩展技术基础设施的工作会继续进行，而现在还要叠加扩展组织本身、让组织成熟为一家业务公司的工作。\n\n到了规模化阶段，你面对的是从数千用户走向数百万用户，从一个市场走向多个市场。在之前每个阶段，增长都还可以靠贴近用户、基于紧密反馈回路的数据和足够多的创始人直觉来摸索。现在，目标变成了建立由成熟组织运营支撑的系统性增长。\n\n对于 AI 原生创业公司来说，你的目标应该是通过累积深度建立可防守的护城河。这种深度来自你嵌入产品中的专业知识，来自产品与你的用户所依赖的其他工具和平台之间的集成深度，也来自专有的系统数据和工作流。那些一直沿着同一个方向、在一致基础设施上持续构建的创始人，现在拥有了真正难以复制的东西。\n\n在这个阶段，公开市场投资者、分析师、监管者、企业采购团队和潜在收购方都会带来更大的压力，也会带来更强的怀疑，因为现在赌注更高了。你的产品和组织必须经得起外部审视：不只是你已经构建出来的能力，还包括围绕这些能力的治理、合规姿态、财务控制和战略叙事。\n\n## 规模化阶段退出标准\n\n规模化阶段的退出条件不再是某一个单点里程碑，而是一个阈值事件：即使创始人越来越少直接管理日常运营，公司也能持续运转。你已经证明了系统性增长；建立了能满足最苛刻外部审查者的组织治理与合规基础设施；并且能有力回答这个问题：“如果一个资金充足的既有巨头今天复制你的产品，你的用户还会留下来吗？”\n\n在实践中，这个阈值通常会以三种形式之一出现：达到不再需要外部资本的规模化可持续盈利，具备 IPO 准备度，或被收购。三者都要求你的增长是系统性的、可审计的；你的产品护城河经得起审视；你的组织在运营上成熟且可持续。\n\n当这些都成立时，就值得说一声恭喜：你的创业公司已经从一个赌注，变成了一门生意。\n\n## 规模化阶段挑战\n\n### 委派运营层\n\n挑战：规模化阶段的运营系统必须可靠、可持续地运行，不能还需要人盯着。对于从第一天起就亲力亲为的创始人来说，这个转变既是结构性挑战，也同样是心理挑战。\n\n你在发布阶段做的是创建系统；到了规模化阶段，任务变成了两件事：第一，让这些系统成熟到完全值得信任；第二，真正信任它们。\n\n这比听起来更难。即使你是一个擅长委派的创始人，也并不总能清楚知道该交出去什么、该留在自己手里什么。交得太多、太快，尤其是交给 AI 自动化系统，关键决策就可能在缺少只有创始人才能提供的关键上下文时被做出。但抓得太久，你又会变成瓶颈。\n\n这里的根本挑战，是识别那些只存在于创始人脑中或未记录工作流里的组织知识，然后把它编码进有文档、可审计、可转移的系统中。\n\n### 扩展技术运营\n\n挑战：客户不再只评估你的产品；他们还想知道你的组织是否能成为可靠的基础设施伙伴。\n\n前三个创业阶段的技术挑战主要围绕代码库：在不积累技术债的情况下构建正确方案，然后为真实用户加固安全与合规。进入规模化阶段之后，挑战变成了代码库周围的一切：创建支持基础设施、文档和可靠性保证，用这些东西传递成熟度。\n\n大型客户和机构买家在签署多年合同之前会要求看到这些东西；签约之后，他们也会按这些标准要求你。\n\n不过，把你带到今天的同一套 AI 基础设施，也能帮助你建立专门的支持职能：有明确响应时间，有新客户工程团队真正能用的文档。\n\n### 扩展组织职能\n\n挑战：一家规模化阶段的公司通常需要招聘、薪资、会计、法务运营等组织基础设施，不管实际有多少人在运转它。\n\n在发布阶段，系统化运营意味着自动化那些消耗创始人注意力的工作流。到了规模化阶段，创业公司现在需要发展出一组更广、某种程度上也更关键的运营职能，例如财务报告、合规监控、合同管理和客户支持，等等。\n\n### 建立 GTM 职能\n\n挑战：自然增长有天花板，而大多数规模化阶段的创始人会在真正建立 go-to-market 职能之前就撞上它。\n\n创意、MVP 和发布阶段的增长，往往来自创始人主导的销售：可能是一篇时机刚好的 Product Hunt 帖子，也可能是与早期客户的个人关系。但这种自然增长只能走到某个点，大多数创业公司会在规模化阶段碰到这个上限。迹象包括用户曲线变平、获客成本上升，以及销售管线只有在创始人亲自参与时才会推进。\n\n规模化阶段的增长，需要建立一个专门的增长引擎，让你的产品触达新的、更广泛的受众。不过，大多数创业创始人大概从未真正运行过营销、销售、分析师关系这类项目。一个正经的 GTM 动作不只是建立新的系统和流程，还包括创造品牌声音和产品故事，明确你想如何谈论自己的产品。因为到了创业生命周期的这个阶段，你需要的不只是触达单个新用户，还要触达投资者、企业买家这样的完整目标受众。\n\n幸运的是，GTM 职能不必很大才有效；构建产品的同一套 AI 基础设施，也可以帮助你从零启动产品走向市场的过程。\n\n## Claude 如何帮助规模化阶段的创始人\n\n在早期创业阶段，Claude 是产品本身的基础设施：它是验证创意的研究伙伴，是设计并构建原型的工程团队，也是让单创始人创业成为可能的 AI 运营层。到达规模化阶段的 AI 原生创业者，现在可以继续用 Claude、Claude Code 和 Claude Cowork，以他们当初构建公司的方式继续扩展公司。\n\n### 把日常任务交给 Claude Cowork\n\n进入规模化阶段时，先清醒地看清你现在最需要把时间和注意力投入在哪里。对于从未建立过一家公司的首次创业者来说，这可能并不容易。Claude 可以帮助你列出在这个阶段只有你应该做的事情，比如产品叙事决策、董事会关系、企业级交易，以及创始人与创始人之间的对话。凡是不在这张清单上的事项，都是委派或交给 Claude Cowork 自动化的候选项。\n\n- 练习：用 Claude 为你当前的运营层制作一张瓶颈地图：所有目前经过你的工作流、决策和审批。然后请 Claude 推演：如果你一周不可用，每一项会发生什么。那些停滞的工作流，就是你仍然亲自参与到足以拖慢进展的地方。\n\n这些内容与你之前用 Claude 梳理出的创始人优先事项和责任清单如何对应？\n\n接下来，就该压力测试你已经建立的系统，看看它们是否真的准备好随着业务增长一起扩展。\n\n- 练习：用 Claude 梳理你当前的工作流，然后请它分析：如果你一周不可用，每一项会发生什么。那些停滞的工作流，就是交接标准、升级路径或异常处理仍需收紧的地方。Claude 可以帮助分析失败点，并建议合适的修复方式，让你按需更新或替换 Claude Cowork 自动化。\n\n### 将技术运营扩展为企业级基础设施\n\n随着规模扩大，买家需要确信你的产品和组织值得作为长期基础设施来信任。代码库内部的技术工作当然仍会继续，但现在，代码库周围也有技术工作需要处理。\n\n第一步是把组织知识转化为可扩展的系统。用 Claude 起草并维护企业采购预期会看到的书面基础设施，包括产品文档、支持手册和 SLA。\n\n与此同时，让 Claude Code 按照企业合同要求的具体可靠性和安全标准审计并加固代码库，并补齐 Discord 社群式支持从来不必提供的技术支持基础设施：日志、监控、事故响应工具，以及让 SLA 真正可执行的可观测性层。\n\n随后，Claude Cowork 运行企业支持本身的运营层：工单路由、升级工作流、由产品变更触发的文档更新、续约跟踪，以及企业客户成功所依赖的报告节奏。三者结合起来，可以让一个小团队呈现出大型组织的支持姿态，而这正是签下多年企业合同前你必须证明的东西。\n\n- 练习：挑出三个最苛刻的潜在客户，或确定三个你很想签下的理想客户。请 Claude 做一份差距分析：这些客户的企业采购团队在签署多年合同前，会期待看到哪些文档、SLA 和支持基础设施？你现在还差在哪里？用输出结果在 Claude Code 和 Claude Cowork 之间安排技术与文档工作的顺序。\n\n### 建立真正的 GTM 职能\n\n创始人的拼劲把你带到了这里，但要扩展创业公司，你需要创建并执行真正的 go-to-market 战略。AI 可以帮助你构建，然后运行这整套 GTM 引擎。\n\nClaude 可以从零开始帮助搭建基础 GTM 资源：市场细分、信息架构、分析师关系策略、销售手册，以及当你开始面对公开市场投资者、企业买家和华尔街分析师时真正重要的投资者指标叙事。每类受众都有自己的词汇，也会按自己的标准评估你；Claude 的工作，是把你产品的价值主张翻译成适合每个受众细分的产品营销方法。\n\n现在，Claude Cowork 可以成为你的战术执行层：内容管线、外联序列、分析师简报的后勤安排、新闻与公关节奏、CRM 卫生、销售管线报告，以及许多把 GTM 战略转化为实际商业动作的周期性循环。\n\n当 GTM 动作需要产品营销基础设施时，比如交互式演示环境、集成文档、沙盒租户、API 参考、技术一页纸，Claude Code 可以为你构建。买家会期待从技术上评估你的产品；在规模化阶段，一个 Loom 视频和一份销售幻灯片已经不够了。这也是让你的 GTM 动作异步运行的基础设施：一个做得好的演示环境，可以在你参加董事会会议时帮你推进交易。\n\n### 把领域专业知识和组织知识转化为 AI 上下文\n\n许多超精简创业创始人，正在为某个真实世界问题构建高度具体的应用或工具，而这个问题通常来自他们在某个行业里的亲身经历或一线观察。智能体式 AI 现在让从未写过一行代码的创始人，也能用自己的领域专业知识构建解决复杂问题的产品。Claude、Claude Code 和 Claude Cowork 分别参与其中，把创始人知识转化为不断复利的产品具体性。\n\n用 Claude 捕捉、组织并打磨创始人知识，就是把领域专业知识放到产品能够触及的位置。通过长对话、项目和记忆，创始人可以把自己知道的一切都分享出来：行业黑话、监管陷阱、边缘案例、挫败感、为什么这个问题显而易见的答案行不通。这些内容会进入结构化、可搜索的上下文。Skills 随后可以把重复出现的工作流，比如“我如何审计一份商业租约”“我如何分诊一份患者 intake 表”，编码成 Claude 每次都以同样方式运行的可复用例程。几个月后，这会变成一层专有知识基底，任何通用 AI 都难以匹敌。\n\n用 Claude 外化你的领域知识，对于把行业特定边缘案例编码进产品非常有价值。比如，一个通用 AI 医疗账单工具可能会在 340B 药品项目理赔上失效，而你的产品有针对它们的具体逻辑。Claude Code 帮助你把同行专业人士常见的挫败点，转化为校验逻辑、提示词优化，或与某个竞争对手没听说过的小众行业系统之间的 MCP 集成。结果是，你的应用或工具在深度和广度上都会持续复利，而竞争对手根本难以复制。\n\n- 练习：找出一个通用竞争对手在你所在垂直领域里一定会做错的边缘案例。和 Claude Code 一起，基于你真实见过的场景，为它构建一个专门测试用例，不是单元测试。每当类似边缘案例出现，就把它加进去。你的测试套件会变成一张护城河地图。\n\n### 将累积的用户数据复利成可防守优势\n\n当用户与你的产品互动时，他们会产生行为信号，也就是他们接受哪些输出、拒绝哪些输出。这些信号会反过来影响产品路线图。随着时间推移，你会理解自己特定用户群体的具体模式、偏好和边缘案例。所谓复利价值，就是这个意思：每一次改进都会让产品更有用，进而带来更多使用，更多使用创造更多反馈，更多反馈又推动更多改进。\n\n这些数据是被时间锁定的、上下文特定的，而且复制者不可能重建：你无法直接买到数千名用户在你的产品里不断打磨自己工作流后留下的行为指纹。\n\nClaude 可以帮助审计你已经收集的用户交互数据，找出其中信号最高的行为模式，并设计把持续使用转化为系统性模型改进的反馈回路。\n\n- 练习：把你的产品交互数据摘要交给 Claude：你一直在收集什么，收集了多久，以及你知道用户如何随着时间与你的产品互动。请它识别这些数据中信号最高的三种行为模式，并为每一种设计一个反馈回路，把它转化为系统性模型改进。然后请它帮助你起草一页护城河叙事，用于产品营销：你的数据飞轮如何运转，已经转了多久，以及为什么一个资源充足、今天才开始的竞争对手无法在两年内复制它。\n\n### 创造工作流锁定\n\n复利的数据网络效应让你的产品更难被复制，而用户工作流锁定让你的产品更难被离开。用户在日常运营中使用你的产品越久，它就越深地嵌入他们真正工作的方式里。他们在它之上建立了自动化，培训了人员使用它，并把它连接到自己的数据源和其他工具。他们开发的提示词、打磨的工作流、标准化的输出，都已经围绕你的产品做什么、如何做而成形。到了这个点，切换不再是一个产品决策，而会变成一个完整的运营项目。\n\n创造工作流锁定的第一步，是请 Claude 按集成深度绘制你当前客户群的地图。对每个客户细分，识别他们在你的产品之上建立了哪些工作流，以及他们依赖哪些集成。这会显示你的产品在哪里真正黏住了客户，以及哪里还需要更深。\n\n你提供的集成越多，客户就有越多空间构建依赖你产品的工作流。Claude Code 可以帮助你快速搭起与目标用户依赖的数据管线、项目管理工具和其他系统之间的原生集成。Claude Code 也可以构建 API、webhook 和 SDK，让客户不只是使用你的产品，而是在它之上继续构建。这是最深层的锁定。\n\n- 练习：请 Claude 帮你为前十名客户做一次工作流集成审计。对每个客户，记录他们建立的自动化、依赖的集成、经过你产品的团队工作流，以及你对其切换成本的估计。然后请 Claude 识别这组客户中的模式：对你的具体产品来说，哪些类型的集成会创造最深的锁定？你可以构建或开放什么，来加深那些目前还停留在表层的客户集成？\n\n# 第 7 章：同一份工作，新的规则\n\n在 AI 时代，创始人的工作并没有改变：找到一个真实问题，构建能解决它的东西，并把它扩展成一家重要的公司。改变的是到达那里的路径。贯穿创意、MVP、发布和规模化这四个阶段，AI 把原本以季度计的事情压缩成了以周计。\n\n过去需要几个月的验证循环，现在一个下午就能完成。一个可运行的原型不再需要一个技术栈正好匹配的联合创始人；它需要的是一个清晰的问题，以及和编码智能体进行几次聚焦会话。发布准备从上线前的混乱冲刺，压缩成一个持续的工作流。到了规模化阶段，过去会迫使早期员工陷入救火角色的运营重量，也越来越可以交给 AI，让团队把注意力放在那些会成为护城河的判断题上。\n\n瓶颈不再是你能构建什么，而是你选择构建什么。\n\n# 资源\n\n## 用 Claude 构建\n\n- Building AI Agents for Startups：分享创业公司如何使用智能体，在规模化过程中减少对创始人的依赖。\n- Claude Code docs：带领构建者从初始安装走向高级 智能体式工作流。专业提示：可以从“How Claude Code works”概览开始。\n- Claude Code best practices：覆盖 Anthropic 内部以及多个工程团队已经验证有效的模式，包括上下文管理、权限、规划和验证工作流。\n- Using CLAUDE.md files：讲解如何为你的具体代码库配置 Claude Code。\r\n\r\n","wordCount":9473}],"chapterCount":5,"wordCount":24373}]}</script>
